e in der zweiten Reihe, neben Herrn Bauer, in einem geliehenen schwarzen Hemd. Seine Kollegin aus dem Büro saß im Publikum. Danach sagte sie: „Ich wusste nicht, dass du singen kannst.“","„Kann ich auch nicht“, sagte Abebe. „Aber Herr Bauer sagt, das ist egal. Hauptsache, man ist da.“"],"g":[["Schwarzes Brett","noticeboard"],["dringend","urgent"],["Vorkenntnisse","prior knowledge"],["proben","to rehearse"],["Gemeindehaus","parish hall"],["Chorleiterin","choir director"],["Tonleiter","scale"],["einen Ton treffen","to hit a note"],["Volkslied","folk song"],["Noten","sheet music"],["ausfragen","to question (closely)"],["geliehen","borrowed"],["Publikum","audience"],["Hauptsache","the main thing is"]],"q":[["Warum geht Abebe zum Chor?","Der Aushang sucht dringend Männer, ohne Vorkenntnisse.","Eine Einladung."],["Wie wird er empfangen?","Mit Begeisterung – ein junger Mann!","Der Chor ist alt."],["Wer hilft ihm?","Herr Bauer, der achtzigjährige Tenor.","Er zeigt ihm die Noten."],["Was ist die Botschaft am Ende?","Dabei sein ist wichtiger als perfekt singen.","„Hauptsache, man ist da.“"]],"teaser":"Ein Aushang, ein Chor mit zu wenigen Tenören und ein Neuer, der eigentlich nicht singen kann.","words":290},{"id":"praktikum","title":"Der Praktikant und der Kaffee","level":"B2","topic":"Arbeit · Junge Leute","min":3,"p":["„Kaffee kochen kannst du, oder?“, fragte Herr Behrens am ersten Morgen.","Lukas, neunzehn Jahre alt, Praktikant in einer Marketingagentur, nickte. Er hatte sich das Praktikum anders vorgestellt.","Eine Woche lang kochte er Kaffee, kopierte Unterlagen und sortierte Post. Am Freitag beschwerte er sich bei seiner Mutter. „Ich lerne gar nichts. Ich bin nur der Kaffeejunge.“","„Dann frag nach mehr“, sagte sie. „Aber freundlich.“","Am Montag nahm Lukas seinen Mut zusammen. „Herr Behrens, darf ich Sie was fragen? Ich mache den Kaffee gern. Aber ich würde auch gern bei einem echten Projekt mithelfen. Gibt es da eine Möglichkeit?“","Herr Behrens lehnte sich zurück. „Hm. Kennst du dich mit TikTok aus?“","„Ja, total.“","„Wir haben einen Kunden, eine Bäckerei. Die wollen junge Leute erreichen, haben aber keine Ahnung von Social Media. Wir auch nicht, ehrlich gesagt. Mach mal drei Ideen bis Mittwoch.“","Lukas arbeitete zwei Abende daran. Am Mittwoch zeigte er drei Ideen: ein Video, in dem der alte Bäckermeister Brezeln in Zeitlupe formt; eine „Brezel-Challenge“, bei der Leute ihre eigenen Brezeln zeigen; und kurze Clips, in denen der Bäcker schwäbische Wörter erklärt.","Herr Behrens schaute sich alles schweigend an. Dann sagte er: „Die dritte Idee ist genial. Die präsentierst du nächste Woche dem Kunden. Selbst.“","„Ich? Selbst?“","„Es ist deine Idee.“","Die Präsentation war aufregend. Lukas sprach zu schnell, vergaß einen Satz und ließ fast den Laptop fallen. Aber der Bäcker lachte über die Idee und sagte am Ende: „Machen wir.“","Das erste Video bekam zwanzigtausend Aufrufe. Am letzten Tag seines Praktikums sagte Herr Behrens: „Wenn du nach dem Abi studierst, hast du hier einen Werkstudentenjob. Und den Kaffee kochst du dann nur noch für dich.“"],"g":[["Praktikant","intern"],["Praktikum","internship"],["Unterlagen","documents"],["sich beschweren","to complain"],["den Mut zusammennehmen","to pluck up courage"],["sich auskennen mit","to know about"],["erreichen","to reach"],["Zeitlupe","slow motion"],["genial","brilliant"],["präsentieren","to present"],["aufregend","exciting"],["Aufrufe","views"],["Abi (Abitur)","German A-levels"],["Werkstudent","working student"]],"q":[["Warum ist Lukas unzufrieden?","Er kocht nur Kaffee und lernt nichts.","Erste Woche."],["Wie fragt er nach mehr?","Freundlich: Er macht den Kaffee gern, möchte aber auch an einem Projekt mitarbeiten.","Rat der Mutter."],["Welche Idee gefällt Herrn Behrens am besten?","Clips, in denen der Bäcker schwäbische Wörter erklärt.","Die dritte Idee."],["Was bekommt Lukas am Ende?","Das Angebot eines Werkstudentenjobs.","Durch Initiative."]],"teaser":"Ein Praktikum, das mit Kaffeekochen beginnt und mit einer echten Aufgabe endet.","words":275},{"id":"tierarzt","title":"Kater Moritz frisst nicht","level":"B2","topic":"Haustiere · Gesundheit","min":3,"p":["„Seit wann frisst er nicht mehr?“, fragte die Tierärztin und streichelte Moritz über den Kopf.","„Seit gestern Abend“, sagte Nour. „Er liegt nur unter dem Bett. Und er hat zweimal erbrochen.“","„Hat er etwas Ungewöhnliches gefressen? Eine Pflanze? Ein Gummiband?“","Nour überlegte. „Ich hatte gestern Blumen auf dem Tisch. Lilien.“","Die Tierärztin wurde sofort ernst. „Lilien sind für Katzen sehr giftig. Schon ein bisschen Blütenstaub reicht. Gut, dass Sie gekommen sind. Wir machen eine Blutuntersuchung und geben ihm eine Infusion.“","Nour wurde blass. „Ist es gefährlich?“","„Wenn man es früh behandelt, haben Katzen gute Chancen. Sie haben es früh gemerkt.“","Moritz blieb zwei Nächte in der Tierklinik. Am dritten Tag durfte Nour ihn abholen. Er war müde, aber er fraß wieder, und zu Hause legte er sich sofort auf ihren Pullover.","Die Rechnung war hoch: 340 Euro. Nour zahlte sie ohne Diskussion. Am Abend warf sie alle Blumen weg, schrieb eine Liste mit giftigen Pflanzen und klebte sie an den Kühlschrank. Ganz oben, in Großbuchstaben: LILIEN."],"g":[["fressen","to eat (animals)"],["erbrechen","to vomit"],["ungewöhnlich","unusual"],["giftig","poisonous"],["Blütenstaub","pollen"],["Blutuntersuchung","blood test"],["Infusion","drip"],["blass werden","to turn pale"],["behandeln","to treat"],["abholen","to pick up"],["Großbuchstaben","capital letters"]],"q":[["Was sind die Symptome von Moritz?","Er frisst nicht, versteckt sich und hat erbrochen.","Seit gestern Abend."],["Was ist die Ursache?","Giftige Lilien.","Schon Blütenstaub reicht."],["Warum hat Moritz gute Chancen?","Nour hat es früh bemerkt.","Frühe Behandlung."],["Was macht Nour danach?","Sie wirft die Blumen weg und schreibt eine Liste giftiger Pflanzen.","Vorsorge."]],"teaser":"Ein kranker Kater, eine Tierärztin und viele neue Wörter für den Notfall.","words":166},{"id":"grillen","title":"Grillen im Park","level":"B2","topic":"Freizeit · Freunde","min":3,"p":["„Wer bringt den Grill mit?“, fragte Tim in der Gruppe.","„Ich hab einen Einweggrill gekauft“, schrieb Amara.","„Einweggrill? Im Park verboten!“, schrieb Jonas sofort. „Nur auf den Grillplätzen. Und ohne Einweg, die verbrennen den Rasen.“","Am Ende trafen sie sich an einem offiziellen Grillplatz im Rosensteinpark. Jonas brachte einen richtigen Grill mit, Holzkohle und ein ganzes Arsenal an Zangen. Amara brachte Salat. Tim brachte Bier und vergaß den Flaschenöffner.","„Kein Problem“, sagte Jonas und öffnete eine Flasche mit dem Feuerzeug. Amara war beeindruckt. „Wo hast du das gelernt?“","„Jeder Deutsche lernt das. Mit sechzehn. Ist wie Fahrradfahren.“","Dann kam der wichtigste Moment: die Würstchen. Jonas stellte sich an den Grill wie ein Kapitän ans Steuer. „Niemand fasst die Würstchen an. Die müssen langsam. Nicht so oft wenden.“","„Warum ist der so streng?“, flüsterte Amara.","„Grillen ist in Deutschland eine Religion“, flüsterte Tim zurück. „Jonas ist der Priester.“","Die Würstchen waren perfekt. Sie aßen mit Senf und Brötchen, bis die Sonne unterging. Beim Aufräumen nahmen sie allen Müll mit, auch den von anderen. „Das macht man so“, sagte Jonas. „Den Platz sauberer verlassen, als man ihn gefunden hat.“"],"g":[["Einweggrill","disposable barbecue"],["verboten","forbidden"],["Grillplatz","designated barbecue area"],["Rasen","lawn"],["Holzkohle","charcoal"],["Zange","tongs"],["Flaschenöffner","bottle opener"],["Feuerzeug","lighter"],["Steuer","helm, wheel"],["wenden","to turn over"],["streng","strict"],["Senf","mustard"],["Müll","rubbish"]],"q":[["Warum ist der Einweggrill keine gute Idee?","Er ist im Park verboten und verbrennt den Rasen.","Nur auf Grillplätzen grillen."],["Was beeindruckt Amara?","Jonas öffnet eine Flasche mit dem Feuerzeug.","„Ist wie Fahrradfahren.“"],["Warum ist Jonas am Grill so streng?","Grillen ist für ihn eine Art Religion.","Würstchen langsam, selten wenden."],["Welche Regel gilt beim Aufräumen?","Den Platz sauberer verlassen, als man ihn gefunden hat.","Auch fremden Müll mitnehmen."]],"teaser":"Ein Sommerabend, ein Einweggrill und die heilige Frage: Wer kümmert sich um die Würstchen?","words":187},{"id":"kuendigung","title":"Das Fitnessstudio lässt mich nicht gehen","level":"B2","topic":"Verträge · Verbraucher","min":3,"p":["Vor zwei Jahren hatte Selin einen Vertrag im Fitnessstudio unterschrieben. Sie war ungefähr zehnmal hingegangen. Jetzt wollte sie kündigen.","„Ihr Vertrag hat sich leider schon um ein Jahr verlängert“, sagte der Mann am Empfang. „Die Kündigungsfrist war drei Monate vor Ende der Laufzeit.“","„Ein ganzes Jahr? Für etwas, das ich nicht nutze?“","„Steht im Vertrag.“","Selin ging nach Hause und recherchierte. Sie fand heraus, dass seit einigen Jahren neue Regeln gelten: Verträge, die sich automatisch verlängern, kann man danach mit einer Frist von einem Monat kündigen.","Am nächsten Tag kam sie wieder, mit einem ausgedruckten Kündigungsschreiben. „Ich kündige meinen Vertrag mit einer Frist von einem Monat. Das ist bei verlängerten Verträgen gesetzlich erlaubt. Bitte bestätigen Sie mir die Kündigung schriftlich.“","Der Mann las das Schreiben, dann sah er sie an. „Das muss ich mit meinem Chef klären.“","Zwei Tage später kam eine E-Mail: „Hiermit bestätigen wir Ihre Kündigung zum Ende des nächsten Monats.“","Selin druckte die E-Mail aus und legte sie in einen Ordner mit der Aufschrift „Verträge“. Dann kaufte sie sich Laufschuhe. Laufen im Park, dachte sie, hat keine Kündigungsfrist."],"g":[["unterschreiben","to sign"],["kündigen","to cancel, terminate"],["sich verlängern","to be extended"],["Kündigungsfrist","notice period"],["Laufzeit","term (of a contract)"],["nutzen","to use"],["recherchieren","to research"],["Kündigungsschreiben","cancellation letter"],["gesetzlich","legally"],["schriftlich","in writing"],["klären","to clarify"],["Ordner","folder"]],"q":[["Warum kann Selin zuerst nicht kündigen?","Der Vertrag hat sich automatisch um ein Jahr verlängert.","Frist verpasst."],["Was findet sie heraus?","Verlängerte Verträge kann man mit einem Monat Frist kündigen.","Neue Regeln."],["Wie geht sie vor?","Mit einem schriftlichen Kündigungsschreiben und Bitte um Bestätigung.","Sachlich und bestimmt."],["Was ist der Witz am Ende?","Laufen im Park hat keine Kündigungsfrist.","Ironie."]],"teaser":"Ein Vertrag, der sich automatisch verlängert, und die Kunst, rechtzeitig zu kündigen.","words":181},{"id":"wandern","title":"Die falsche Abzweigung","level":"B2","topic":"Natur · Wandern","min":3,"p":["„Wir müssen links“, sagte Paula und zeigte auf die Karte.","„Rechts“, sagte Ahmed und zeigte auf sein Handy. „Das Handy sagt rechts.“","„Das Handy hat hier keinen Empfang.“","Sie gingen links. Nach einer Stunde standen sie auf einer Wiese mit Kühen, aber ohne Weg. Die Kühe schauten neugierig. Es fing an zu regnen.","„Ich hab dir gesagt, rechts“, sagte Ahmed.","„Das Handy hatte keinen Empfang!“","„Aber es hatte recht.“","Sie stritten noch zehn Minuten, dann sahen sie in der Ferne ein Haus mit einem Schild: „Wanderheim – geöffnet“. Sie liefen hin, nass und hungrig.","Drinnen war es warm. Ein Wirt mit Schnurrbart stellte ihnen sofort zwei Tassen Tee hin. „Verlaufen?“, fragte er.","„Ein bisschen“, sagte Paula.","„Passiert hier jeden Tag. Die Abzweigung am Waldrand ist schlecht markiert. Ich sag's der Gemeinde seit zehn Jahren.“ Er zeigte ihnen auf der Karte, wo sie waren. Sie waren genau fünf Kilometer in die falsche Richtung gelaufen.","Sie aßen Linsen mit Spätzle und warteten, bis der Regen aufhörte. Dann brachte der Wirt sie mit dem Auto zum Parkplatz. „Ihr seid nicht die Ersten“, sagte er. „Und nicht die Letzten.“","Im Auto sagte Ahmed: „Nächstes Mal nehme ich eine Offline-Karte.“ Paula sagte: „Nächstes Mal geh ich rechts.“"],"g":[["Abzweigung","turning, fork"],["Empfang","reception (signal)"],["Wiese","meadow"],["neugierig","curious"],["recht haben","to be right"],["in der Ferne","in the distance"],["Wirt","landlord, innkeeper"],["sich verlaufen","to get lost (on foot)"],["markieren","to mark"],["Gemeinde","municipality"],["Richtung","direction"]],"q":[["Warum streiten Paula und Ahmed?","Über die Richtung: Karte gegen Handy.","Kein Empfang."],["Wo landen sie?","Auf einer Wiese mit Kühen, ohne Weg, im Regen.","Falsche Abzweigung."],["Was erklärt der Wirt?","Die Abzweigung ist schlecht markiert; das passiert täglich.","Er bringt sie zurück."],["Was nehmen sie sich vor?","Offline-Karte und das nächste Mal rechts gehen.","Beide lernen etwas."]],"teaser":"Eine Wanderung auf der Schwäbischen Alb, eine Karte, die keiner lesen kann, und ein Wirt, der rettet.","words":202},{"id":"ehrenamt2","title":"Lesepatin","level":"B2","topic":"Ehrenamt · Kinder","min":3,"p":["Die Schule suchte Lesepaten: Erwachsene, die einmal pro Woche mit einem Kind lesen. Zeynep meldete sich, obwohl sie unsicher war. „Mein Deutsch ist nicht perfekt“, sagte sie zur Lehrerin.","„Das macht nichts“, sagte die Lehrerin. „Elias braucht vor allem jemanden, der Zeit hat.“","Elias war acht, las langsam und hasste Bücher. Am ersten Tag schob er das Buch weg. „Langweilig.“","Zeynep überlegte. „Weißt du was? Ich lerne auch noch Deutsch. Vielleicht kannst du mir helfen.“","Elias schaute sie misstrauisch an. „Du bist erwachsen. Du kannst doch lesen.“","„Auf Türkisch ja. Auf Deutsch kenne ich viele Wörter nicht.“","Das veränderte alles. Plötzlich war Elias der Lehrer. Er erklärte ihr Wörter wie „Grashüpfer“ und „Schatzkiste“, und dabei las er, ohne es zu merken. Wenn er stockte, fragte Zeynep: „Wie spricht man das aus?“ und er versuchte es, bis es klappte.","Nach drei Monaten las Elias ein ganzes Buch über Piraten. Zeynep lernte dabei, dass „Ahoi“ kein normales deutsches Wort ist. Beim Abschied vor den Sommerferien gab Elias ihr ein selbst gemaltes Bild: zwei Piraten auf einem Schiff. Darunter stand in krummer Schrift: „Für meine Schülerin.“"],"g":[["Lesepatin","reading mentor"],["sich melden","to volunteer, sign up"],["unsicher","unsure"],["wegschieben","to push away"],["langweilig","boring"],["misstrauisch","suspicious"],["Grashüpfer","grasshopper"],["Schatzkiste","treasure chest"],["stocken","to falter"],["aussprechen","to pronounce"],["klappen","to work out"],["krumm","crooked"]],"q":[["Warum zögert Zeynep?","Sie denkt, ihr Deutsch sei nicht gut genug.","Die Lehrerin sagt, Zeit ist wichtiger."],["Welchen Trick nutzt Zeynep?","Sie lässt Elias ihr helfen, sodass er der Lehrer ist.","Rollentausch."],["Was ist das Ergebnis nach drei Monaten?","Elias liest ein ganzes Buch.","Motivation durch Verantwortung."],["Was bedeutet „Für meine Schülerin“?","Elias sieht sich als ihr Lehrer.","Rührendes Ende."]],"teaser":"Eine Frau, die selbst noch Deutsch lernt, liest einem Grundschüler vor – und beide lernen.","words":183},{"id":"kinder","title":"Elternsprechtag","level":"B2","topic":"Schule · Eltern","min":3,"p":["Der Elternsprechtag war in der Turnhalle. Jede Lehrkraft saß an einem Tisch, davor standen Eltern in Schlangen. Herr Petrov hatte zehn Minuten bei Herrn Kranz, dem Mathelehrer seines Sohnes.","„Ihr Sohn Daniel“, begann Herr Kranz, „ist ein interessanter Fall.“","Herr Petrov seufzte. „Ich weiß. Er macht nichts. Zu Hause spielt er nur am Computer.“","„Am Computer? Was spielt er denn?“","„Keine Ahnung. Etwas mit Blöcken.“","Herr Kranz lächelte. „Er hat mir letzte Woche gezeigt, was er da baut. Einen funktionierenden Taschenrechner. Aus Blöcken. Im Spiel. Das ist Logik auf Uni-Niveau.“","Herr Petrov war sprachlos.","„Das Problem ist nicht, dass er nichts kann“, fuhr der Lehrer fort. „Das Problem ist, dass ihn der Unterricht langweilt. Ich gebe ihm ab jetzt Zusatzaufgaben. Und es gibt eine Informatik-AG am Donnerstag. Er sollte da hingehen.“","Auf dem Heimweg sagte Herr Petrov lange nichts. Zu Hause setzte er sich neben seinen Sohn vor den Computer. „Zeig mal“, sagte er. „Was baust du da?“","Daniel schaute überrascht auf. Dann erklärte er eine Stunde lang. Sein Vater verstand nur die Hälfte. Aber er hörte zu, und das war, wie sich später herausstellte, wichtiger als jede Zusatzaufgabe."],"g":[["Elternsprechtag","parent-teacher day"],["Turnhalle","gym hall"],["Lehrkraft","teacher"],["Schlange","queue"],["Fall","case"],["Taschenrechner","calculator"],["Niveau","level"],["sprachlos","speechless"],["langweilen","to bore"],["Zusatzaufgabe","extra task"],["AG (Arbeitsgemeinschaft)","after-school club"],["sich herausstellen","to turn out"]],"q":[["Was denkt der Vater über seinen Sohn?","Dass er nichts macht und nur Computer spielt.","Vorurteil."],["Was hat Daniel tatsächlich gebaut?","Einen funktionierenden Taschenrechner im Spiel.","Logik auf hohem Niveau."],["Was ist laut Lehrer das eigentliche Problem?","Der Unterricht langweilt Daniel.","Er braucht mehr Herausforderung."],["Was ist am Ende am wichtigsten?","Dass der Vater zuhört.","Wichtiger als Zusatzaufgaben."]],"teaser":"Zehn Minuten mit dem Mathelehrer – und die überraschende Wahrheit über einen Sohn, der „nichts macht“.","words":189},{"id":"schnee","title":"Der erste Schnee","level":"B2","topic":"Wetter · Alltag","min":3,"p":["Als Rafael am Morgen aus dem Fenster schaute, war alles weiß. Zum ersten Mal in seinem Leben sah er echten Schnee. Er kam aus Brasilien.","Er zog seine dickste Jacke an und ging hinaus. Der Gehweg vor dem Haus war voller Schnee. Vor dem Nachbarhaus dagegen war alles geräumt und mit Salz bestreut.","Ein älterer Mann kam mit einer Schaufel aus dem Nachbarhaus. „Morgen! Sie sind doch neu im Haus, oder?“","„Ja. Guten Morgen.“","„Sie wissen, dass Sie räumen müssen?“","„Räumen? Was räumen?“","„Den Gehweg. Steht im Mietvertrag. Räum- und Streupflicht. Bis sieben Uhr morgens. Wenn jemand ausrutscht, haften Sie.“","Rafael hatte keinen Mietvertrag so genau gelesen. Und er hatte keine Schaufel.","Der Nachbar lachte und gab ihm seine. „Hier. Ich zeig's Ihnen. Nicht schieben, sondern schaufeln. Und dann Splitt drauf, kein Salz, das ist hier verboten.“","Zusammen räumten sie den Gehweg. Nach zwanzig Minuten war Rafael durchgeschwitzt, trotz minus fünf Grad.","„Morgen kaufen Sie sich eine Schaufel“, sagte der Nachbar. „Und dann trinken wir zusammen einen Glühwein. Den hat man sich nach dem ersten Schnee verdient.“"],"g":[["räumen","to clear (snow)"],["bestreuen","to sprinkle"],["Schaufel","shovel"],["Räum- und Streupflicht","duty to clear and grit"],["ausrutschen","to slip"],["haften","to be liable"],["schieben","to push"],["schaufeln","to shovel"],["Splitt","grit"],["durchgeschwitzt","drenched in sweat"],["verdienen","to earn, deserve"]],"q":[["Was überrascht Rafael?","Es ist sein erster Schnee.","Er kommt aus Brasilien."],["Was ist die Räumpflicht?","Mieter müssen den Gehweg bis sieben Uhr räumen und streuen.","Sonst haften sie bei Unfällen."],["Was lernt er vom Nachbarn?","Schaufeln statt schieben und Splitt statt Salz.","Praktisches Wissen."],["Wie endet die Geschichte?","Mit einer Einladung zum Glühwein.","Freundliche Nachbarschaft."]],"teaser":"Ein Morgen mit Schneechaos, eine Räumpflicht, von der niemand erzählt hat, und ein Nachbar mit Schaufel.","words":177},{"id":"handy2","title":"Der Handyvertrag","level":"B2","topic":"Verträge · Technik","min":3,"p":["„Das neueste Modell für nur einen Euro!“, sagte der Verkäufer begeistert. „Mit unserem Vertrag.“","Wei schaute auf das Handy. Es war wirklich schön. „Und was kostet der Vertrag?“","„Nur 59,99 im Monat. Mit 50 Gigabyte und Flatrate.“","„Wie lange?“","„Vierundzwanzig Monate.“","Wei nahm ihr Handy und rechnete. 59,99 mal 24. „Das sind 1.440 Euro.“","Der Verkäufer lächelte etwas weniger. „Ja, aber dafür bekommen Sie das Handy fast geschenkt.“","„Das Handy kostet ohne Vertrag 900 Euro. Und ein Vertrag ohne Handy kostet bei Ihnen 20 Euro im Monat. Das sind 480 Euro in zwei Jahren. Zusammen 1.380. Ihr Angebot ist also sechzig Euro teurer.“","Der Verkäufer schwieg einen Moment. „Sie haben gut gerechnet.“","„Ich arbeite in der Buchhaltung“, sagte Wei.","Am Ende kaufte sie das Handy nicht. Sie behielt ihr altes, das noch gut funktionierte, und nahm einen günstigen Vertrag ohne Laufzeit für zehn Euro im Monat. „Monatlich kündbar“, sagte der Verkäufer, jetzt fast respektvoll. „Gute Wahl.“"],"g":[["unschlagbar","unbeatable"],["Angebot","offer"],["begeistert","enthusiastic"],["Vertrag","contract"],["Flatrate","unlimited plan"],["nachrechnen","to calculate, check"],["fast geschenkt","practically free"],["Buchhaltung","accounting"],["behalten","to keep"],["ohne Laufzeit","without minimum term"],["monatlich kündbar","cancellable monthly"],["respektvoll","respectful"]],"q":[["Was ist der Trick beim Angebot?","Das Handy kostet einen Euro, aber der Vertrag ist teuer.","1.440 Euro insgesamt."],["Wie entlarvt Wei das Angebot?","Sie rechnet: Handy einzeln plus günstiger Vertrag ist billiger.","Sechzig Euro Unterschied."],["Was macht sie am Ende?","Sie behält ihr altes Handy und nimmt einen monatlich kündbaren Vertrag.","Zehn Euro im Monat."],["Wie verändert sich der Verkäufer?","Er wird respektvoll.","Durch ihre Kompetenz."]],"teaser":"Ein Verkäufer im Handyladen, ein „unschlagbares Angebot“ und eine Kundin, die nachrechnet.","words":156},{"id":"heimweh","title":"Heimweh im November","level":"B2","topic":"Gefühle · Ankommen","min":3,"p":["Im November wurde es um halb fünf dunkel. Seit zwei Wochen hatte Tariq die Sonne nicht gesehen. Er ging im Dunkeln zur Arbeit und kam im Dunkeln nach Hause. Abends rief er seine Mutter in Marokko an, und sie erzählte von zwanzig Grad und Orangen auf dem Markt.","Er wurde stiller. In der Kaffeepause saß er allein. Sein Kollege Florian merkte es.","„Alles okay bei dir? Du wirkst ein bisschen down.“","Tariq zögerte. „Ich glaube, ich habe Heimweh. Der November ist so … grau.“","„Oh Mann. Der November ist für alle schlimm. Wir nennen das Novemberblues.“ Florian überlegte. „Weißt du was? Kochst du gern?“","„Ja. Marokkanisch.“","„Dann koch doch mal was für uns. Für das Team. Am Freitag. Ich organisiere den Raum.“","Am Freitag stand Tariq in der Büroküche und kochte Tajine mit Hähnchen, Zitrone und Oliven. Der Duft zog durch den ganzen Flur. Zwölf Kollegen kamen, dann noch drei aus der anderen Abteilung, die den Geruch gerochen hatten.","Alle aßen und fragten nach dem Rezept. Die Teamleiterin wollte wissen, wo man die Gewürze kauft. Ein Kollege erzählte von seinem Urlaub in Marrakesch. Plötzlich redete Tariq mehr als in den ganzen zwei Monaten davor.","Abends rief er seine Mutter an. „Ich habe heute für fünfzehn Leute gekocht“, sagte er. „Mit deinem Rezept.“","„Und? Haben sie es gemocht?“","„Sie wollen es nächsten Monat wieder.“","Seine Mutter lachte. „Dann bist du ja angekommen.“"],"g":[["Heimweh","homesickness"],["Dunkelheit","darkness"],["still werden","to become quiet"],["merken","to notice"],["wirken","to seem"],["down","(colloquial) low, down"],["Novemberblues","November gloom"],["organisieren","to organise"],["Duft","aroma"],["Gewürz","spice"],["angekommen sein","to have settled in"]],"q":[["Warum hat Tariq Heimweh?","Der November ist dunkel und grau, die Familie ist weit weg.","Kontrast zu Marokko."],["Wie hilft Florian?","Er schlägt vor, dass Tariq für das Team kocht.","Gemeinsames Erlebnis."],["Was passiert beim Essen?","Viele Kollegen kommen, fragen nach und Tariq redet viel mehr.","Kontakt durch Essen."],["Was meint die Mutter mit „angekommen“?","Er gehört jetzt dazu.","Zugehörigkeit."]],"teaser":"Grauer Himmel, frühe Dunkelheit und das erste große Heimweh – bis ein Kollege eine Idee hat.","words":231},{"id":"werkstatt2","title":"Reifenwechsel","level":"B2","topic":"Auto · Jahreszeiten","min":3,"p":["„Von O bis O“, sagte Marta zu ihrem Mann. „Hast du das schon gehört?“","„Nein. Was ist das?“","„Winterreifen von Oktober bis Ostern. Meine Kollegin hat's mir erklärt. Wir haben noch Sommerreifen drauf.“","Es war Ende Oktober. Am nächsten Tag rief Pavel bei drei Werkstätten an. Alle sagten dasselbe: „Reifenwechsel? Frühestens in drei Wochen. Alle wollen gleichzeitig.“","„Was passiert, wenn es vorher schneit?“, fragte er.","„Dann lassen Sie das Auto stehen. Mit Sommerreifen bei Schnee fahren ist verboten. Und gefährlich. Und es gibt ein Bußgeld.“","Pavel hatte das Gefühl, das ganze Land hätte ein Geheimnis gekannt, das ihm niemand verraten hatte.","Sein Nachbar Herr Schöller sah ihn am Abend mit dem Handy vor dem Auto stehen. „Probleme?“","Pavel erzählte. Herr Schöller lachte. „Ach, das mach ich selbst. Hab einen Wagenheber in der Garage. Wenn Sie die Winterreifen haben, wechseln wir die am Samstag zusammen.“","Am Samstag lagen sie zu zweit neben dem Auto. Herr Schöller zeigte ihm, wie man die Radmuttern löst, das Auto hochkurbelt und die Reifen tauscht. „Nach fünfzig Kilometern nochmal die Muttern nachziehen“, sagte er. „Das vergisst jeder.“","Zwei Wochen später fiel der erste Schnee. Pavel fuhr vorsichtig zur Arbeit. Auf dem Parkplatz standen drei Kollegen, die mit dem Bus gekommen waren. „Werkstatt hat noch keinen Termin“, sagte einer. Pavel lächelte und dachte an Herrn Schöller."],"g":[["Winterreifen","winter tyres"],["Ostern","Easter"],["Reifenwechsel","tyre change"],["frühestens","at the earliest"],["gleichzeitig","at the same time"],["Bußgeld","fine"],["verraten","to reveal"],["Wagenheber","jack"],["Radmutter","wheel nut"],["lösen","to loosen"],["hochkurbeln","to crank up"],["nachziehen","to retighten"]],"q":[["Was bedeutet „Von O bis O“?","Winterreifen von Oktober bis Ostern.","Faustregel."],["Warum bekommt Pavel keinen Termin?","Alle wollen gleichzeitig wechseln.","Drei Wochen Wartezeit."],["Was droht bei Schnee mit Sommerreifen?","Verbot, Gefahr und Bußgeld.","Situative Winterreifenpflicht."],["Was ist der wichtige Tipp des Nachbarn?","Nach fünfzig Kilometern die Muttern nachziehen.","Wird oft vergessen."]],"teaser":"Von O bis O: Warum Autofahrer in Deutschland zweimal im Jahr in Panik geraten.","words":219},{"id":"pfand","title":"Die Pfandflasche","level":"B2","topic":"Umwelt · Alltag","min":3,"p":["Unter Lucas Spüle stapelten sich leere Flaschen. Wasser, Bier, Saft. Nach drei Monaten in Deutschland wusste er, dass man dafür Geld bekommt. Er wusste nur nicht, wie viel.","Er brachte alles in zwei großen Taschen zum Supermarkt. Am Pfandautomaten stand schon eine Frau mit einem Kinderwagen voller Flaschen.","Luca legte die erste Flasche in die Öffnung. Der Automat drehte sie, piepte und spuckte sie wieder aus. „Dieser Artikel wird nicht angenommen.“","„Was?“, sagte Luca laut.","Die Frau neben ihm schaute auf die Flasche. „Die hat kein Pfandzeichen. Siehst du? Hier muss so ein Symbol drauf sein. Die ohne Symbol gehören in den Glascontainer.“","Sie half ihm sortieren. Plastikflaschen mit Symbol: fünfundzwanzig Cent. Bierflaschen aus Glas: acht Cent. Saftflaschen ohne Symbol: kein Pfand.","Am Ende druckte der Automat einen Bon aus: 6,47 Euro. „Damit kannst du an der Kasse bezahlen“, sagte die Frau.","Luca bedankte sich und fragte, warum sie so viele Flaschen habe. Sie lachte. „Ich sammle im Park. Nach dem Wochenende liegen da manchmal Flaschen für zwanzig Euro. Das ist mein Taschengeld.“","Auf dem Heimweg sah Luca eine Pfandflasche neben einem Mülleimer stehen. Nicht drin, daneben. Er verstand jetzt: Man stellt sie daneben, damit jemand sie mitnehmen kann. Er stellte seine leere Wasserflasche dazu."],"g":[["Spüle","sink"],["sich stapeln","to pile up"],["Pfandautomat","bottle-return machine"],["ausspucken","to spit out"],["annehmen","to accept"],["Pfandzeichen","deposit symbol"],["Glascontainer","bottle bank"],["Bon","receipt, voucher"],["sammeln","to collect"],["Taschengeld","pocket money"],["Mülleimer","rubbish bin"]],"q":[["Warum nimmt der Automat die Flasche nicht?","Sie hat kein Pfandzeichen.","Gehört in den Glascontainer."],["Wie viel Pfand gibt es?","Plastik 25 Cent, Glasbierflaschen 8 Cent.","Ohne Symbol nichts."],["Was macht die Frau mit den Flaschen?","Sie sammelt im Park und verdient damit Taschengeld.","Für manche ein Einkommen."],["Warum stellt man Flaschen neben den Mülleimer?","Damit Sammler sie mitnehmen können.","Soziale Geste."]],"teaser":"Ein Sack voller Flaschen, ein Automat, der nicht will, und ein überraschender Lohn.","words":205},{"id":"mittagessen","title":"Die Kantine","level":"B2","topic":"Arbeit · Essen","min":3,"p":["Am ersten Tag fragte Imani ihre Kollegin: „Wo isst man hier zu Mittag?“","„In der Kantine. Um zwölf. Nicht später, sonst ist das Schnitzel weg.“","„Gibt es jeden Tag Schnitzel?“","„Nein, nur montags. Dienstag Eintopf, Mittwoch vegetarisch, Donnerstag Currywurst, Freitag Fisch. Seit zwanzig Jahren. Niemand weiß, warum.“","In der Kantine gab es eine lange Schlange und drei Ausgaben: „Menü 1“, „Menü 2“ und „Vegetarisch“. Imani nahm Menü 1. Die Frau hinter der Theke fragte: „Pommes oder Kartoffelsalat?“","„Kartoffelsalat.“","„Gute Wahl. Ist selbst gemacht.“","Dann kam der schwierigste Teil: einen Platz finden. Imani stand mit ihrem Tablett in der Mitte des Raums und sah, dass sich alle nach Abteilungen gesetzt hatten. IT links, Marketing am Fenster, Produktion hinten. Wo sollte sie hin?","„Hier ist frei!“, rief jemand. Es war ein Mann aus der Produktion, mit Arbeitsjacke. „Neu?“","„Ja. Personalabteilung.“","„Personal sitzt eigentlich vorne. Aber egal. Hier ist's lustiger.“","Sie aß mit vier Männern aus der Produktion, die über Fußball, ihre Chefs und das Schnitzel diskutierten. Sie lernte mehr über die Firma als in ihrer ganzen Einarbeitung.","Ab da setzte sie sich jeden Montag dorthin. Die Kollegen aus der Personalabteilung fanden das seltsam. Aber als es Probleme mit einer neuen Schichtregelung gab, wusste Imani als Erste, was die Leute wirklich dachten."],"g":[["Kantine","canteen"],["Eintopf","stew"],["Ausgabe","serving counter"],["Theke","counter"],["selbst gemacht","homemade"],["Tablett","tray"],["Abteilung","department"],["Produktion","production"],["Personalabteilung","HR"],["Einarbeitung","induction"],["Schichtregelung","shift arrangement"]],"q":[["Was ist das Kantinensystem?","Feste Gerichte für jeden Wochentag, seit zwanzig Jahren.","Schnitzel montags."],["Wie sitzen die Leute?","Nach Abteilungen.","Ungeschriebene Ordnung."],["Warum setzt sich Imani zur Produktion?","Ein Mann lädt sie ein; dort ist es lustiger.","Gegen die Ordnung."],["Welchen Vorteil hat das später?","Sie weiß als Erste, was die Belegschaft denkt.","Informelle Informationen."]],"teaser":"Montags Schnitzel, freitags Fisch – und die geheime Hierarchie der Firmenkantine.","words":209},{"id":"geburtstag","title":"Selbst einen Kuchen mitbringen","level":"B2","topic":"Arbeit · Kultur","min":3,"p":["„Morgen hast du Geburtstag?“, fragte Kollegin Sabine. „Und? Was bringst du mit?“","„Mitbringen?“, fragte Jun. „Ich dachte, man bekommt etwas.“","Sabine lachte. „Nicht in Deutschland. Hier bringt das Geburtstagskind Kuchen mit. Oder Brezeln. Für alle.“","Jun konnte es kaum glauben. In Korea luden Freunde ein, Kollegen schenkten etwas. Hier sollte er selbst backen?","„Muss ich backen?“","„Kaufen geht auch. Aber selbst gebacken ist natürlich besser. Und Sekt, wenn du großzügig bist.“","Am Abend stand Jun in seiner Küche und backte zum ersten Mal einen Kuchen. Einen Marmorkuchen, nach einem Rezept aus dem Internet. Er war in der Mitte etwas zu dunkel. Er schnitt die dunkle Stelle heraus und aß sie selbst.","Am nächsten Morgen stellte er den Kuchen in die Teeküche, mit einem Zettel: „Ich habe heute Geburtstag. Bitte bedient euch! Jun“. Bis zehn Uhr war der Kuchen weg.","Und dann passierte etwas, womit er nicht gerechnet hatte. Um elf Uhr kamen die Kollegen zusammen, sangen „Zum Geburtstag viel Glück“ und gaben ihm eine Karte und einen Gutschein für ein koreanisches Restaurant in Stuttgart. „Gesammelt“, sagte Sabine. „Wir sind ja nicht unhöflich.“","Jun war gerührt. „Also gibt es doch Geschenke?“","„Klar. Aber erst nach dem Kuchen.“"],"g":[["Geburtstagskind","birthday person"],["großzügig","generous"],["backen","to bake"],["Marmorkuchen","marble cake"],["Teeküche","office kitchen"],["sich bedienen","to help oneself"],["rechnen mit","to expect"],["Gutschein","voucher"],["sammeln","to collect (money)"],["unhöflich","rude"],["gerührt","touched"]],"q":[["Was ist die deutsche Büroregel am Geburtstag?","Das Geburtstagskind bringt Kuchen für alle mit.","Gegenteil von Korea."],["Wie läuft Juns erster Kuchen?","In der Mitte zu dunkel; er schneidet die Stelle raus.","Trotzdem bis zehn Uhr aufgegessen."],["Was überrascht Jun?","Die Kollegen singen und schenken ihm einen Gutschein.","Doch Geschenke."],["Was ist die Pointe?","Geschenke gibt es auch – aber erst nach dem Kuchen.","Humor."]],"teaser":"Ein Geburtstag im deutschen Büro, an dem man nicht beschenkt wird, sondern selbst schenkt.","words":196},{"id":"gericht","title":"Zeugin vor Gericht","level":"C1","topic":"Recht · Mut","min":4,"p":["Der Brief kam per Post, gelb, mit einem Wappen: „Ladung als Zeugin“. Fatma las ihn dreimal. Sie sollte am 14. März um 9:30 Uhr vor dem Amtsgericht aussagen. Zu einem Verkehrsunfall, den sie vor fünf Monaten gesehen hatte.","Sie hatte Angst. Nicht vor dem Gericht, sondern davor, auf Deutsch etwas Falsches zu sagen. Sie rief beim Gericht an. „Kann ich einen Dolmetscher bekommen?“","„Selbstverständlich“, sagte die Frau am Telefon. „Welche Sprache?“","„Türkisch. Aber eigentlich … ich möchte es auf Deutsch versuchen. Nur falls ich etwas nicht verstehe.“","„Dann bestellen wir einen Dolmetscher zur Sicherheit. Sie entscheiden im Saal.“","Am 14. März saß sie in einem holzgetäfelten Raum. Vorne die Richterin, links der Angeklagte mit seinem Anwalt, rechts eine Staatsanwältin. Der Dolmetscher saß neben ihr.","„Frau Yıldız“, begann die Richterin, „Sie sind verpflichtet, die Wahrheit zu sagen. Bitte schildern Sie, was Sie gesehen haben.“","Fatma atmete tief ein. Auf Deutsch erzählte sie: Sie stand an der Ampel. Die Fußgängerampel war grün. Ein Radfahrer fuhr los. Ein Auto bog rechts ab, ohne zu bremsen. Sie hatte gesehen, dass der Fahrer auf sein Handy schaute.","Der Anwalt des Angeklagten stand auf. „Sind Sie sicher, dass es ein Handy war? Es könnte auch etwas anderes gewesen sein.“","Fatma verstand die Frage. Sie zögerte. Dann sagte sie: „Ich habe ein helles Licht in seiner Hand gesehen. Es war ein Bildschirm. Ob es ein Handy war, kann ich nicht beschwören. Aber er schaute nach unten, nicht auf die Straße.“","Die Richterin nickte langsam und notierte etwas. Später sagte der Dolmetscher leise zu ihr: „Sie haben mich nicht gebraucht. Und das war eine sehr gute Antwort.“","„Warum?“","„Weil Sie nur gesagt haben, was Sie sicher wissen. Das machen viele Zeugen nicht.“"],"g":[["Wappen","coat of arms"],["Ladung","summons"],["Zeugin","witness (female)"],["Amtsgericht","local court"],["aussagen","to testify"],["Dolmetscher","interpreter"],["holzgetäfelt","wood-panelled"],["Angeklagter","defendant"],["Staatsanwältin","public prosecutor"],["verpflichtet","obliged"],["schildern","to describe"],["abbiegen","to turn"],["beschwören","to swear to"]],"q":[["Wovor hat Fatma Angst?","Auf Deutsch etwas Falsches zu sagen.","Nicht vor dem Gericht selbst."],["Was ist der Kompromiss mit dem Dolmetscher?","Er ist zur Sicherheit da; sie entscheidet im Saal.","Sie braucht ihn am Ende nicht."],["Wie beantwortet sie die Frage des Anwalts?","Sie sagt nur, was sie sicher gesehen hat: ein Bildschirm, Blick nach unten.","Nicht mehr behaupten als gewiss."],["Warum lobt der Dolmetscher sie?","Weil sie zwischen Wissen und Vermutung unterscheidet.","Wichtig für Zeugen."]],"teaser":"Eine Frau sieht einen Unfall, wird als Zeugin geladen und muss vor Gericht auf Deutsch aussagen.","words":284},{"id":"erste_hilfe","title":"Erste Hilfe in der S-Bahn","level":"B2","topic":"Notfall · Mut","min":3,"p":["Die S-Bahn war voll. Plötzlich fiel ein älterer Mann vor Rana zu Boden. Einfach so. Alle traten zurück. Niemand sagte etwas.","Rana war Krankenschwester, aber nicht im Dienst und erst seit einem Jahr in Deutschland. Für eine Sekunde zögerte sie. Dann kniete sie sich hin.","„Hallo? Hören Sie mich?“ Keine Reaktion. Sie prüfte die Atmung. Er atmete.","Sie schaute die Menschen um sich herum an und sagte laut und klar: „Sie, mit der blauen Jacke: Rufen Sie 112. Sagen Sie: S-Bahn S1, Richtung Herrenberg, ein Mann ist bewusstlos, atmet. Sie da: Ziehen Sie die Notbremse nicht, sagen Sie dem Fahrer Bescheid über die Sprechanlage.“","Es war erstaunlich: Sobald jemand klare Anweisungen gab, handelten alle. Der Mann mit der blauen Jacke telefonierte. Eine Frau drückte die Sprechanlage. Ein Junge hielt die Tasche des Mannes.","Rana legte den Mann in die stabile Seitenlage. Er öffnete kurz die Augen. „Zucker“, murmelte er.","„Er ist Diabetiker“, rief sie. „Hat jemand Traubenzucker? Saft?“","Eine Schülerin gab ihr einen Orangensaft. Rana half dem Mann, ein paar Schlucke zu trinken. Nach zwei Minuten wurde er wacher.","An der nächsten Station warteten schon die Sanitäter. Einer klopfte Rana auf die Schulter. „Gut gemacht. Klare Ansagen, Seitenlage, Zucker. Lehrbuch.“","Im Zug sagte der Mann mit der blauen Jacke zu ihr: „Ich wusste nicht, was ich tun soll, bis Sie es gesagt haben.“","„Das geht den meisten so“, sagte Rana. „Deshalb muss einer anfangen.“"],"g":[["zusammenbrechen","to collapse"],["zurücktreten","to step back"],["im Dienst","on duty"],["Atmung","breathing"],["bewusstlos","unconscious"],["Notbremse","emergency brake"],["Sprechanlage","intercom"],["Anweisung","instruction"],["handeln","to act"],["stabile Seitenlage","recovery position"],["murmeln","to mumble"],["Traubenzucker","glucose"],["Sanitäter","paramedic"]],"q":[["Warum hilft zuerst niemand?","Alle sind unsicher und treten zurück.","Zuschauereffekt."],["Was macht Rana richtig?","Sie gibt einzelnen Personen klare Anweisungen.","Dann handeln alle."],["Was ist die Ursache des Zusammenbruchs?","Unterzucker bei Diabetes.","Saft hilft."],["Was ist die Lehre?","Einer muss anfangen.","Klare Ansagen statt Zuschauen."]],"teaser":"Ein Mann bricht zusammen, alle schauen, und eine Krankenschwester ohne Dienst übernimmt.","words":234},{"id":"verabredung","title":"„Lass uns mal einen Kaffee trinken“","level":"B2","topic":"Freundschaft · Kultur","min":3,"p":["Nach dem Sprachkurs sagte Theresa zu Kai: „Lass uns mal einen Kaffee trinken.“","In Kais Heimat Brasilien hieß so ein Satz: Vielleicht, irgendwann, wahrscheinlich nie. Also sagte er freundlich: „Ja, klar, gern!“ und vergaß es.","Am nächsten Tag kam eine Nachricht: „Hi Kai! Wann passt es dir? Ich könnte Mittwoch, 18 Uhr, oder Samstag, 15 Uhr.“","Kai war überrascht. Sie meinte es ernst! Er antwortete: „Samstag ist super!“","„Toll! Samstag in sechs Wochen? Die nächsten Wochenenden bin ich leider voll.“","Sechs Wochen. Kai lachte laut in seiner Küche. In Brasilien hätte man sich spontan am selben Abend getroffen. Oder nie. Hier gab es einen Termin, sechs Wochen im Voraus, mit Uhrzeit.","Er trug es in seinen Kalender ein. Und tatsächlich: Sechs Wochen später, Samstag, 15 Uhr, saß Theresa im Café. Pünktlich. Sie hatte sogar ein kleines Geschenk dabei, eine Tafel Ritter Sport, „weil du doch gesagt hast, dass du die Nusssorte magst“.","Kai konnte sich nicht erinnern, das gesagt zu haben. Aber sie hatte es sich gemerkt.","Sie redeten drei Stunden. Am Ende sagte Theresa: „Das sollten wir öfter machen.“","Kai zog sein Handy heraus. „Okay. Wann? Ich trage es gleich ein.“","Theresa lachte. „Du lernst schnell.“"],"g":[["Lass uns mal …","let's (sometime) …"],["Wann passt es dir?","When suits you?"],["im Voraus","in advance"],["eintragen","to enter, write down"],["spontan","spontaneously"],["pünktlich","punctual"],["Tafel Schokolade","bar of chocolate"],["sich erinnern","to remember"],["sich etwas merken","to remember something"],["öfter","more often"]],"q":[["Wie versteht Kai „Lass uns mal einen Kaffee trinken“?","Als unverbindliche Floskel.","Wie in Brasilien."],["Wie meint Theresa den Satz?","Ernst – sie schlägt sofort konkrete Termine vor.","Kultureller Unterschied."],["Was überrascht Kai am Treffen?","Pünktlichkeit und dass sie sich an seine Lieblingsschokolade erinnert.","Zuverlässigkeit."],["Was zeigt das Ende?","Kai übernimmt die deutsche Art, Termine sofort festzumachen.","„Du lernst schnell.“"]],"teaser":"Ein Satz, den Deutsche ernst meinen – und der zu einem Kalendereintrag in sechs Wochen führt.","words":197},{"id":"stau2","title":"Rettungsgasse","level":"B2","topic":"Verkehr · Regeln","min":3,"p":["Auf der A81 ging nichts mehr. Stau. Diego trommelte auf das Lenkrad und hörte Radio. Plötzlich sah er, wie die Autos links neben ihm nach links fuhren und die Autos rechts nach rechts. In der Mitte entstand eine Lücke.","„Was machen die?“, fragte er seine Freundin.","„Rettungsgasse!“, rief Lena. „Fahr nach rechts! Schnell!“","Diego lenkte nach rechts, bis er fast auf dem Standstreifen war. Dreißig Sekunden später raste ein Krankenwagen mit Blaulicht durch die Gasse. Dann ein Polizeiauto. Dann die Feuerwehr.","„Die Regel ist einfach“, erklärte Lena. „Wenn du ganz links fährst, nach links. Alle anderen nach rechts. Und das sofort, wenn der Verkehr stockt, nicht erst, wenn du die Sirene hörst.“","„Warum nicht erst bei der Sirene?“","„Weil es dann zu spät ist. Dann ist kein Platz mehr.“","Ein Auto weiter vorne hatte keine Gasse gebildet. Ein Polizist stieg aus dem Polizeiauto und sprach mit dem Fahrer. Lena sagte: „Das kostet mindestens zweihundert Euro und einen Punkt in Flensburg.“","Nach einer Stunde ging es weiter. Im Radio hieß es: schwerer Unfall, zwei Verletzte, beide rechtzeitig ins Krankenhaus gebracht.","Diego dachte lange darüber nach. „Rechtzeitig“, sagte er. „Wegen einer Lücke zwischen den Autos.“"],"g":[["Stau","traffic jam"],["trommeln","to drum"],["Lücke","gap"],["Rettungsgasse","emergency corridor"],["lenken","to steer"],["Standstreifen","hard shoulder"],["rasen","to race"],["Blaulicht","flashing blue light"],["stocken","to slow down, stall"],["Sirene","siren"],["Punkt in Flensburg","penalty point"],["rechtzeitig","in time"]],"q":[["Was ist eine Rettungsgasse?","Eine Lücke zwischen den Spuren für Einsatzfahrzeuge.","Im Stau."],["Wie bildet man sie?","Ganz links nach links, alle anderen nach rechts.","Sofort bei stockendem Verkehr."],["Was droht, wenn man keine bildet?","Bußgeld und ein Punkt in Flensburg.","Mindestens 200 Euro."],["Was ist die Bedeutung am Ende?","Die Verletzten kamen rechtzeitig ins Krankenhaus.","Eine Lücke rettet Leben."]],"teaser":"Ein Stau auf der Autobahn, ein Krankenwagen von hinten – und eine Regel, die Leben rettet.","words":193},{"id":"kollegin","title":"Die Kollegin, die alles besser weiß","level":"C1","topic":"Arbeit · Konflikt","min":4,"p":["Jedes Mal, wenn Amina in einer Besprechung etwas vorschlug, sagte Frau Huber: „Das haben wir schon probiert. Funktioniert nicht.“ Oder: „Grundsätzlich ja, aber …“ Oder einfach: „Nein.“","Nach zwei Monaten war Amina frustriert. Sie sagte in Besprechungen kaum noch etwas. Ihr Teamleiter merkte es. „Sie waren am Anfang so aktiv. Was ist los?“","Amina überlegte, ob sie ehrlich sein sollte. Sie entschied sich dafür. „Ich habe das Gefühl, dass Frau Huber jede Idee von mir ablehnt. Dann sage ich lieber nichts.“","Der Teamleiter nickte. „Haben Sie mit ihr selbst gesprochen?“","„Nein.“","„Versuchen Sie es. Unter vier Augen. Ich glaube, es ist nicht persönlich gemeint.“","Am nächsten Tag fragte Amina Frau Huber, ob sie zusammen Mittag essen wollten. Frau Huber war überrascht, aber sie sagte ja.","Beim Essen sagte Amina vorsichtig: „Darf ich etwas offen ansprechen? Ich habe den Eindruck, dass meine Vorschläge bei Ihnen oft nicht gut ankommen. Mache ich etwas falsch?“","Frau Huber legte die Gabel weg. Sie schwieg lange. Dann sagte sie: „Nein. Sie machen nichts falsch. Ich bin seit fünfundzwanzig Jahren hier. Ich habe so viele neue Ideen gesehen, die dann gescheitert sind. Und jedes Mal mussten wir die Scherben aufkehren.“ Sie seufzte. „Vielleicht bin ich zu vorsichtig geworden.“","„Ihre Erfahrung ist wertvoll“, sagte Amina. „Was wäre, wenn Sie mir vorher sagen, woran frühere Versuche gescheitert sind? Dann kann ich meine Ideen besser machen.“","Frau Huber lächelte zum ersten Mal. „Das hat mich noch nie jemand gefragt.“","Von da an trafen sie sich vor wichtigen Besprechungen. Aminas Vorschläge wurden besser, weil sie die alten Fehler kannte. Und Frau Huber sagte in den Besprechungen jetzt manchmal: „Das ist eine gute Idee. Wir haben sie vorher besprochen.“"],"g":[["vorschlagen","to suggest"],["grundsätzlich","in principle"],["ablehnen","to reject"],["frustriert","frustrated"],["unter vier Augen","in private"],["persönlich gemeint","meant personally"],["offen ansprechen","to raise openly"],["gut ankommen","to go down well"],["scheitern","to fail"],["Scherben aufkehren","to clean up the mess"],["wertvoll","valuable"],["Erfahrung","experience"]],"q":[["Was ist Aminas Problem?","Frau Huber lehnt ihre Vorschläge ständig ab.","Sie verstummt in Besprechungen."],["Was rät der Teamleiter?","Unter vier Augen mit Frau Huber sprechen.","Es sei nicht persönlich."],["Was erklärt Frau Huber?","Sie hat viele gescheiterte Ideen erlebt und ist zu vorsichtig geworden.","Erfahrung statt Ablehnung."],["Welche Lösung finden sie?","Vor Besprechungen gemeinsam über frühere Fehler sprechen.","Erfahrung und neue Ideen verbinden."]],"teaser":"Eine Kollegin, die jede Idee korrigiert, und ein Gespräch, das die Zusammenarbeit rettet.","words":278},{"id":"silvester","title":"Silvester in Deutschland","level":"B2","topic":"Feste · Tradition","min":3,"p":["„Um sechs kommt ‚Dinner for One' im Fernsehen“, sagte Svenja. „Das müssen wir schauen.“","„Was ist das?“, fragte Ravi.","„Ein alter englischer Sketch. Schwarz-weiß. Läuft jedes Jahr an Silvester. Jeder Deutsche kennt ihn auswendig.“","„Ein englischer Sketch? Warum schauen Deutsche an Silvester einen englischen Sketch?“","Svenja überlegte. „Gute Frage. Keine Ahnung. Ist halt Tradition.“","Sie schauten. Ein alter Butler servierte einer alten Dame ein Abendessen für Gäste, die alle schon gestorben waren. Er trank für jeden mit und wurde immer betrunkener. Alle im Raum sprachen den berühmten Satz mit: „The same procedure as every year, James!“ Ravi verstand den Witz erst beim dritten Mal, dann lachte er so sehr, dass er Tränen hatte.","Danach gab es Raclette. Dann kam ein seltsames Spiel: Wachsgießen. Man schmolz ein kleines Stück Wachs auf einem Löffel über einer Kerze und kippte es in kaltes Wasser. Die Form sollte die Zukunft zeigen. Ravis Wachs sah aus wie ein Kartoffel.","„Eine Kartoffel bedeutet … Reichtum?“, las Svenja auf dem Beipackzettel. „Oder gutes Essen. Steht beides da.“","Um Mitternacht gingen alle auf die Straße. Überall knallten Raketen und Böller. Fremde umarmten sich und riefen „Frohes neues Jahr!“ und „Prost Neujahr!“. Ravi stand mit einem Glas Sekt in der Hand und sah den Himmel explodieren.","„Und?“, fragte Svenja. „Wie findest du's?“","„Laut“, sagte Ravi. „Sehr laut. Und wunderschön.“"],"g":[["Silvester","New Year's Eve"],["Sketch","sketch, comedy scene"],["auswendig","by heart"],["betrunken","drunk"],["Wachsgießen","wax pouring (New Year tradition)"],["schmelzen","to melt"],["kippen","to tip, pour"],["Reichtum","wealth"],["Beipackzettel","instruction leaflet"],["Böller","firecracker"],["knallen","to bang"],["Prost Neujahr!","Happy New Year! (toast)"]],"q":[["Was ist „Dinner for One“?","Ein englischer Sketch, der jedes Jahr an Silvester läuft.","Deutsche kennen ihn auswendig."],["Wie funktioniert Wachsgießen?","Wachs schmelzen, in kaltes Wasser kippen, die Form deuten.","Spiel über die Zukunft."],["Was bedeutet Ravis Kartoffel?","Reichtum oder gutes Essen.","Beides steht auf dem Zettel."],["Was passiert um Mitternacht?","Feuerwerk, Umarmungen, „Frohes neues Jahr!“","Laut und schön."]],"teaser":"Bleigießen, „Dinner for One“ und Raketen um Mitternacht – ein erster deutscher Jahreswechsel.","words":220},{"id":"vorstellen","title":"Sich beim Nachbarn vorstellen","level":"B2","topic":"Nachbarn · Höflichkeit","min":3,"p":["„Stellst du dich bei den Nachbarn vor?“, fragte Nikolas Kollegin.","„Vorstellen? Wie bei einem Vorstellungsgespräch?“","„Nein! Du klingelst kurz, sagst deinen Namen, dass du neu eingezogen bist. Manche bringen eine Kleinigkeit mit, Schokolade oder so. Dann kennen dich alle, und wenn mal was ist, helfen sie dir.“","Nikolas kaufte sechs kleine Tafeln Schokolade. Am Samstagnachmittag klingelte er an jeder Tür.","Erdgeschoss links: eine junge Mutter mit Baby. „Oh, wie nett! Willkommen! Wenn du mal Salz brauchst, klingel einfach.“","Erdgeschoss rechts: niemand.","Erster Stock links: ein alter Herr, der ihm sofort von der Geschichte des Hauses erzählte, Baujahr 1912, und von den Bomben im Krieg, die das Nachbarhaus getroffen hatten, aber nicht dieses. Nikolas stand zwanzig Minuten an der Tür.","Erster Stock rechts: ein Student, verschlafen. „Danke, Mann. Ich bin Lars. Ich mach manchmal Musik, sag Bescheid, wenn's zu laut ist.“","Zweiter Stock: eine Frau, die skeptisch die Schokolade ansah. „Ist das vegan?“ Sie nahm sie trotzdem.","Bei der Tür Erdgeschoss rechts ließ er die letzte Tafel mit einem Zettel liegen: „Hallo, ich bin Nikolas, neu im 3. OG. Freue mich auf gute Nachbarschaft!“","Am Montag lag vor seiner Tür ein Zettel: „Danke für die Schokolade! Ich bin Frau Heller, EG rechts. Habe einen Ersatzschlüssel-Service: Wenn Sie wollen, bewahre ich Ihren auf. Klingeln Sie gern.“","Zwei Monate später schloss sich Nikolas aus. Frau Heller hatte seinen Schlüssel. Schokolade, dachte er, war die beste Investition seines Lebens."],"g":[["sich vorstellen","to introduce oneself"],["einziehen","to move in"],["Kleinigkeit","small thing"],["wenn mal was ist","if anything happens"],["klingeln","to ring"],["verschlafen","sleepy"],["Bescheid sagen","to let know"],["skeptisch","sceptical"],["Ersatzschlüssel","spare key"],["aufbewahren","to keep"],["sich ausschließen","to lock oneself out"],["Investition","investment"]],"q":[["Was bedeutet „sich bei den Nachbarn vorstellen“?","Kurz klingeln, Namen sagen, eventuell eine Kleinigkeit mitbringen.","Kein Vorstellungsgespräch."],["Wie reagieren die Nachbarn?","Sehr unterschiedlich – freundlich, gesprächig, skeptisch.","Ein Querschnitt."],["Was bietet Frau Heller an?","Seinen Ersatzschlüssel aufzubewahren.","Per Zettel."],["Warum war die Schokolade eine gute Investition?","Als er sich aussperrt, hat Frau Heller den Schlüssel.","Nachbarschaft zahlt sich aus."]],"teaser":"Mit Schokolade an jeder Tür klingeln – eine kleine Tradition mit großer Wirkung.","words":235},{"id":"paket","title":"Das Paket beim Nachbarn","level":"B2","topic":"Alltag · Post","min":2,"p":["Im Briefkasten lag eine gelbe Karte: „Ihr Paket wurde bei Ihrem Nachbarn abgegeben: Familie Kowalski, 4. OG.“ Asha kannte keine Familie Kowalski.","Sie stieg in den vierten Stock und klingelte. Ein Junge öffnete, vielleicht zehn Jahre alt, mit Schokolade im Gesicht.","„Hallo. Ich glaube, ihr habt ein Paket für mich. Asha Patel, zweiter Stock.“","Der Junge wurde rot. „Mama! Das Paket ist für die Frau!“","Die Mutter kam, entschuldigte sich sofort. „Es tut mir so leid. Mein Sohn dachte, es ist für uns. Er hat es aufgemacht.“","Im Paket waren Pralinen. Ein Geburtstagsgeschenk von Ashas Schwester. Die Hälfte fehlte.","Asha schaute den Jungen an, dann musste sie lachen. „Und? Waren sie gut?“","„Sehr gut“, sagte der Junge leise. „Die mit Nuss sind die besten.“","Frau Kowalski bestand darauf, neue Pralinen zu kaufen. Am Wochenende brachte der Junge sie selbst vorbei, mit einer selbst gemalten Karte: „Entschuldigung. Ich mache nie wieder fremde Pakete auf. Leon.“ Asha hängte die Karte an ihren Kühlschrank."],"g":[["Benachrichtigungskarte","delivery notice"],["abgeben","to drop off"],["OG","upper floor"],["klingeln","to ring the bell"],["rot werden","to blush"],["aufmachen","to open"],["Pralinen","chocolates"],["bestehen auf","to insist on"],["vorbeibringen","to drop by with"],["fremd","someone else's"]],"q":[["Wo ist Ashas Paket?","Bei Familie Kowalski im vierten Stock.","Benachrichtigungskarte."],["Was ist passiert?","Der Sohn hat das Paket geöffnet und Pralinen gegessen.","Er dachte, es sei für sie."],["Wie endet die Geschichte?","Leon bringt neue Pralinen und eine Entschuldigungskarte.","Asha nimmt es mit Humor."]],"teaser":"Eine Benachrichtigungskarte, ein unbekannter Nachbar und ein Paket, das schon offen ist.","words":161},{"id":"termin","title":"Die Ausländerbehörde","level":"C1","topic":"Behörden · Geduld","min":3,"p":["Seit drei Wochen versuchte Ji-won, einen Termin bei der Ausländerbehörde zu bekommen. Ihr Aufenthaltstitel lief in zwei Monaten ab. Das Online-Portal zeigte immer dasselbe: „Derzeit sind keine Termine verfügbar.“","Eine Kollegin gab ihr einen Tipp. „Neue Termine werden morgens um sechs freigeschaltet. Um 6:02 sind sie wieder weg. Du musst um 5:59 bereit sein.“","Am nächsten Morgen stellte Ji-won den Wecker auf 5:50. Sie saß mit Kaffee vor dem Laptop und drückte um 6:00 auf „Aktualisieren“. Drei Termine erschienen. Sie klickte auf den ersten. „Dieser Termin ist leider nicht mehr verfügbar.“ Den zweiten. Weg. Den dritten. Er war noch da.","Mit zitternden Fingern füllte sie das Formular aus. Bestätigung: in sechs Wochen, Dienstag, 8:15 Uhr.","Gleichzeitig schickte sie, wie die Kollegin geraten hatte, eine E-Mail an die Behörde: „Mein Aufenthaltstitel läuft am 15. ab. Ich habe einen Termin am 22. Bitte bestätigen Sie mir eine Fiktionsbescheinigung.“ Zwei Wochen später kam die Antwort: Mit der Bescheinigung durfte sie weiter legal arbeiten, auch nach Ablauf.","Beim Termin dauerte alles nur zwölf Minuten. Fingerabdrücke, Foto, Unterschrift. Die Sachbearbeiterin war freundlich. „Haben Sie lange auf den Termin gewartet?“","„Drei Wochen. Und dann sechs Uhr morgens.“","Die Frau seufzte. „Ich weiß. Wir haben zu wenig Personal. Es tut mir leid.“ Es war, dachte Ji-won, das erste Mal, dass sich eine Behörde bei ihr entschuldigte."],"g":[["Ausländerbehörde","immigration office"],["Aufenthaltstitel","residence permit"],["ablaufen","to expire"],["verfügbar","available"],["freischalten","to release, activate"],["aktualisieren","to refresh"],["zittern","to tremble"],["Fiktionsbescheinigung","interim certificate of residence"],["Ablauf","expiry"],["Fingerabdruck","fingerprint"],["Sachbearbeiterin","case officer"],["Personal","staff"]],"q":[["Warum bekommt Ji-won keinen Termin?","Neue Termine sind sofort weg; das Portal zeigt keine verfügbaren.","Freigabe um sechs Uhr."],["Was ist die Fiktionsbescheinigung?","Ein Dokument, mit dem sie nach Ablauf weiter legal bleiben und arbeiten darf.","Bis zum Termin."],["Was überrascht sie beim Termin?","Die Sachbearbeiterin entschuldigt sich.","Wegen Personalmangel."]],"teaser":"Ein Online-Termin, der nie frei ist, und eine Strategie um sechs Uhr morgens.","words":219},{"id":"schluessel","title":"Ausgesperrt","level":"B2","topic":"Wohnen · Notfall","min":2,"p":["Klack. Die Wohnungstür fiel ins Schloss. Pablo stand im Treppenhaus, in Socken, mit dem Müllbeutel in der Hand. Der Schlüssel lag auf dem Küchentisch.","Er lieh sich das Handy der Nachbarin und suchte einen Schlüsseldienst. Der Erste sagte am Telefon: „Kommen in zwanzig Minuten. Kostet 290 Euro plus Anfahrt.“","„Wie bitte?“","Die Nachbarin, Frau Lenz, schüttelte den Kopf. „Nicht den ersten aus dem Internet. Das sind oft Abzocker. Ruf den Hausmeister an, der hat einen Generalschlüssel. Oder einen Schlüsseldienst aus dem Ort, mit Festpreis.“","Der Hausmeister war im Urlaub. Frau Lenz telefonierte selbst und fand einen kleinen Betrieb zwei Straßen weiter. „Tür nur zugefallen, nicht abgeschlossen? Dann neunzig Euro, Festpreis.“","Der Mann kam mit einer Plastikkarte und öffnete die Tür in dreißig Sekunden. Pablo zahlte und schämte sich ein bisschen.","„Machen Sie es wie ich“, sagte der Mann beim Gehen. „Geben Sie einen Ersatzschlüssel einer Person, der Sie vertrauen.“","Am selben Abend brachte Pablo Frau Lenz einen Ersatzschlüssel und eine Flasche Wein."],"g":[["ins Schloss fallen","to slam shut"],["Treppenhaus","stairwell"],["Müllbeutel","bin bag"],["Schlüsseldienst","locksmith"],["Anfahrt","call-out fee"],["Abzocker","rip-off merchant"],["Hausmeister","caretaker"],["Generalschlüssel","master key"],["Festpreis","fixed price"],["abgeschlossen","locked"]],"q":[["Was ist passiert?","Die Tür ist zugefallen, der Schlüssel liegt drinnen.","Pablo in Socken."],["Warum warnt Frau Lenz?","Manche Schlüsseldienste aus dem Internet zocken ab.","Lieber lokal mit Festpreis."],["Was ist der Rat des Schlüsseldiensts?","Einen Ersatzschlüssel bei einer Vertrauensperson lassen.","Pablo gibt ihn Frau Lenz."]],"teaser":"Die Tür fällt zu, der Schlüssel liegt drinnen, und der Schlüsseldienst will 300 Euro.","words":162},{"id":"handwerk2","title":"Der Elektriker spricht Schwäbisch","level":"B2","topic":"Dialekt · Arbeit","min":2,"p":["„Grüß Gott! I bin dr Elektriker. Wo isch der Schalter, der net goht?“","Kim verstand ungefähr jedes zweite Wort. „Entschuldigung, können Sie langsamer sprechen?“","Der Mann grinste. „Klar. Wo – ist – der – Schalter? Der nicht geht?“","Sie zeigte ihm die Küche. Er schraubte, prüfte, murmelte: „Des isch ja a Glump. Wer hat'n des eibaut?“","„Glump?“","„Glump heißt … Schrott. Kaputtes Zeug.“ Er hielt ein verkohltes Kabel hoch. „Do hätt's brenne könne.“","Kim erschrak. „Brennen?“","„Ja. Gut, dass Sie angerufen haben.“ Plötzlich sprach er perfektes Hochdeutsch. Kim musste lachen. „Sie können ja Hochdeutsch!“","„Natürlich. Aber in der Küche red i Schwäbisch. Des isch gemütlicher.“","Nach einer Stunde war alles repariert. Beim Gehen sagte er: „Ade, und schaffet net zu viel!“","Kim schrieb in ihr Notizbuch: Glump = Schrott. Schaffe = arbeiten. Ade = Tschüss. Und darunter: In der Küche spricht man Schwäbisch."],"g":[["net","(Swabian) nicht"],["goht","(Swabian) geht"],["Glump","(Swabian) junk"],["einbauen","to install"],["Schrott","scrap, junk"],["verkohlt","charred"],["brennen","to burn"],["erschrecken","to get a fright"],["gemütlich","cosy, relaxed"],["schaffe","(Swabian) arbeiten"],["Ade","(Swabian) goodbye"]],"q":[["Was bedeutet „Glump“?","Schrott, kaputtes Zeug.","Schwäbisch."],["Warum war die Reparatur wichtig?","Ein verkohltes Kabel hätte brennen können.","Brandgefahr."],["Warum spricht der Elektriker Dialekt?","In der Küche ist Schwäbisch gemütlicher.","Er kann auch Hochdeutsch."]],"teaser":"Ein Elektriker, der nur Dialekt spricht, und eine Mieterin, die trotzdem alles versteht.","words":143},{"id":"bahn2","title":"Die Klimaanlage im ICE","level":"B2","topic":"Reisen · Humor","min":2,"p":["Es war 34 Grad, und im ICE nach Berlin war die Klimaanlage ausgefallen. Im Wagen 7 war es wie in einer Sauna.","„Sehr geehrte Fahrgäste“, sagte der Zugbegleiter, „wir haben leider eine Störung an der Klimaanlage. Im Bordbistro gibt es kostenlos Wasser.“","Jakub schaute die Leute um sich herum an. Ein Geschäftsmann zog sein Jackett aus. Eine Studentin fächelte sich mit einem Buch Luft zu. Ein älterer Herr hatte ein nasses Taschentuch auf dem Kopf.","„Ich hol Wasser für alle“, sagte Jakub. „Wie viele brauchen wir?“","„Sechs!“, rief die Studentin.","Er kam mit sechs Flaschen zurück. Der Geschäftsmann teilte seine Schokolade, die längst geschmolzen war, die Studentin ein Kartenspiel. Der ältere Herr erzählte, dass er 1975 im Zug ohne Klimaanlage nach Italien gefahren sei. „Damals war das normal. Fenster auf, fertig.“","In Berlin kam die Durchsage: „Für die Unannehmlichkeiten erhalten Sie einen Gutschein.“ Die sechs schauten sich an und lachten. „Ehrlich gesagt“, sagte die Studentin, „war das die lustigste Zugfahrt meines Lebens.“"],"g":[["Klimaanlage","air conditioning"],["ausfallen","to break down"],["Zugbegleiter","train conductor"],["Störung","fault"],["kostenlos","free"],["Jackett","jacket"],["sich Luft zufächeln","to fan oneself"],["geschmolzen","melted"],["Unannehmlichkeit","inconvenience"],["Gutschein","voucher"]],"q":[["Was ist das Problem?","Die Klimaanlage im ICE ist bei 34 Grad ausgefallen.","Wie eine Sauna."],["Was macht Jakub?","Er holt Wasser für alle.","Kostenlos im Bordbistro."],["Was sagt die Studentin am Ende?","Es war die lustigste Zugfahrt ihres Lebens.","Gemeinsamkeit durch Problem."]],"teaser":"Ein Sommertag, ein ICE ohne Kühlung und Fremde, die zu einer Gruppe werden.","words":162},{"id":"smalltalk","title":"Small Talk im Aufzug","level":"B2","topic":"Kommunikation · Alltag","min":2,"p":["Der Aufzug öffnete sich, und drin stand der Geschäftsführer. Herr Dr. Meyer. Nkem hatte ihn bisher nur auf Fotos gesehen.","„Morgen“, sagte Dr. Meyer.","„Guten Morgen“, sagte Nkem. Dann Stille. Acht Stockwerke. Dreißig Sekunden.","Nkem dachte fieberhaft nach. Über das Wetter reden? Zu banal. Über die Arbeit? Zu riskant.","Dr. Meyer sprach zuerst. „Sie sind neu, oder? IT?“","„Ja. Seit drei Monaten. Im Support.“","„Und? Wie gefällt's Ihnen?“","Nkem entschied sich für Ehrlichkeit. „Sehr gut. Nur der Kaffee im dritten Stock ist schlecht.“","Dr. Meyer lachte laut. „Das sagen alle. Die Maschine ist von 2009.“","Der Aufzug hielt. „Achter Stock“, sagte Dr. Meyer. „Schönen Tag noch.“","Eine Woche später stand im dritten Stock eine neue Kaffeemaschine. Mit einem Zettel: „Auf Anregung aus dem Support.“ Nkems Kollegen fragten, wer das gewesen sei. Nkem sagte nichts und trank seinen Kaffee."],"g":[["Aufzug","lift"],["Geschäftsführer","managing director"],["Stockwerk","floor"],["fieberhaft","feverishly"],["banal","trivial"],["riskant","risky"],["Ehrlichkeit","honesty"],["Anregung","suggestion"],["Schönen Tag noch","have a nice day"]],"q":[["Worüber denkt Nkem nach?","Worüber man mit dem Chef sprechen kann.","Wetter zu banal, Arbeit zu riskant."],["Was sagt er ehrlich?","Dass der Kaffee im dritten Stock schlecht ist.","Mit Humor."],["Was passiert danach?","Eine neue Kaffeemaschine kommt.","Auf Anregung aus dem Support."]],"teaser":"Dreißig Sekunden im Aufzug mit dem Geschäftsführer – und was man dann sagt.","words":138},{"id":"spaziergang","title":"Sonntagsspaziergang","level":"B2","topic":"Kultur · Freizeit","min":2,"p":["Am ersten Sonntag in Deutschland wollte Valentina einkaufen gehen. Der Supermarkt war zu. Die Bäckerei auch, nach elf Uhr. Die Stadt war still.","„Was machen die Leute sonntags?“, fragte sie ihre Kollegin am Telefon.","„Spazieren gehen“, sagte die Kollegin. „Familie besuchen. Kuchen essen. Nichts tun. Sonntag ist Ruhetag.“","„Nur spazieren?“","„Glaub mir, es ist das Beste an Deutschland. Geh einfach raus.“","Valentina ging raus. Im Park waren Hunderte Menschen: Familien mit Kinderwagen, ältere Paare Hand in Hand, Jogger, Hunde. Alle gingen langsam. Niemand hatte es eilig.","Sie setzte sich auf eine Bank. Eine alte Dame setzte sich daneben. „Schöner Tag, gell?“","„Ja. Sehr schön.“","„Machen Sie das öfter? Sonntags im Park?“","„Zum ersten Mal.“","„Dann willkommen. Ich komm jeden Sonntag. Seit fünfzig Jahren.“","Sie redeten eine Stunde. Am nächsten Sonntag kam Valentina wieder. Die alte Dame saß schon da und hatte zwei Stück Kuchen mitgebracht."],"g":[["zu sein","to be closed"],["still","quiet"],["Ruhetag","day of rest"],["es eilig haben","to be in a hurry"],["Bank","bench"],["gell?","(southern) isn't it?"],["öfter","more often"],["Kinderwagen","pram"]],"q":[["Warum kann Valentina sonntags nicht einkaufen?","Fast alle Geschäfte sind geschlossen.","Ruhetag."],["Was machen die Deutschen sonntags?","Spazieren, Familie besuchen, Kuchen essen, ausruhen.","Kein Stress."],["Was entsteht aus dem Spaziergang?","Eine Freundschaft mit einer alten Dame.","Kuchen am nächsten Sonntag."]],"teaser":"Sonntags sind alle Geschäfte zu – und eine neue Nachbarin entdeckt, was die Deutschen stattdessen machen.","words":145},{"id":"duzen","title":"Du oder Sie?","level":"B2","topic":"Höflichkeit · Sprache","min":2,"p":["Im Büro siezte Arif alle. Im Sprachkurs hatte man gelernt: Bei Unsicherheit immer „Sie“. Also sagte er „Sie“ zu Kollegen, zur Chefin, zum Hausmeister.","Dann trat er in einen Fußballverein ein. Beim ersten Training sagte er zum Trainer: „Entschuldigen Sie, wo soll ich mich umziehen?“","Alle lachten. Der Trainer, ein Mann von sechzig mit Bierbauch, klopfte ihm auf die Schulter. „Junge, beim Fußball sind wir alle per Du. Ich bin der Harald.“","In der Woche darauf war Arif im Büro. Er wollte locker sein und sagte zur neuen Abteilungsleiterin: „Hallo, wie geht's dir?“","Sie schaute ihn überrascht an. „Mir geht es gut, danke. Und Ihnen?“","Arif wurde rot. Am Abend fragte er Harald beim Training: „Wann sagt man denn jetzt Du und wann Sie?“","Harald dachte nach. „Im Verein, unter Freunden, unter Jüngeren: Du. Bei der Arbeit, beim Amt, bei Älteren: Sie. Und die Person, die älter oder höher ist, bietet das Du an. Nicht du.“","„Und wenn ich unsicher bin?“","„Dann warte ab, was der andere sagt. Und mach's genauso.“"],"g":[["siezen","to use \"Sie\""],["duzen","to use \"du\""],["eintreten","to join"],["sich umziehen","to get changed"],["Bierbauch","beer belly"],["per Du sein","to be on first-name terms"],["locker","relaxed"],["Abteilungsleiterin","head of department"],["anbieten","to offer"],["abwarten","to wait and see"]],"q":[["Wo duzt man sich laut Harald?","Im Verein, unter Freunden, unter Jüngeren.","Beim Fußball immer."],["Was war Arifs Fehler im Büro?","Er hat die Abteilungsleiterin geduzt.","Sie antwortet mit Sie."],["Wer bietet das Du an?","Die ältere oder ranghöhere Person.","Sonst abwarten."]],"teaser":"Die schwierigste Frage im deutschen Alltag – und eine peinliche Verwechslung beim Fußballverein.","words":171},{"id":"recycling","title":"Der gelbe Sack","level":"B2","topic":"Umwelt · Regeln","min":2,"p":["„Das gehört nicht in die Restmülltonne!“ Herr Fischer hielt einen Joghurtbecher hoch, den er offenbar aus Hamids Müll geholt hatte.","Hamid war sprachlos. „Sie haben in meinem Müll gesucht?“","„Der lag oben. Joghurtbecher gehören in den Gelben Sack. Verpackungen aus Plastik, Metall, Verbundstoffe.“","„Und Papier?“","„Blaue Tonne. Außer verschmutztes Papier, das ist Restmüll. Essensreste in die Biotonne, braun. Glas zum Container, nach Farben getrennt: weiß, grün, braun. Und blaues Glas zu grün.“","„Blaues Glas zu grün?“","„Ja. Fragen Sie nicht, warum.“","Hamid ging nach oben und machte ein Foto von der Infotafel im Keller. Er klebte es an seine Küchentür. Drei Wochen lang trennte er alles perfekt.","Eines Morgens lag ein Zettel in seinem Briefkasten: „Vorbildliche Mülltrennung! Weiter so. Gruß, H. Fischer.“","Hamid lachte. Dann ging er mit einer leeren Weinflasche zum Container. Sie war blau. Er warf sie zu den grünen."],"g":[["Restmülltonne","general waste bin"],["Joghurtbecher","yoghurt pot"],["sprachlos","speechless"],["Gelber Sack","yellow bag (packaging waste)"],["Verpackung","packaging"],["Verbundstoffe","composite materials"],["verschmutzt","dirty"],["Biotonne","organic waste bin"],["getrennt","separated"],["vorbildlich","exemplary"]],"q":[["Wohin gehört ein Joghurtbecher?","In den Gelben Sack.","Plastikverpackung."],["Wohin gehört blaues Glas?","Zum grünen Glas.","Eine seltsame Regel."],["Wie reagiert Herr Fischer später?","Er lobt Hamid mit einem Zettel.","„Vorbildlich.“"]],"teaser":"Mülltrennung auf Deutsch: vier Tonnen, viele Regeln und ein empörter Nachbar.","words":142},{"id":"weihnachten","title":"Weihnachten bei der Familie des Kollegen","level":"B2","topic":"Feste · Familie","min":3,"p":["„Du bist an Weihnachten allein?“, fragte Stefan. „Das geht nicht. Komm zu uns.“","Am 24. Dezember stand Kenji vor einem Einfamilienhaus in Ludwigsburg. Er hatte Blumen dabei. Stefan öffnete, und dahinter stand eine ganze Familie: Eltern, zwei Schwestern, ein Onkel, drei Kinder.","Im Wohnzimmer stand ein riesiger Tannenbaum mit echten Kerzen. „Echte Kerzen?“, fragte Kenji. „Ist das nicht gefährlich?“","„Deshalb steht ein Eimer Wasser daneben“, sagte Stefans Vater ernst.","Um sechs ging die Familie in die Kirche. Danach gab es Kartoffelsalat mit Würstchen. „Das ist das traditionelle Essen am Heiligabend“, erklärte Stefans Mutter. „Ganz einfach. Das große Essen gibt es am ersten Feiertag.“","Dann klingelte ein Glöckchen. Die Kinder rannten ins Wohnzimmer. Bescherung. Unter dem Baum lagen viele Geschenke. Kenji wurde nervös. Er hatte nur die Blumen.","Dann gab ihm Stefans Mutter ein kleines Päckchen. Darin war ein selbst gestrickter Schal. „Stefan hat gesagt, du frierst immer“, sagte sie.","Kenji war so gerührt, dass er kaum sprechen konnte. „Aber ich habe nichts für Sie.“","„Du bist da“, sagte sie. „Das reicht.“","Danach sangen alle „Stille Nacht“. Kenji kannte den Text nicht, aber er kannte die Melodie aus Japan. Er summte mit."],"g":[["Heiligabend","Christmas Eve"],["Einfamilienhaus","detached house"],["Tannenbaum","Christmas tree"],["Kerze","candle"],["Eimer","bucket"],["Feiertag","holiday"],["Glöckchen","little bell"],["Bescherung","giving of presents"],["stricken","to knit"],["frieren","to be cold"],["gerührt","touched"],["summen","to hum"]],"q":[["Was isst man traditionell am Heiligabend?","Kartoffelsalat mit Würstchen.","Großes Essen am Feiertag."],["Was ist die Bescherung?","Die Geschenkübergabe am Heiligabend.","Nach dem Glöckchen."],["Was bekommt Kenji?","Einen selbst gestrickten Schal.","Weil er immer friert."]],"teaser":"Eine Einladung zum Heiligabend, eine Bescherung und ein Gast, der kein Geschenk dabei hat.","words":191},{"id":"kochkurs","title":"Volkshochschule","level":"B2","topic":"Lernen · Freizeit","min":2,"p":["Der Kurs hieß „Schwäbische Küche für Anfänger“. Volkshochschule, dienstags, 18 Uhr, 45 Euro für vier Abende. Svetlana hatte sich angemeldet, um Leute kennenzulernen.","Die Kursleiterin, Frau Hägele, verteilte Schürzen. „Heute machen wir Käsespätzle. In Zweiergruppen.“","Svetlana kochte mit einem Mann namens Gerd, Rentner, ehemaliger Ingenieur. Gerd las das Rezept dreimal und wog jedes Gramm Mehl genau ab. „Präzision ist alles“, sagte er.","Trotzdem wurde der Teig zu flüssig. Gerd rechnete nach. „Die Eier waren zu groß. Größe L statt M.“","Frau Hägele kam vorbei und schüttelte den Kopf. „Gerd, beim Kochen rechnet man nicht. Man fühlt.“ Sie gab eine Handvoll Mehl dazu, ohne zu wiegen. Der Teig war perfekt.","Gerd war beleidigt. Svetlana musste lachen.","Am Ende aßen alle zusammen an einem langen Tisch. Zwölf Leute, die sich vorher nicht kannten. Am vierten Abend tauschten sie Telefonnummern. Gerd gründete eine WhatsApp-Gruppe: „Kochkurs VHS – Präzision ist alles“. Frau Hägele trat bei und änderte den Namen in „Kochen nach Gefühl“."],"g":[["Volkshochschule (VHS)","adult education centre"],["sich anmelden","to register"],["Kursleiterin","course instructor"],["Schürze","apron"],["Rentner","pensioner"],["abwiegen","to weigh out"],["flüssig","runny"],["nachrechnen","to recalculate"],["beleidigt","offended"],["gründen","to set up"],["beitreten","to join"]],"q":[["Warum meldet sich Svetlana an?","Um Leute kennenzulernen.","VHS-Kochkurs."],["Was ist Gerds Methode?","Präzise abwiegen und rechnen.","Ehemaliger Ingenieur."],["Was sagt Frau Hägele dazu?","Beim Kochen fühlt man, man rechnet nicht.","Gruppenname geändert."]],"teaser":"Ein Kochkurs an der VHS, zwölf Fremde und ein Rezept für Käsespätzle, das schiefgeht.","words":159},{"id":"katze2","title":"Eine Katze zieht ein","level":"B2","topic":"Haustiere · Wohnen","min":2,"p":["Jeden Abend saß eine graue Katze vor Mehmets Balkontür im Erdgeschoss. Sie schaute hinein, miaute einmal und ging wieder.","Nach einer Woche stellte Mehmet ein Schälchen Milch hin. Die Nachbarin sah es. „Keine Milch! Katzen vertragen keine Milch. Wasser.“","„Wem gehört die Katze?“","„Niemandem. Die Familie, der sie gehört hat, ist vor einem Monat ausgezogen. Und hat sie zurückgelassen.“","Mehmet war entsetzt. Er rief beim Tierheim an. „Die Katze ist wahrscheinlich nicht gechippt. Wenn Sie sie behalten wollen, müssen Sie sie zum Tierarzt bringen. Impfen, chippen, kastrieren.“","Behalten? Er hatte nie eine Katze gehabt. Er fragte seinen Vermieter. „Eine Katze? Kein Problem, solange sie nichts kaputt macht.“","Am Samstag brachte er sie zum Tierarzt. Gesund, ungefähr vier Jahre alt, ein Kater. „Wie heißt er denn?“, fragte die Tierärztin.","Mehmet überlegte. „Abend“, sagte er. „Weil er immer abends kommt.“","Jetzt kommt Abend nicht mehr nur abends. Er wohnt da."],"g":[["Balkontür","balcony door"],["Schälchen","small bowl"],["vertragen","to tolerate"],["zurücklassen","to leave behind"],["entsetzt","horrified"],["Tierheim","animal shelter"],["chippen","to microchip"],["impfen","to vaccinate"],["kastrieren","to neuter"],["behalten","to keep"]],"q":[["Warum soll Mehmet keine Milch geben?","Katzen vertragen keine Milch.","Wasser ist besser."],["Wem gehört die Katze?","Niemandem mehr; die Familie hat sie zurückgelassen.","Beim Umzug."],["Warum heißt der Kater „Abend“?","Weil er immer abends kam.","Jetzt wohnt er dort."]],"teaser":"Ein Kater, der jeden Abend am Fenster sitzt, und eine Entscheidung, die nicht geplant war.","words":148},{"id":"streit","title":"Streit in der Familiengruppe","level":"B2","topic":"Familie · Kommunikation","min":2,"p":["In der Familiengruppe „Müller-Clan 🏡“ schrieb Tante Gabi: „Wer bringt dieses Jahr den Kartoffelsalat zu Opas Geburtstag?“","Leonie, die mit ihrem Freund Sami zum ersten Mal kommen sollte, schrieb: „Sami kann einen marokkanischen Salat machen!“","Drei Minuten Stille. Dann Onkel Werner: „An Opas Geburtstag gibt es seit vierzig Jahren Kartoffelsalat.“","Dann eine Sprachnachricht von Tante Gabi. Sieben Minuten lang. Über Traditionen, über Opa, über ein Familienfest 1998, bei dem jemand Nudelsalat mitgebracht hatte.","Sami las mit und wurde unsicher. „Mögen die mich nicht?“","Leonie seufzte. „Doch. Die mögen nur keine Veränderung.“","Dann schrieb Opa selbst. Er schrieb fast nie in die Gruppe. „Ich möchte beides. Kartoffelsalat von Gabi und den marokkanischen Salat von Sami. Ich bin 85, ich darf mir was wünschen.“","Stille. Dann Daumen hoch von allen.","Beim Geburtstag war Samis Salat zuerst leer. Tante Gabi nahm sich dreimal. Am Ende fragte sie leise nach dem Rezept."],"g":[["Clan","clan"],["Sprachnachricht","voice message"],["Stille","silence"],["Tradition","tradition"],["Missverständnis","misunderstanding"],["unsicher","unsure"],["Veränderung","change"],["sich etwas wünschen","to wish for something"],["Daumen hoch","thumbs up"],["sich nehmen","to help oneself"]],"q":[["Worüber streitet die Familie?","Ob es einen marokkanischen Salat statt Kartoffelsalat geben darf.","Tradition."],["Wie löst Opa den Konflikt?","Er wünscht sich beides.","Er hat das letzte Wort."],["Was passiert beim Fest?","Samis Salat ist zuerst leer; Tante Gabi fragt nach dem Rezept.","Versöhnung."]],"teaser":"Eine WhatsApp-Gruppe, eine Sprachnachricht von sieben Minuten und ein Missverständnis.","words":148},{"id":"bewerbung2","title":"Das Anschreiben","level":"B2","topic":"Karriere · Schreiben","min":2,"p":["Lisas Freundin Petra las das Anschreiben und verzog das Gesicht. „Das kannst du so nicht schicken.“","„Warum nicht? Ist alles richtig.“","„Grammatikalisch ja. Aber du schreibst: ‚Ich bin die beste Kandidatin für diese Stelle.' Das klingt in Deutschland arrogant.“","„Aber in Amerika schreibt man so!“","„Hier nicht. Hier zeigt man es mit Beispielen. Statt ‚Ich bin teamfähig' schreibst du: ‚In meinem letzten Projekt habe ich ein Team von fünf Personen koordiniert.'“","Sie arbeiteten zwei Stunden. Petra strich Sätze wie „Ich bin sehr motiviert“ und „Ich bin perfekt für Sie“. Sie fügte Sätze ein wie „Besonders reizt mich an Ihrem Unternehmen …“ und „Über eine Einladung zu einem persönlichen Gespräch freue ich mich.“","„Und am Ende: ‚Mit freundlichen Grüßen'. Nicht ‚Liebe Grüße'. Das ist für Freunde.“","Lisa schickte die Bewerbung ab. Eine Woche später kam die Einladung. Sie schickte Petra einen Screenshot. Petra antwortete: „Siehst du. Bescheidenheit mit Beispielen. Das wirkt.“"],"g":[["Anschreiben","cover letter"],["das Gesicht verziehen","to grimace"],["Kandidatin","candidate"],["teamfähig","good at teamwork"],["koordinieren","to coordinate"],["streichen","to delete"],["einfügen","to insert"],["reizen","to appeal"],["Mit freundlichen Grüßen","Yours sincerely"],["Bescheidenheit","modesty"]],"q":[["Warum soll Lisa „die beste Kandidatin“ streichen?","Es klingt in Deutschland arrogant.","Anders als in den USA."],["Was ist besser als Eigenschaften?","Konkrete Beispiele.","Statt „teamfähig“ ein Projekt beschreiben."],["Wie schließt man formell?","„Mit freundlichen Grüßen“.","Nicht „Liebe Grüße“."]],"teaser":"Wie ein Bewerbungsschreiben auf Deutsch richtig klingt – mit Hilfe einer strengen Freundin.","words":150},{"id":"feierabend","title":"Feierabend ist Feierabend","level":"B2","topic":"Arbeit · Kultur","min":2,"p":["Um 17:01 Uhr war das Büro leer. Bis auf Priya. Sie arbeitete noch an einer Präsentation.","Ihr Teamleiter Markus kam noch einmal zurück, weil er seinen Schlüssel vergessen hatte. „Sie sind noch da?“","„Ja. Ich will die Präsentation fertig machen.“","„Bis wann ist die?“","„Nächsten Freitag.“","Markus lachte. „Dann gehen Sie nach Hause. Feierabend ist Feierabend.“","„Aber in meiner alten Firma in Bangalore …“","„Hier ist es anders. Wenn Sie jeden Tag länger bleiben, denke ich nicht, dass Sie fleißig sind. Ich denke, Sie haben zu viel Arbeit oder planen schlecht. Und beides muss ich dann ändern.“","Priya war überrascht. Sie hatte gedacht, lange zu bleiben würde Eindruck machen.","Am nächsten Tag ging sie um 17 Uhr. Es fühlte sich falsch an, fast wie Schwänzen. Aber am Abend ging sie zum ersten Mal seit Monaten joggen.","Nach einem Monat merkte sie, dass sie morgens konzentrierter war. Die Präsentation war pünktlich fertig. Markus sagte: „Passt.“"],"g":[["Feierabend","end of the working day"],["Präsentation","presentation"],["fertig machen","to finish"],["fleißig","hard-working"],["planen","to plan"],["Eindruck machen","to make an impression"],["schwänzen","to skip (school/work)"],["konzentriert","focused"],["pünktlich","on time"]],"q":[["Was bedeutet „Feierabend ist Feierabend“?","Nach der Arbeitszeit soll man nach Hause gehen.","Kulturelle Norm."],["Was denkt Markus, wenn jemand immer länger bleibt?","Zu viel Arbeit oder schlechte Planung.","Nicht Fleiß."],["Was ändert sich für Priya?","Sie hat Freizeit, joggt und ist morgens konzentrierter.","Arbeit trotzdem pünktlich."]],"teaser":"Warum um 17 Uhr das Büro leer ist – und eine Kollegin, die lernt, auch zu gehen.","words":154},{"id":"bibliothek","title":"Der Bibliotheksausweis","level":"B2","topic":"Bildung · Alltag","min":2,"p":["„Ein Bibliotheksausweis kostet zwanzig Euro im Jahr“, sagte die Mitarbeiterin der Stadtbibliothek. „Mit Studentenausweis oder Sozialpass weniger.“","Oleksandr zahlte. Er hatte die Bibliothek am Mailänder Platz in Stuttgart gesehen, ein weißer Würfel, innen ganz weiß mit Treppen wie in einem Traum.","„Was kann ich ausleihen?“","„Bücher, Filme, Hörbücher, Brettspiele, Noten. Und mit der App auch E-Books. Und wir haben Deutsch-Lerngruppen, dienstags, kostenlos.“","„Kostenlos?“","„Kostenlos. Mit Ehrenamtlichen.“","Oleksandr lieh zehn Bücher aus. Kinderbücher, weil die leicht waren, und einen Krimi, weil er neugierig war. „Leihfrist vier Wochen“, sagte die Frau. „Verlängern online. Und bitte nicht in die Badewanne mitnehmen.“","Am Dienstag ging er zur Lerngruppe. Zehn Menschen aus acht Ländern und eine pensionierte Lehrerin, Frau Wagner, die sie Zeitungsartikel vorlesen ließ. Danach gingen alle zusammen ins Café im obersten Stock, mit Blick über die ganze Stadt.","Oleksandr kam jeden Dienstag. Nach einem halben Jahr las er den Krimi. Er verlängerte ihn dreimal."],"g":[["Bibliotheksausweis","library card"],["Würfel","cube"],["ausleihen","to borrow"],["Hörbuch","audiobook"],["Brettspiel","board game"],["Noten","sheet music"],["Ehrenamtliche","volunteers"],["Leihfrist","loan period"],["verlängern","to renew"],["pensioniert","retired"]],"q":[["Was kann man in der Bibliothek ausleihen?","Bücher, Filme, Hörbücher, Spiele, Noten, E-Books.","Mit Ausweis."],["Was ist die Lerngruppe?","Kostenlose Deutschgruppe mit Ehrenamtlichen.","Dienstags."],["Was zeigt das E
