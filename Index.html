agte die Kollegin. „Und alle sagen immer, die Deutschen sind kalt.“","„Kalt nicht“, sagte Aylin. „Nur ein bisschen schüchtern. Bis man ein Problem hat.“","Danach machte sie zwei Dinge: Sie richtete auf ihrem Handy eine Notfallnummer auf dem Sperrbildschirm ein. Und sie schrieb sich die wichtigsten Sätze auf, falls es noch einmal passiert: „Ich habe mein Handy verloren.“ – „Wo ist das Fundbüro?“ – „Kann ich kurz Ihr Handy benutzen?“ – „Sie haben mir den Tag gerettet.“"],"g":[["Mist","damn (mild swear)"],["abtasten","to pat down, feel"],["liegen lassen","to leave behind"],["Oh je","oh dear"],["Fundbüro","lost property office"],["abnehmen","(phone) to answer"],["abgeben","to hand in"],["kein Ding","no problem (slang)"],["Bahnsteig","platform"],["jemandem den Tag retten","to save someone's day"],["Ach was","oh, come on (modest)"],["abwinken","to wave it off"],["Nee, passt schon","nah, it's fine"],["blöd","annoying, stupid"],["bestehen auf","to insist on"],["schüchtern","shy"],["Sperrbildschirm","lock screen"]],"q":[["Wo hat Aylin ihr Handy verloren?","In der U14.","Sie merkt es an der Haltestelle."],["Wie bekommt sie es zurück?","Sie ruft ihre eigene Nummer an; ein Junge nimmt ab und wartet in Heslach.","Mit dem Handy eines Fremden."],["Warum will der Junge zuerst kein Geld?","Er findet es selbstverständlich; seine Mutter hat ihr Handy einmal nie wiederbekommen.","Am Ende nimmt er es für ein Eis."],["Was sagt Aylin über die Deutschen?","Nicht kalt, nur schüchtern – bis man ein Problem hat.","Umdeutung eines Klischees."],["Was macht sie danach?","Notfallnummer auf dem Sperrbildschirm und nützliche Sätze notieren.","Vorbereitung für das nächste Mal."]],"teaser":"Ein verlorenes Handy, ein Fundbüro und viele nützliche Sätze für den Notfall.","words":370},{"id":"markt","title":"Samstag auf dem Wochenmarkt","level":"B2","topic":"Einkaufen · Essen","min":6,"p":["„Was darf's sein?“, fragte die Frau am Gemüsestand. Sie hatte rote Wangen, eine grüne Schürze und eine Stimme, die über den halben Marktplatz reichte.","Lukas schaute auf seinen Zettel. „Ähm, ich hätte gern ein Kilo Tomaten.“","„Welche denn? Die Fleischtomaten, die Roma oder die Kirschtomaten?“","Er hatte nicht gewusst, dass man sich bei Tomaten entscheiden muss. „Was nehm ich für Salat?“","„Für Salat die Ochsenherzen hier. Die sind gerade richtig gut. Probieren Sie mal.“ Sie schnitt ein Stück ab und hielt es ihm hin.","Er probierte. Die Tomate schmeckte nach Sommer, nach Sonne, nach etwas, das er aus dem Supermarkt nicht kannte. „Wow. Okay, davon ein Kilo.“","„Gern. Sonst noch was?“","„Ja, Zwiebeln. Und … was ist das da?“ Er zeigte auf etwas Grünes, Knolliges.","„Kohlrabi. Kennen Sie nicht? Den kann man roh essen, wie einen Apfel, oder kochen. Meine Enkel essen den roh mit Salz.“","„Dann nehm ich einen.“","„Zwei“, sagte sie. „Einer ist zu wenig. Glauben Sie mir.“","Lukas lachte. „Na gut, zwei.“","Am Käsestand wartete eine lange Schlange. Vor ihm stand ein älteres Ehepaar, das sich leise darüber stritt, ob man den Bergkäse „mittelalt“ oder „alt“ nehmen solle. Am Ende nahmen sie beide. Als Lukas an der Reihe war, sagte er: „Ich hätte gern ein Stück Bergkäse. Ungefähr zweihundert Gramm.“","„Darf's ein bisschen mehr sein?“, fragte der Verkäufer, das Messer schon angesetzt.","Lukas wusste, dass das eine typische Frage war. Fast immer wurde es mehr. „Ja, passt schon.“","Es waren 280 Gramm.","Beim Bäckerstand kaufte er ein Bauernbrot und hörte, wie ein Mann vor ihm „a Viertele Brot“ bestellte. Die Verkäuferin verstand ihn sofort und schnitt ein Viertel von einem großen Laib ab. Lukas merkte sich: Man kann auch Teile von Broten kaufen.","Zum Schluss ging er zurück zum Gemüsestand, weil er Kräuter vergessen hatte. Die Frau mit der grünen Schürze erkannte ihn sofort. „Na, schon wieder da? Hat der Kohlrabi geschmeckt?“","„Den hab ich noch gar nicht gegessen.“","„Dann aber heute noch! Frisch ist der am besten.“ Sie packte ihm einen Bund Petersilie ein und schüttelte den Kopf, als er bezahlen wollte. „Die geht aufs Haus. Für einen Stammkunden.“","„Ich bin doch heute zum ersten Mal hier.“","„Eben“, sagte sie. „Damit Sie wiederkommen.“","Er kam wieder. Jeden Samstag."],"g":[["Was darf's sein?","What would you like? (shop)"],["Ich hätte gern …","I'd like …"],["probieren","to taste, try"],["Sonst noch was?","Anything else?"],["knollig","bulbous"],["roh","raw"],["Glauben Sie mir","believe me"],["Schlange","queue"],["an der Reihe sein","to be next"],["Darf's ein bisschen mehr sein?","Is a bit more OK?"],["ansetzen","to position (a knife)"],["Laib","loaf"],["Bund","bunch"],["aufs Haus gehen","to be on the house"],["Stammkunde","regular customer"]],"q":[["Was empfiehlt die Händlerin für Salat?","Ochsenherz-Tomaten.","Sie lässt ihn probieren."],["Was ist Kohlrabi und wie isst man ihn?","Ein Gemüse, roh wie ein Apfel oder gekocht.","Die Enkel essen ihn mit Salz."],["Was bedeutet „Darf's ein bisschen mehr sein?“ in der Praxis?","Man bekommt meist mehr als bestellt.","280 statt 200 Gramm."],["Was lernt Lukas beim Bäcker?","Man kann auch Teile eines Brotes kaufen.","„A Viertele Brot.“"],["Warum schenkt die Händlerin ihm Petersilie?","Damit er als Stammkunde wiederkommt.","Kundenbindung durch Freundlichkeit."]],"teaser":"Wie man auf dem Markt einkauft, ohne sich zu blamieren – und warum man mit Händlern reden sollte.","words":372},{"id":"handwerker","title":"Der Handwerker kommt – irgendwann","level":"B2","topic":"Wohnen · Termine","min":6,"p":["„Firma Gruber Sanitär, Grüß Gott.“","„Guten Tag, mein Name ist Okoro. Bei mir tropft der Wasserhahn in der Küche. Schon seit zwei Wochen. Könnte jemand vorbeikommen?“","„Tropft nur, oder läuft's richtig?“","„Es tropft. Aber ziemlich stark. Ich stelle nachts eine Schüssel drunter.“","„Hm. Also, ehrlich gesagt sind wir total voll. Vor Ende des Monats wird das nix.“","Chidi schaute auf den Kalender. Es war der vierte. „Ende des Monats? Gibt es keine Möglichkeit, dass es schneller geht?“","„Wenn's ein Notfall wär, ja. Rohrbruch, Wasser im Keller, so was. Aber ein Tropfen …“ Die Frau machte eine Pause, die bedeutete: Das ist kein Notfall.","Chidi hatte inzwischen gelernt, dass man in Deutschland nicht drängeln, aber auch nicht sofort aufgeben sollte. „Verstehe ich. Könnten Sie mich auf eine Warteliste setzen? Falls jemand absagt, könnte ich kurzfristig. Ich arbeite von zu Hause.“","„Das ist gut, das notier ich mir. Wie ist Ihre Nummer?“","Er gab sie ihr. Zwei Wochen lang hörte er nichts. Die Schüssel füllte sich jede Nacht. Am fünfzehnten rief er wieder an, freundlich: „Ich wollte nur mal nachhaken, ob sich bei der Warteliste was ergeben hat.“","„Ach, Herr Okoro! Gut, dass Sie anrufen. Morgen um acht hat jemand abgesagt. Geht das?“","„Perfekt.“","Am nächsten Morgen stand um 8:40 Uhr ein Mann mit Werkzeugkasten vor der Tür. „Morgen. Gruber. Wo tropft's?“","Er schaute sich den Hahn zwei Minuten an, schraubte etwas auf, holte ein kleines Gummiteil heraus und hielt es gegen das Licht. „Dichtung. Völlig hinüber. Das ist ein Teil für fünfzig Cent.“","„Fünfzig Cent?“","„Plus Anfahrt und Arbeitszeit, klar.“ Er grinste. „Aber ehrlich, das hätten Sie auch selbst machen können. Ich zeig's Ihnen.“","Und das tat er. Er erklärte, wie man das Wasser unter der Spüle abdreht, welches Werkzeug man braucht und wo man solche Dichtungen kauft. „Baumarkt, Abteilung Sanitär. Nehmen Sie das alte Teil mit, dann finden Sie das richtige.“","Die Rechnung kam eine Woche später: 89 Euro. Chidi zahlte sie und kaufte sich am Wochenende im Baumarkt einen kleinen Werkzeugkasten. Als drei Monate später der Hahn im Bad tropfte, rief er niemanden an. Er drehte das Wasser ab, schraubte auf und wechselte die Dichtung. Es dauerte vierzig Minuten statt zwei. Aber es kostete fünfzig Cent."],"g":[["tropfen","to drip"],["Wasserhahn","tap, faucet"],["Schüssel","bowl"],["Das wird nix","(colloquial) that's not going to happen"],["Rohrbruch","burst pipe"],["drängeln","to push, pressure"],["Warteliste","waiting list"],["absagen","to cancel"],["kurzfristig","at short notice"],["nachhaken","to follow up"],["sich ergeben","to come up, arise"],["Werkzeugkasten","toolbox"],["Dichtung","seal, washer"],["Anfahrt","call-out (travel) fee"],["Spüle","sink"],["abdrehen","to turn off"],["Baumarkt","DIY store"]],"q":[["Warum bekommt Chidi keinen schnellen Termin?","Die Firma ist voll; ein Tropfen gilt nicht als Notfall.","Notfall wäre z. B. ein Rohrbruch."],["Welche Strategie nutzt er?","Höflich auf die Warteliste setzen lassen und später nachhaken.","Nicht drängeln, nicht aufgeben."],["Was war das Problem?","Eine kaputte Dichtung für fünfzig Cent.","Rechnung: 89 Euro."],["Was zeigt ihm der Handwerker?","Wie man das Wasser abdreht und die Dichtung selbst wechselt.","Und wo man Teile kauft."],["Wie endet die Geschichte?","Er repariert den nächsten Hahn selbst.","Langsamer, aber günstig."]],"teaser":"Ein tropfender Wasserhahn, ein Handwerker ohne Zeit und die Kunst, freundlich hartnäckig zu sein.","words":367},{"id":"kita","title":"Die Eingewöhnung","level":"B2","topic":"Familie · Kinder","min":6,"p":["„Und Sie bleiben die ersten Tage einfach mit im Raum“, sagte die Erzieherin, eine junge Frau namens Jule mit bunten Socken. „Sie setzen sich da in die Ecke und sind langweilig.“","„Langweilig?“, fragte Priya.","„Genau. Sie spielen nicht mit, Sie lesen nicht vor, Sie sind einfach da. Wie ein sicherer Hafen. Dann traut sich Mila nach und nach zu uns.“","Am ersten Tag klammerte sich Mila die ganze Stunde an Priyas Bein. Am zweiten Tag wagte sie sich drei Meter weg, zu einer Kiste mit Holzautos, und schaute alle zehn Sekunden zurück. Am dritten Tag spielte sie zwanzig Minuten mit einem Jungen namens Ben, der ihr erklärte, dass sein Auto ein Feuerwehrauto sei und ihres nur ein normales.","„Ihr könnt beide Feuerwehr sein“, sagte Jule.","„Nein“, sagte Ben ernst. „Es gibt nur eine Feuerwehr.“","Am vierten Tag kam der erste Versuch der Trennung. „Verabschieden Sie sich kurz und klar“, sagte Jule. „Nicht heimlich rausschleichen. Und nicht fünfmal zurückkommen. Sagen Sie: Mama geht jetzt einkaufen und kommt nach dem Essen wieder.“","Priya kniete sich hin. „Mila, Mama geht jetzt einkaufen. Ich komme nach dem Mittagessen wieder. Okay?“","Mila schaute sie an, dann Jule, dann Ben. Dann fing sie an zu weinen. Laut.","Priya wollte sofort umdrehen. Jule legte ihr kurz die Hand auf den Arm. „Gehen Sie. Wir rufen an, wenn sie sich nicht beruhigt. Versprochen.“","Priya ging. Sie saß fünfzehn Minuten im Auto vor der Kita und starrte auf ihr Handy. Es klingelte nicht. Nach zwanzig Minuten kam eine Nachricht: „Hat sich nach drei Minuten beruhigt. Spielt jetzt Feuerwehr mit Ben. Er hat sie zur Chefin gemacht 😊“","Priya lachte so laut, dass ein Mann auf dem Gehweg sich umdrehte.","Nach zwei Wochen blieb Mila bis zum Nachmittag. Nach einem Monat lief sie morgens in die Kita, ohne sich umzudrehen. Priya fand das gleichzeitig wunderbar und ein bisschen traurig.","Beim ersten Elternabend saß sie neben Bens Vater. „Ihre Tochter hat meinen Sohn total im Griff“, sagte er. „Zu Hause redet er nur noch von Mila.“","„Mila auch von Ben“, sagte Priya. „Sollen wir die beiden mal am Wochenende zusammen auf den Spielplatz lassen?“","„Gern! Samstag?“","Und so lernte Priya, die seit acht Monaten in Deutschland war und bisher kaum jemanden außerhalb der Arbeit kannte, ihre ersten Freunde kennen. Durch ein Feuerwehrauto."],"g":[["Erzieherin","nursery teacher"],["Eingewöhnung","settling-in period"],["sicherer Hafen","safe harbour"],["sich trauen","to dare"],["nach und nach","gradually"],["sich klammern an","to cling to"],["sich wagen","to venture"],["sich verabschieden","to say goodbye"],["heimlich","secretly"],["rausschleichen","to sneak out"],["sich beruhigen","to calm down"],["Versprochen","promise"],["Gehweg","pavement"],["im Griff haben","to have under control"],["Elternabend","parents' evening"]],"q":[["Was ist die Rolle der Mutter in den ersten Tagen?","Langweilig in der Ecke sitzen, als sicherer Hafen.","Das Kind soll sich selbst trauen."],["Wie soll man sich verabschieden?","Kurz und klar, nicht heimlich, nicht mehrmals zurückkommen.","Mit klarer Ansage, wann man wiederkommt."],["Wie reagiert Mila bei der ersten Trennung?","Sie weint, beruhigt sich aber nach drei Minuten.","Ben macht sie zur Feuerwehrchefin."],["Wie fühlt sich Priya nach einem Monat?","Gleichzeitig glücklich und ein bisschen traurig.","Mila dreht sich nicht mehr um."],["Was bringt die Kita Priya selbst?","Erste Freunde in Deutschland, über Bens Vater.","Durch ein Feuerwehrauto."]],"teaser":"Der erste Kita-Tag, ein weinendes Kind und eine Mutter, die mehr lernt als ihre Tochter.","words":381},{"id":"umzug","title":"Kartons, Pizza und ein Klavier","level":"B2","topic":"Wohnen · Freunde","min":6,"p":["„Wer hat denn bitte ein Klavier?“, rief Moritz, als er vor dem Umzugswagen stand.","„Ich hab's euch doch gesagt“, sagte Ines. „In der Nachricht. Unter dem Satz mit der Pizza.“","„Die Nachricht hab ich nur bis zur Pizza gelesen.“","Sie waren zu sechst: Ines, ihr Freund Paul, Moritz, zwei Kolleginnen und ein Nachbar, der sich spontan angeboten hatte, weil er „eh nichts vorhatte“. Die neue Wohnung lag im vierten Stock eines Altbaus in Stuttgart-Ost. Ohne Aufzug.","„Okay“, sagte Paul und klatschte in die Hände. „Plan: Erst die schweren Sachen, solange wir noch Kraft haben. Dann Kartons. Das Klavier ganz am Ende, weil ich dafür noch zwei Leute angerufen hab.“","„Wer kommt denn?“","„Mein Cousin und sein Kumpel. Die machen das beruflich. Also, nicht ganz. Sie haben einmal einen Kühlschrank getragen.“","Die ersten zwei Stunden liefen erstaunlich gut. Sofa, Bett, Schrank, Waschmaschine. Auf jeder Treppe hörte man dieselben Sätze: „Vorsicht, Ecke!“ – „Hast du's?“ – „Moment, ich muss umgreifen.“ – „Nicht so schnell!“ – „Links, links, MEIN links!“","Bei der Waschmaschine blieben sie zwischen dem zweiten und dritten Stock stecken. „Die passt nicht um die Kurve“, sagte Moritz.","„Die muss passen“, sagte Ines. „Die stand vorher auch in einer Wohnung.“","„Ja, im Erdgeschoss.“","Nach zehn Minuten Kippen, Drehen und Fluchen passte sie. Alle applaudierten.","Gegen eins bestellten sie Pizza. Sie saßen zwischen Kartons auf dem Boden, aßen aus den Schachteln und tranken warmes Bier, weil der Kühlschrank noch nicht lief. Der Nachbar, der eigentlich nur eine Stunde helfen wollte, war immer noch da. Er hieß Dragan und erzählte, dass er selbst sieben Mal in Stuttgart umgezogen sei. „Beim fünften Mal hab ich gesagt: nie wieder ohne Profis. Beim sechsten Mal hatte ich kein Geld für Profis.“","Um drei kam der Cousin mit seinem Kumpel. Sie schauten das Klavier an, dann die Treppe, dann wieder das Klavier. „Hm“, sagte der Cousin.","Es dauerte eine Stunde, vier Pausen und eine kleine Schramme an der Wand im zweiten Stock. Aber dann stand das Klavier im Wohnzimmer, direkt am Fenster. Ines setzte sich hin und spielte ein paar Takte. Es war schrecklich verstimmt. Alle lachten, auch sie.","Am Abend, als alle weg waren, schrieb Ines in die Gruppe: „Danke euch so sehr. Ihr seid die Besten. Einweihungsparty in zwei Wochen, keine Kartons, versprochen!“","Moritz antwortete als Erster: „Gern geschehen. Aber nächstes Mal lese ich die Nachricht bis zum Ende.“"],"g":[["Umzugswagen","removal van"],["sich anbieten","to offer"],["eh","anyway"],["Altbau","old building"],["Aufzug","lift, elevator"],["Kumpel","mate, buddy"],["Vorsicht, Ecke!","Watch the corner!"],["umgreifen","to change one's grip"],["stecken bleiben","to get stuck"],["kippen","to tilt"],["fluchen","to swear"],["Schramme","scratch"],["Takt","bar (music)"],["verstimmt","out of tune"],["Einweihungsparty","housewarming party"],["Gern geschehen","you're welcome"]],"q":[["Warum ist Moritz vom Klavier überrascht?","Er hat die Nachricht nur bis zur Pizza gelesen.","Klassischer Fehler."],["Was ist der Plan beim Tragen?","Erst schwere Sachen, dann Kartons, Klavier zum Schluss.","Mit Verstärkung."],["Welche typischen Sätze hört man auf der Treppe?","„Vorsicht, Ecke!“, „Hast du's?“, „Nicht so schnell!“","Alltagssprache unter Druck."],["Wie werden die Helfer „bezahlt“?","Mit Pizza, Bier und einer Einweihungsparty.","Typisch für private Umzüge."],["Was ist mit dem Klavier am Ende?","Es steht am Fenster, ist aber völlig verstimmt.","Alle lachen."]],"teaser":"Ein Umzug in den vierten Stock ohne Aufzug – und warum man in Deutschland Freunde mit Pizza und Bier bezahlt.","words":394},{"id":"kollege","title":"Der neue Kollege redet nicht","level":"B2","topic":"Arbeit · Team","min":6,"p":["„Der Neue sagt ja gar nichts“, flüsterte Tanja beim Kaffee. „Seit zwei Wochen. Nicht mal ‚Mahlzeit'.“","„Vielleicht ist er schüchtern“, meinte Ole.","„Oder arrogant“, sagte Tanja. „Der sitzt da mit seinen Kopfhörern und arbeitet. Kein Small Talk, nichts.“","Der Neue hieß Viktor, kam aus der Ukraine und arbeitete als Datenanalyst. Seine Arbeit war, das musste auch Tanja zugeben, hervorragend. Er hatte in zwei Wochen einen Fehler in einer Auswertung gefunden, den das Team seit einem Jahr übersehen hatte.","Nur Nina aus dem Team sagte nichts zu den Gerüchten. Sie kannte das Gefühl. Vor fünf Jahren war sie selbst aus Polen gekommen und hatte die ersten Monate kaum gesprochen, nicht aus Arroganz, sondern weil sie Angst hatte, Fehler zu machen.","Am Donnerstag setzte sie sich in der Kantine einfach zu ihm. „Ist hier frei?“","Viktor nahm die Kopfhörer ab und nickte. „Ja. Bitte.“","Eine Weile aßen sie schweigend. Dann fragte Nina, auf Deutsch, langsam: „Wie gefällt dir die Arbeit?“","„Gut. Sehr gut.“ Er zögerte. „Aber die Besprechungen … sind schwer. Alle sprechen schnell. Und mit Witzen. Ich verstehe die Witze nicht.“","„Ich auch nicht, am Anfang“, sagte Nina. „Ole macht immer Witze über Fußball. Die versteht niemand. Auch die Deutschen nicht.“","Viktor lachte zum ersten Mal. „Wirklich?“","„Wirklich. Darf ich dir einen Tipp geben? Hier sagt man in der Mittagspause ‚Mahlzeit'. Zu allen. Auch zu Leuten, die man nicht kennt. Das ist so ein Ritual.“","„Mahlzeit“, wiederholte er. „Wie ‚Guten Appetit'?“","„So ähnlich. Aber man sagt es auch auf dem Flur, um zwölf. Auch wenn keiner isst.“","„Das ist seltsam.“","„Total seltsam. Aber wenn du's sagst, finden dich alle sofort sympathisch.“","Am nächsten Tag, um 12:03 Uhr, ging Viktor an Tanjas Schreibtisch vorbei und sagte, ein bisschen zu laut: „Mahlzeit!“ Tanja schaute überrascht auf. „Mahlzeit!“, sagte sie, und dann, nach einer kleinen Pause: „Gehst du mit in die Kantine? Heute gibt's Maultaschen.“","Er ging mit. In der folgenden Woche erzählte er beim Essen von seiner Heimatstadt Lwiw, von seiner Familie und davon, wie schwer es ist, in einer neuen Sprache witzig zu sein. „Auf Ukrainisch bin ich sehr lustig“, sagte er. „Auf Deutsch bin ich nur … korrekt.“","Tanja lachte. „Das kommt“, sagte sie. „Und ehrlich gesagt: Korrekt ist schon mal eine gute Basis. Bei Ole warten wir seit zehn Jahren auf einen guten Witz.“","Später sagte Tanja zu Nina: „Ich hab mich getäuscht. Der ist überhaupt nicht arrogant.“","„Ich weiß“, sagte Nina. „Man muss sich nur mal dazusetzen.“"],"g":[["flüstern","to whisper"],["Mahlzeit","(office greeting at lunchtime)"],["schüchtern","shy"],["zugeben","to admit"],["Auswertung","analysis, evaluation"],["übersehen","to overlook"],["Gerücht","rumour"],["Ist hier frei?","Is this seat free?"],["Besprechung","meeting"],["Darf ich dir einen Tipp geben?","May I give you a tip?"],["seltsam","strange"],["sympathisch","likeable"],["sich täuschen","to be mistaken"],["sich dazusetzen","to join someone (at a table)"]],"q":[["Warum hält Tanja Viktor für arrogant?","Er spricht kaum, trägt Kopfhörer und macht keinen Small Talk.","Ein Missverständnis."],["Warum versteht Nina ihn?","Sie hat selbst als Neue aus Angst vor Fehlern kaum gesprochen.","Eigene Erfahrung."],["Was fällt Viktor schwer?","Schnelle Gespräche und Witze in Besprechungen.","Nicht die Arbeit selbst."],["Was ist „Mahlzeit“?","Ein Gruß in der Mittagszeit, auch ohne zu essen.","Ein soziales Ritual."],["Was ist Ninas Lehre?","Man muss sich einfach dazusetzen.","Kontakt statt Gerüchte."]],"teaser":"Ein schweigsamer Neuer, ein ungeduldiges Team und eine Mittagspause, die alles ändert.","words":408},{"id":"friseur","title":"Nur die Spitzen","level":"B2","topic":"Alltag · Kommunikation","min":5,"p":["„Was machen wir denn heute?“, fragte die Friseurin und schaute Mariana durch den Spiegel an.","„Nur die Spitzen schneiden, bitte. Ein bisschen kürzer.“","„Wie viel ist ein bisschen? Zwei Zentimeter? Fünf?“","Mariana überlegte. Auf Portugiesisch hätte sie das genau beschreiben können. Auf Deutsch hatte sie sich nur „Spitzen“ und „ein bisschen“ gemerkt. „Zwei. Höchstens drei.“","„Okay. Und Stufen? Pony?“","„Stufen?“","Die Friseurin zeigte mit den Händen: „Dass die Haare vorne kürzer sind und hinten länger. Oder alles gleich lang?“","„Ah! Nein, alles gleich lang. Keine Stufen. Und keinen Pony.“","„Alles klar.“ Sie fing an zu schneiden und gleichzeitig zu reden. Über das Wetter, über ihren Urlaub in Kroatien, über ihre Katze, die neuerdings nur noch auf dem Wäschekorb schlief. Mariana verstand ungefähr siebzig Prozent und sagte an den richtigen Stellen „Ach so“, „Echt?“ und „Das ist ja lustig“.","Dann sagte die Friseurin etwas, das Mariana nicht verstand, aber das wie eine Frage klang. „Ja, gern“, sagte Mariana, weil das meistens funktionierte.","Die Friseurin nahm eine andere Schere. Das Schneiden klang plötzlich anders.","Zehn Minuten später schaute Mariana in den Spiegel. Ihre Haare waren kürzer. Nicht zwei Zentimeter kürzer. Eher acht. Und vorne hatte sie, ganz eindeutig, einen Pony.","„Gefällt's Ihnen?“, fragte die Friseurin strahlend.","Mariana starrte in den Spiegel. „Ich … was haben Sie vorhin gefragt? Bevor Sie die andere Schere genommen haben?“","„Ob wir nicht doch einen kleinen Pony probieren wollen. Weil der Ihnen bestimmt super steht. Und Sie haben ja gesagt.“","Es gab einen langen Moment der Stille. Dann fing Mariana an zu lachen. „Ich habe ‚Ja, gern' gesagt, weil ich nichts verstanden habe.“","Die Friseurin schlug sich die Hand vor den Mund. „Oh nein! Das tut mir so leid! Ich hätte nachfragen sollen.“","„Nein, nein. Ich hätte nachfragen sollen.“ Mariana schaute noch einmal in den Spiegel. „Und wissen Sie was? Es sieht eigentlich gut aus.“","Die Friseurin berechnete nur die Hälfte. Mariana gab trotzdem Trinkgeld. Auf dem Heimweg schrieb sie sich einen neuen Satz in ihr Notizbuch: „Entschuldigung, das habe ich nicht verstanden. Können Sie das bitte wiederholen?“ Und darunter, unterstrichen: „Nie wieder einfach ‚Ja' sagen.“"],"g":[["die Spitzen schneiden","to trim the ends"],["höchstens","at most"],["Stufen","layers (hair)"],["Pony","fringe, bangs"],["neuerdings","lately"],["Wäschekorb","laundry basket"],["Ach so","oh, I see"],["Echt?","Really?"],["Schere","scissors"],["strahlend","beaming"],["Das steht Ihnen","that suits you"],["sich die Hand vor den Mund schlagen","to clap one's hand over one's mouth"],["nachfragen","to ask again, check"],["berechnen","to charge"],["Trinkgeld","tip"]],"q":[["Was wollte Mariana?","Nur die Spitzen, zwei bis drei Zentimeter, keine Stufen, kein Pony.","Klare Wünsche."],["Wie reagiert sie auf Small Talk?","Mit „Ach so“, „Echt?“ und „Das ist ja lustig“.","Typische Hörersignale."],["Warum hat sie am Ende einen Pony?","Sie hat „Ja, gern“ gesagt, ohne die Frage zu verstehen.","Missverständnis."],["Wie reagieren beide?","Beide lachen und übernehmen Verantwortung; die Friseurin berechnet die Hälfte.","Freundliche Lösung."],["Welchen Satz lernt Mariana?","„Entschuldigung, das habe ich nicht verstanden. Können Sie das bitte wiederholen?“","Nie wieder einfach Ja sagen."]],"teaser":"Wie ein Friseurbesuch zur Sprachprüfung wird – und warum „nur ein bisschen“ ein gefährlicher Satz ist.","words":349},{"id":"fussball","title":"Kreisliga, Sonntag, 15 Uhr","level":"B2","topic":"Sport · Verein","min":6,"p":["„Kannst du kicken?“, fragte der Mann am Spielfeldrand. Er trug eine Trainingsjacke, die älter aussah als Jamal selbst.","„Ein bisschen“, sagte Jamal. „Früher, in der Schule.“","„Reicht. Uns fehlen zwei Leute für Sonntag. Training ist Dienstag und Donnerstag um sieben. Ich bin der Heinz.“","So wurde Jamal, ohne es richtig zu wollen, Spieler beim TSV Kirchheim-Ost, dritte Mannschaft, Kreisliga C. Die Mannschaft hatte in dieser Saison zwei von elf Spielen gewonnen. Beide Male, weil der Gegner nicht vollzählig angetreten war.","Das Training war anstrengender, als er gedacht hatte, vor allem sprachlich. Heinz rief ununterbrochen Kommandos über den Platz: „Hintermann!“ – „Lass laufen!“ – „Spiel ab!“ – „Mann, Mann, Mann, nicht so hektisch!“ Jamal verstand am ersten Abend die Hälfte und spielte deshalb meistens in die falsche Richtung.","Nach dem Training saßen alle im Vereinsheim. Es gab Bier, Apfelschorle und Würstchen, die eine ältere Frau namens Gisela seit dreißig Jahren jeden Dienstag und Donnerstag grillte. Die Mannschaft bestand aus einem Bäcker, zwei Studenten, einem Polizisten, einem Rentner, der behauptete, vierundfünfzig zu sein, und mehreren Männern, deren Berufe Jamal nie herausfand.","„Was heißt eigentlich ‚Hintermann'?“, fragte er den Bäcker, der Mehmet hieß.","„Das heißt: Pass auf, hinter dir ist einer! Und ‚Lass laufen' heißt: Lass den Ball durch, ein anderer nimmt ihn. Und ‚Mann, Mann, Mann' heißt: Heinz ist sauer.“","Am Sonntag stand Jamal zum ersten Mal in der Startelf. Gegner war der SV Ötlingen, Tabellenzweiter. Nach zwanzig Minuten stand es 0:2. Nach der Halbzeit 0:3. Heinz sagte in der Kabine nichts, sondern schaute nur alle der Reihe nach an und seufzte.","In der 78. Minute bekam Jamal den Ball am Strafraum. Er hörte Mehmet rufen: „Zieh ab!“ Er wusste nicht genau, was das hieß, aber es klang dringend. Er schoss. Der Ball flog am Torwart vorbei, prallte an den Pfosten und ging rein.","Es stand 1:3. Die Mannschaft jubelte, als hätten sie die Meisterschaft gewonnen. Mehmet sprang ihm auf den Rücken. Der Rentner weinte fast. Heinz rief vom Rand: „Siehst du! Geht doch!“","Sie verloren 1:4. Im Vereinsheim feierten sie trotzdem. Gisela gab Jamal eine extra Wurst. „Für das Tor“, sagte sie. „Das erste seit Oktober.“","Auf dem Heimweg fragte Jamal Mehmet: „Was heißt eigentlich ‚Zieh ab'?“","Mehmet lachte. „Schieß! Einfach schießen.“","„Ah. Gut, dass ich's nicht wusste. Sonst hätte ich nachgedacht.“","In den nächsten Monaten lernte Jamal mehr Deutsch auf dem Fußballplatz als in jedem Kurs. Kommandos, Flüche, Witze und, im Vereinsheim, schwäbische Sätze, die niemand übersetzen wollte. Die dritte Mannschaft gewann in dieser Saison noch zwei Spiele. Für die Kreisliga C war das ein Rekord."],"g":[["kicken","to play football (colloquial)"],["Spielfeldrand","sideline"],["Mannschaft","team"],["vollzählig","complete, at full strength"],["Hintermann!","man behind you!"],["Lass laufen!","let it run!"],["Spiel ab!","pass the ball!"],["hektisch","hectic"],["Vereinsheim","clubhouse"],["Startelf","starting eleven"],["Tabellenzweiter","second in the table"],["Kabine","changing room"],["der Reihe nach","one after another"],["Strafraum","penalty area"],["Zieh ab!","shoot!"],["Pfosten","post"],["Geht doch!","there you go!"],["Fluch","swear word"]],"q":[["Wie wird Jamal Spieler?","Heinz fragt ihn spontan, weil zwei Spieler fehlen.","Ohne es richtig zu wollen."],["Warum ist das Training sprachlich schwer?","Heinz ruft viele Kommandos, die Jamal nicht kennt.","Er spielt oft in die falsche Richtung."],["Was bedeuten „Hintermann“ und „Lass laufen“?","Pass auf, hinter dir ist einer; lass den Ball durch.","Mehmet erklärt."],["Warum ist das Tor so besonders?","Es ist das erste seit Oktober.","Auch bei der Niederlage."],["Wo lernt Jamal am meisten Deutsch?","Auf dem Fußballplatz und im Vereinsheim.","Mehr als in jedem Kurs."]],"teaser":"Ein Fußballverein im Dorf, eine Mannschaft, die fast nie gewinnt, und ein Neuer, der mehr als ein Tor schießt.","words":426},{"id":"reklamation","title":"Die Waschmaschine piept","level":"B2","topic":"Verbraucher · Telefon","min":5,"p":["Die Waschmaschine piepte. Dreimal kurz, einmal lang, dann blinkte ein kleines rotes Licht. Im Display stand: „F21“. Im Wasser darin schwammen Elifs Jeans.","Sie schaute in die Bedienungsanleitung. „F21: Bitte wenden Sie sich an den Kundendienst.“ Sehr hilfreich.","Die Maschine war vierzehn Monate alt. Elif rief beim Händler an, bei dem sie sie gekauft hatte.","„Elektro Maier, guten Tag.“","„Guten Tag, ich habe bei Ihnen vor vierzehn Monaten eine Waschmaschine gekauft. Sie zeigt den Fehler F21 und funktioniert nicht mehr.“","„Oh, das tut mir leid. Aber die Herstellergarantie ist ein Jahr. Da müssten Sie sich direkt an den Hersteller wenden. Oder wir schicken einen Techniker, das kostet aber.“","Elif hatte sich vorbereitet. Ihre Freundin, eine Juristin, hatte ihr am Telefon einen Satz diktiert, den sie jetzt ablas: „Ich möchte die gesetzliche Gewährleistung in Anspruch nehmen. Die gilt zwei Jahre und richtet sich gegen den Verkäufer.“","Am anderen Ende entstand eine kurze Pause. „Ah. Ja. Das stimmt natürlich.“ Die Stimme klang jetzt anders, professioneller. „Haben Sie den Kaufbeleg?“","„Ja, ich kann ihn per E-Mail schicken.“","„Gut. Dann schicken Sie uns den bitte, und wir vereinbaren einen Termin mit unserem Techniker. Für Sie kostenlos.“","„Wann könnte der kommen?“","„Nächsten Dienstag zwischen acht und zwölf.“","Elif seufzte innerlich. Ein halber Tag Urlaub für ein Zeitfenster. „Gibt's auch was Genaueres?“","„Leider nicht. Aber er ruft eine halbe Stunde vorher an.“","Am Dienstag rief der Techniker um 11:40 Uhr an und war um 11:55 Uhr da. Er brauchte genau sieben Minuten. „Pumpe verstopft“, sagte er und zog ein kleines Stück Plastik heraus. „Haarklammer. Die war in einer Hosentasche.“","Elif wurde rot. „Heißt das, es war meine Schuld?“","Der Techniker zuckte mit den Schultern. „Eigentlich ja. Aber das schreib ich jetzt nicht auf. Die Pumpe ist ein bisschen beschädigt, die tausch ich gleich aus. Gewährleistung.“ Er zwinkerte.","Als er weg war, wusch Elif ihre Jeans endlich fertig. Vorher kontrollierte sie alle Taschen. Zweimal. Und sie schrieb sich den Satz ihrer Freundin in ihr Notizbuch, gleich unter „Ich hätte gern einen Termin“: „Ich möchte die gesetzliche Gewährleistung in Anspruch nehmen.“"],"g":[["piepen","to beep"],["blinken","to flash"],["Bedienungsanleitung","user manual"],["sich wenden an","to contact"],["Kundendienst","customer service"],["Herstellergarantie","manufacturer's guarantee"],["Gewährleistung","statutory warranty"],["in Anspruch nehmen","to make use of, claim"],["Kaufbeleg","receipt"],["Zeitfenster","time slot"],["verstopft","blocked"],["Haarklammer","hair clip"],["austauschen","to replace"],["zwinkern","to wink"]],"q":[["Was ist das Problem?","Die Waschmaschine zeigt F21 und funktioniert nicht.","Vierzehn Monate alt."],["Was sagt der Händler zuerst?","Die Garantie ist abgelaufen; sie solle sich an den Hersteller wenden oder zahlen.","Eine typische erste Reaktion."],["Welcher Satz verändert das Gespräch?","„Ich möchte die gesetzliche Gewährleistung in Anspruch nehmen.“","Sie gilt zwei Jahre gegen den Verkäufer."],["Was war die Ursache?","Eine Haarklammer aus einer Hosentasche hat die Pumpe verstopft.","Eigentlich ihre Schuld."],["Wie reagiert der Techniker?","Er tauscht die Pumpe trotzdem kostenlos aus.","Kulanz mit Augenzwinkern."]],"teaser":"Eine kaputte Waschmaschine, eine Hotline und die Kraft des Wortes „Gewährleistung“.","words":343},{"id":"spaetzle","title":"Opa Kurts Spätzle","level":"B2","topic":"Essen · Familie","min":6,"p":["„Wie viel Mehl?“, fragte Lena und hielt den Stift bereit.","„Halt so viel, wie's braucht“, sagte Opa Kurt.","„Opa, das kann ich nicht aufschreiben.“","„Brauchst du auch nicht. Musst du sehen.“","Lena seufzte. Sie war achtundzwanzig, wohnte in Hamburg und hatte sich vorgenommen, endlich das Spätzlerezept ihres Großvaters zu lernen, bevor es zu spät war. Opa Kurt war einundneunzig, sah aber nicht so aus, als hätte er vor, irgendwann aufzuhören.","Er nahm eine große Schüssel und schüttete Mehl hinein. Nicht abgewogen, einfach aus der Tüte. „Ungefähr fünfhundert Gramm“, sagte er. „Für vier Leut.“","Lena wog es heimlich nach, als er sich umdrehte. Es waren 520 Gramm. Nicht schlecht.","„Jetzt Eier. Pro Person eins, und eins für die Schüssel.“","„Was heißt ‚eins für die Schüssel'?“","„Das heißt, eins mehr. Immer eins mehr. Das hat meine Mutter schon gesagt.“","Er schlug fünf Eier in die Schüssel, gab Salz dazu, „eine gute Prise“, und dann Wasser, „nicht zu viel, nicht zu wenig“. Lena gab es auf, mitzuschreiben, und filmte stattdessen mit dem Handy.","Dann kam der wichtigste Teil. Opa Kurt nahm einen Holzlöffel und schlug den Teig. Nicht rühren, schlagen. Kräftig, mit einer Kraft, die man ihm nicht zugetraut hätte. „Der Teig muss Blasen werfen“, sagte er. „Wenn er Blasen wirft, ist er fertig. Vorher nicht.“","Nach fünf Minuten warf der Teig Blasen. Lena durfte weitermachen. Nach einer Minute taten ihr die Arme weh. „Wie machst du das, Opa?“","„Übung. Siebzig Jahre.“","Dann das Schaben. Opa Kurt benutzte keine Spätzlepresse, sondern ein altes Holzbrett und ein Messer. Er strich den Teig auf das nasse Brett und schabte mit schnellen Bewegungen dünne Streifen direkt ins kochende Salzwasser. Es sah einfach aus. Bei Lena landete der erste Versuch als ein einziger großer Klumpen im Topf.","„Macht nix“, sagte Opa Kurt. „Den essen wir trotzdem. Den Klumpen kriegt der Koch.“","Beim dritten Brett ging es besser. Beim fünften sahen Lenas Spätzle aus wie Spätzle, nur ein bisschen dicker. Opa Kurt nahm einen aus dem Wasser, probierte ihn und nickte langsam. „Gut“, sagte er. „Nicht so gut wie meine. Aber gut.“","Sie aßen zu viert, mit Lenas Eltern, Spätzle mit Linsen und Saitenwürstchen, wie es in der Familie am Sonntag immer gewesen war. Der Klumpen lag auf Lenas Teller. Er schmeckte großartig.","Zurück in Hamburg versuchte Lena es allein. Beim ersten Mal war der Teig zu flüssig. Beim zweiten Mal zu fest. Beim dritten Mal warf er Blasen. Sie schickte ihrem Opa ein Foto. Er antwortete mit einer Sprachnachricht, die er von seinem Nachbarn hatte aufnehmen lassen: „Siehst du. Musst halt sehen. Ned schreiben.“"],"g":[["nach Gefühl","by feel"],["Mehl","flour"],["abwiegen","to weigh"],["Leut","(dialect) Leute, people"],["nachwiegen","to weigh again"],["eine Prise","a pinch"],["es aufgeben","to give up"],["schlagen","to beat"],["zutrauen","to believe someone capable of"],["Blasen werfen","to form bubbles"],["schaben","to scrape"],["Spätzlepresse","spätzle press"],["Klumpen","lump"],["Macht nix","never mind"],["Saitenwürstchen","(Swabian) frankfurter sausages"],["Ned","(dialect) nicht"]],"q":[["Warum kann Lena das Rezept nicht aufschreiben?","Opa Kurt kocht nach Gefühl, ohne genaue Mengen.","„Musst du sehen.“"],["Was bedeutet „eins für die Schüssel“?","Immer ein Ei mehr als Personen.","Familienregel seit Generationen."],["Woran erkennt man, dass der Teig fertig ist?","Er wirft Blasen.","Durch kräftiges Schlagen."],["Was passiert mit Lenas erstem Versuch?","Er wird ein großer Klumpen – „den kriegt der Koch“.","Fehler gehören dazu."],["Was ist die Botschaft am Ende?","Manche Dinge lernt man durch Sehen und Üben, nicht durch Aufschreiben.","„Ned schreiben.“"]],"teaser":"Ein Rezept, das nie aufgeschrieben wurde, ein Großvater, der „nach Gefühl“ kocht, und eine Enkelin, die es trotzdem lernt.","words":427},{"id":"zahnarzt","title":"Bitte weit öffnen","level":"B2","topic":"Gesundheit · Humor","min":5,"p":["„So, dann machen wir mal schön weit auf“, sagte Dr. Hartmann und beugte sich mit Lampe und Spiegel über Kenji.","Kenji machte weit auf. Sofort begann Dr. Hartmann zu reden. „Und, wie gefällt's Ihnen in Stuttgart? Schon den Fernsehturm gesehen?“","„Aaah“, sagte Kenji.","„Und das Wetter? Ganz anders als in Japan, oder?“","„Hmmm-hmm.“","Kenji hatte gehört, dass Zahnärzte überall auf der Welt Fragen stellen, wenn man nicht antworten kann. Er hatte nicht gewusst, dass es auch auf Deutsch so ist.","„Oh“, sagte Dr. Hartmann plötzlich. „Da haben wir was. Unten links, der Sechser. Ein kleines Loch. Nicht schlimm, aber das sollten wir machen.“","Er nahm die Instrumente heraus. Kenji fragte: „Heute?“","„Können wir gleich machen, wenn Sie Zeit haben. Dauert zwanzig Minuten. Wollen Sie eine Spritze?“","„Tut es ohne weh?“","Der Zahnarzt lächelte. „Kommt drauf an, wie tapfer Sie sind.“","„Dann bitte mit Spritze.“","„Gute Entscheidung.“","Nach der Spritze fühlte sich Kenjis halbes Gesicht an, als würde es jemand anderem gehören. Die Zahnarzthelferin erklärte ihm, dass er in den nächsten zwei Stunden nichts essen und nichts Heißes trinken dürfe. „Sonst beißen Sie sich auf die Lippe und merken es nicht.“","Dann wurde gebohrt. Kenji schloss die Augen. Dr. Hartmann redete weiter, diesmal mit der Helferin, über ihr Wochenende, über einen Handwerker, der nicht kam, und über eine Serie, die beide schauten. Kenji hörte zu und merkte, dass er fast alles verstand. Vielleicht, dachte er, weil er nicht antworten musste.","„So, fertig“, sagte Dr. Hartmann nach achtzehn Minuten. „Kunststofffüllung, hält zehn Jahre, wenn Sie brav Zahnseide benutzen. Benutzen Sie Zahnseide?“","Kenji zögerte. „Manchmal.“","„Manchmal heißt nie“, sagte der Zahnarzt freundlich. „Ab jetzt jeden Abend. Und in einem halben Jahr sehen wir uns zur Kontrolle.“","An der Rezeption fragte die Dame: „Sind Sie gesetzlich versichert?“","„Ja.“","„Dann zahlen Sie für die einfache Füllung nichts extra. Die hochwertige Kunststofffüllung kostet aber eine Zuzahlung. Das hat Dr. Hartmann Ihnen erklärt?“","Kenji erinnerte sich an nichts dergleichen. Wahrscheinlich hatte Dr. Hartmann es erklärt, während Kenjis Mund weit offen stand und er „Aaah“ sagte.","„Ich glaube“, sagte Kenji mit tauber Lippe, „ich habe Ja gesagt.“","Die Rechnung kam zwei Wochen später: 68 Euro. Kenji zahlte sie und kaufte Zahnseide. Beim nächsten Termin, sechs Monate später, fragte Dr. Hartmann: „Und, Zahnseide jeden Abend?“ Kenji hielt stolz den Daumen hoch, weil er den Mund schon offen hatte."],"g":[["weit aufmachen","to open wide"],["sich beugen über","to lean over"],["Fernsehturm","TV tower"],["Loch","hole, cavity"],["Spritze","injection"],["Tut es weh?","Does it hurt?"],["Kommt drauf an","it depends"],["tapfer","brave"],["Zahnarzthelferin","dental assistant"],["bohren","to drill"],["Füllung","filling"],["Zahnseide","dental floss"],["Kontrolle","check-up"],["gesetzlich versichert","in statutory health insurance"],["Zuzahlung","additional payment, co-pay"],["taub","numb; deaf"],["den Daumen hochhalten","to give a thumbs up"]],"q":[["Was ist typisch beim Zahnarzt?","Er stellt Fragen, wenn man nicht antworten kann.","Weltweit, auch auf Deutsch."],["Was hat Kenji?","Ein kleines Loch unten links im Sechser.","Es wird sofort behandelt."],["Was darf man nach der Spritze nicht?","Zwei Stunden nichts essen oder Heißes trinken.","Man könnte sich auf die Lippe beißen."],["Was bedeutet „Manchmal heißt nie“?","Der Zahnarzt glaubt nicht, dass Kenji regelmäßig Zahnseide benutzt.","Freundliche Kritik."],["Warum muss Kenji 68 Euro zahlen?","Für die hochwertige Füllung gibt es eine Zuzahlung, die er nicht verstanden hatte.","Er hatte mit offenem Mund zugestimmt."]],"teaser":"Ein Zahnarztbesuch, bei dem man nicht sprechen kann – und trotzdem viel Deutsch lernt.","words":389},{"id":"bank","title":"Ein Konto eröffnen","level":"B2","topic":"Bank · Behörden","min":4,"p":["„Guten Tag, ich möchte ein Girokonto eröffnen“, sagte Rahul am Schalter.","„Gern. Haben Sie Ihren Pass und eine Meldebescheinigung dabei?“","„Meinen Pass ja. Die Meldebescheinigung … noch nicht. Ich habe erst nächste Woche einen Termin beim Bürgeramt.“","Die Bankberaterin, Frau Seitz, lächelte entschuldigend. „Dann wird's schwierig. Ohne Meldeadresse dürfen wir leider kein Konto eröffnen.“","„Aber mein Arbeitgeber will mein Gehalt am Monatsende überweisen. Und mein Vermieter will die Kaution auf ein deutsches Konto.“","„Ich verstehe. Das ist ein bisschen wie Henne und Ei, oder?“","Rahul kannte den Ausdruck nicht, verstand ihn aber sofort. „Genau. Was soll ich machen?“","Frau Seitz überlegte. „Haben Sie Ihren Mietvertrag dabei?“","„Ja, hier.“","„Dann können wir den Antrag schon vorbereiten. Sobald Sie die Meldebescheinigung haben, schicken Sie sie per E-Mail, und ich schalte das Konto am selben Tag frei. Ihr Gehalt kommt dann rechtzeitig.“","„Das geht?“","„Das geht. Wir sind nicht so bürokratisch, wie alle denken.“ Sie zwinkerte. „Nur ein bisschen.“","Eine Woche später war Rahul beim Bürgeramt, nach vierzig Minuten Wartezeit und einem Formular, das „Wohnungsgeberbestätigung“ hieß. Am Nachmittag schickte er die Bescheinigung an Frau Seitz. Am Abend kam eine E-Mail: „Ihr Konto ist freigeschaltet. Willkommen bei uns! Ihre Karte kommt in fünf bis sieben Werktagen per Post. Die PIN kommt separat.“","„Warum separat?“, fragte er seine Kollegin am nächsten Tag.","„Sicherheit“, sagte sie. „Und damit du zweimal zum Briefkasten rennst. Typisch deutsch.“"],"g":[["Girokonto","current account"],["Schalter","counter"],["Meldebescheinigung","proof of registration"],["Bürgeramt","citizens' office"],["überweisen","to transfer"],["Kaution","deposit"],["Henne und Ei","chicken and egg"],["Antrag","application"],["freischalten","to activate"],["Wohnungsgeberbestätigung","landlord's confirmation of residence"],["Werktag","working day"],["separat","separately"]],"q":[["Warum kann Rahul zuerst kein Konto eröffnen?","Ihm fehlt die Meldebescheinigung.","Ohne Meldeadresse kein Konto."],["Was bedeutet „Henne und Ei“?","Ein Problem, bei dem jedes Teil das andere voraussetzt.","Konto braucht Adresse, Wohnung braucht Konto."],["Wie hilft Frau Seitz?","Sie bereitet den Antrag vor und schaltet das Konto frei, sobald die Bescheinigung kommt.","Flexible Lösung."],["Warum kommen Karte und PIN getrennt?","Aus Sicherheitsgründen.","„Typisch deutsch.“"]],"teaser":"Ohne Konto kein Gehalt, ohne Adresse kein Konto – ein klassischer deutscher Kreis.","words":229},{"id":"bus","title":"Der Busfahrer und die Münzen","level":"B2","topic":"Verkehr · Alltag","min":3,"p":["Tomasz stieg in den Bus und hielt dem Fahrer einen Zwanzigeuroschein hin. „Einmal Einzelfahrschein, bitte.“","Der Fahrer schaute auf den Schein, dann auf Tomasz. „Hen Se's ned kleiner?“","„Entschuldigung?“","„Haben Sie es nicht kleiner?“, wiederholte der Fahrer langsam, auf Hochdeutsch.","Tomasz durchsuchte seine Taschen und fand eine Handvoll Münzen. Er zählte: zwei Euro, fünfzig Cent, zwanzig, zehn, zehn, fünf, zwei, zwei, eins, eins. „Drei Euro und eins …“","„Drei Euro zehn kostet's“, sagte der Fahrer.","Hinter Tomasz bildete sich eine Schlange. Jemand seufzte laut. Tomasz zählte weiter, ließ eine Münze fallen, hob sie auf, zählte noch einmal. Endlich lag die Summe auf dem kleinen Teller. Der Fahrer schob ihm das Ticket hin, ohne die Münzen nachzuzählen.","„Wollen Sie nicht nachzählen?“, fragte Tomasz.","„Noi. Wenn's ned stimmt, merk ich's heut Abend. Und dann such ich Sie.“ Er grinste.","Tomasz lachte und ging nach hinten. Eine ältere Frau neben ihm beugte sich herüber. „Kaufen Sie sich das Deutschlandticket, junger Mann. Dann müssen Sie nie wieder zählen. Und der Busfahrer ist auch froh.“","„Lohnt sich das?“","„Wenn Sie öfter als zweimal die Woche fahren, ja. Ich hab's seit dem ersten Tag.“","Am nächsten Tag lud Tomasz die App herunter. Als er in den Bus stieg, zeigte er nur das Handy. Der Fahrer, derselbe wie gestern, nickte. „Na also. Geht doch.“"],"g":[["Einzelfahrschein","single ticket"],["Hen Se's ned kleiner?","(Swabian) Haven't you got anything smaller?"],["Münze","coin"],["Kleingeld","change"],["Schlange","queue"],["fallen lassen","to drop"],["nachzählen","to count again"],["Noi","(Swabian) no"],["sich lohnen","to be worth it"],["Na also. Geht doch.","There you go."]],"q":[["Warum möchte der Fahrer keinen Zwanziger?","Er hat nicht genug Wechselgeld; er fragt nach Kleinerem.","Auf Schwäbisch."],["Warum zählt der Fahrer nicht nach?","Er vertraut Tomasz und scherzt, dass er ihn sonst sucht.","Humor."],["Was empfiehlt die ältere Frau?","Das Deutschlandticket.","Lohnt sich ab mehr als zwei Fahrten pro Woche."],["Was sagt der Fahrer am Ende?","„Na also. Geht doch.“","Anerkennung."]],"teaser":"Eine Fahrkarte, zu viel Kleingeld und ein Busfahrer mit sehr schwäbischer Geduld.","words":217},{"id":"nachbarin","title":"Frau Wolf und der Lärm","level":"B2","topic":"Nachbarn · Konflikt","min":4,"p":["Es klingelte um 22:05 Uhr. Draußen stand Frau Wolf aus der Wohnung darunter, im Bademantel, mit verschränkten Armen.","„Guten Abend. Es ist nach zehn.“","„Ja?“, sagte Daniel, der gerade mit zwei Freunden ein Fußballspiel schaute.","„Nachtruhe. Ab zehn. Steht in der Hausordnung. Ich muss um fünf aufstehen.“","Daniel spürte, wie Ärger in ihm hochstieg. Fünf Minuten nach zehn! Aber er erinnerte sich an etwas, das ihm sein Kollege geraten hatte: Bei Nachbarn nie sofort verteidigen. Erst zuhören.","„Oh, das tut mir leid. Ist es sehr laut bei Ihnen?“","Frau Wolf schien überrascht. Sie hatte offenbar mit Streit gerechnet. „Na ja … der Fernseher nicht so. Aber wenn Sie jubeln, dann wackelt bei mir die Lampe.“","Daniel musste lachen. „Ehrlich? Das wusste ich nicht. Dann jubeln wir ab jetzt leise. Versprochen.“","„Leise jubeln?“, fragte Frau Wolf skeptisch.","„Wir versuchen es.“","Zum ersten Mal lächelte sie ein bisschen. „Was spielt denn?“","„Stuttgart gegen Bayern.“","„Oh.“ Sie zögerte. „Wie steht's?“","„Eins zu eins. Noch zehn Minuten.“","Frau Wolf schaute an Daniel vorbei auf den Bildschirm. Dann sagte sie: „Na gut. Aber nur bis zum Abpfiff. Und wenn Stuttgart gewinnt, dürfen Sie einmal laut sein. Einmal.“","Stuttgart gewann in der neunzigsten Minute. Die drei jubelten einmal laut und dann sehr, sehr leise. Am nächsten Morgen lag vor Daniels Tür ein Zettel: „Glückwunsch zum Sieg. Die Lampe hat nur ein bisschen gewackelt. Gruß, E. Wolf“."],"g":[["Bademantel","bathrobe"],["verschränkte Arme","folded arms"],["Nachtruhe","quiet hours at night"],["Hausordnung","house rules"],["Ärger stieg in ihm hoch","anger rose in him"],["sich verteidigen","to defend oneself"],["rechnen mit","to expect"],["jubeln","to cheer"],["wackeln","to wobble, shake"],["Wie steht's?","What's the score?"],["Abpfiff","final whistle"],["Glückwunsch","congratulations"]],"q":[["Warum klingelt Frau Wolf?","Es ist nach 22 Uhr, und beim Jubeln wackelt ihre Lampe.","Nachtruhe laut Hausordnung."],["Wie reagiert Daniel klug?","Er hört zuerst zu, statt sich zu verteidigen.","Rat seines Kollegen."],["Welchen Kompromiss schlägt Frau Wolf vor?","Bis zum Abpfiff, und bei einem Sieg einmal laut jubeln.","Humorvolle Einigung."],["Was zeigt der Zettel?","Die Beziehung ist freundlich geworden.","Konflikt gut gelöst."]],"teaser":"Ein Klingeln um 22:05 Uhr, eine verärgerte Nachbarin und ein Gespräch, das besser endet als befürchtet.","words":230},{"id":"kino","title":"Original mit Untertiteln","level":"B2","topic":"Freizeit · Kultur","min":4,"p":["„Wir gehen doch in die OmU-Vorstellung, oder?“, fragte Clara.","„Was ist OmU?“, fragte Fatima.","„Original mit Untertiteln. Der Film ist auf Englisch, mit deutschen Untertiteln.“","„Ach, ich dachte, wir gehen in die deutsche Version. Ich will doch Deutsch üben.“","Clara verdrehte die Augen. „Synchronisierte Filme sind furchtbar. Die Stimmen passen nie. Und die Lippen bewegen sich falsch.“","„Für dich vielleicht. Für mich ist das perfekt: Ich kenne die Geschichte schon auf Englisch, und jetzt höre ich Deutsch.“","Sie stritten noch zehn Minuten im Café, ganz freundlich, wie man über Kino streitet. Am Ende einigten sie sich: Diese Woche OmU, nächste Woche die deutsche Version desselben Films.","In der OmU-Vorstellung merkte Fatima etwas Seltsames. Sie las die deutschen Untertitel und hörte das Englisch, und ihr Gehirn verglich ständig. „Bloody hell“ wurde zu „Verdammt noch mal“. „I'm knackered“ wurde zu „Ich bin total fertig“. „No way!“ wurde zu „Das gibt's doch nicht!“ Sie schrieb heimlich drei Ausdrücke in ihr Handy.","In der deutschen Version, eine Woche später, verstand sie fast alles. Die Stimmen passten tatsächlich nicht ganz, da hatte Clara recht. Aber sie hörte die Ausdrücke wieder, die sie aus den Untertiteln kannte, diesmal gesprochen, mit der richtigen Betonung.","„Und?“, fragte Clara danach. „Welche Version war besser?“","Fatima dachte nach. „Beide. Zusammen.“","Seitdem schauten sie jeden Film zweimal. Clara behauptete weiter, Synchronisation sei ein Verbrechen. Aber sie ging trotzdem jedes Mal mit."],"g":[["OmU","original with subtitles"],["Untertitel","subtitles"],["synchronisiert","dubbed"],["die Augen verdrehen","to roll one's eyes"],["Stimme","voice"],["sich einigen","to agree"],["vergleichen","to compare"],["Verdammt noch mal","damn it"],["total fertig","completely exhausted"],["Das gibt's doch nicht!","No way!"],["heimlich","secretly"],["Betonung","stress, intonation"],["Verbrechen","crime"]],"q":[["Was bedeutet OmU?","Original mit Untertiteln.","Hier Englisch mit deutschen Untertiteln."],["Warum will Fatima die deutsche Version?","Um Deutsch zu üben, während sie die Geschichte kennt.","Für Clara passen die Stimmen nicht."],["Was lernt Fatima in der OmU-Vorstellung?","Umgangssprachliche Entsprechungen wie „Das gibt's doch nicht!“","Durch Vergleichen."],["Was ist ihre Antwort auf „Welche Version war besser?“","Beide zusammen.","Doppeltes Lernen."]],"teaser":"Synchronisiert oder Original? Eine Kinodebatte zwischen zwei Freundinnen und eine überraschende Entdeckung.","words":230},{"id":"apotheke","title":"Etwas gegen Husten","level":"B2","topic":"Gesundheit · Einkaufen","min":3,"p":["„Guten Tag, ich hätte gern etwas gegen Husten.“","Der Apotheker, ein Mann mit runder Brille, nickte. „Trocken oder mit Schleim?“","Ana überlegte. „Ich weiß nicht genau. Er ist … so ein Kratzen.“","„Kommt beim Husten etwas hoch?“","„Nein, eigentlich nicht.“","„Dann ist es ein trockener Reizhusten. Seit wann?“","„Seit vier Tagen. Nachts ist es schlimmer.“","„Fieber?“","„Nein.“","„Gut. Dann empfehle ich Ihnen einen Hustenstiller für die Nacht, damit Sie schlafen können. Tagsüber lieber Lutschpastillen mit Isländisch Moos, die beruhigen den Hals. Und viel trinken, warmen Tee.“","„Brauche ich ein Rezept?“","„Nein, das ist alles rezeptfrei. Aber wenn es nach einer Woche nicht besser ist oder Sie Fieber bekommen, gehen Sie bitte zum Arzt.“","Er legte zwei Packungen auf die Theke. „Zusammen vierzehn achtzig. Brauchen Sie eine Tüte?“","„Nein, danke.“","Als Ana bezahlt hatte, schob er ihr noch ein kleines Päckchen zu. „Taschentücher. Gratis. Und gute Besserung!“","Draußen las Ana die Packungsbeilage. Sie war vier Seiten lang, eng bedruckt, mit Wörtern wie „Nebenwirkungen“ und „Wechselwirkungen“. Sie verstand die Hälfte. Aber den wichtigsten Satz fand sie sofort: „Nicht mit Alkohol einnehmen.“ Damit hatte sie ohnehin nicht gerechnet."],"g":[["Husten","cough"],["Schleim","mucus"],["Kratzen","scratching"],["Reizhusten","dry irritating cough"],["Hustenstiller","cough suppressant"],["Lutschpastille","lozenge"],["Rezept","prescription"],["rezeptfrei","over the counter"],["Theke","counter"],["Tüte","bag"],["Gute Besserung!","Get well soon!"],["Packungsbeilage","package leaflet"],["Nebenwirkung","side effect"],["einnehmen","to take (medicine)"]],"q":[["Wie unterscheidet der Apotheker den Husten?","Trocken oder mit Schleim – kommt beim Husten etwas hoch?","Gezielte Fragen."],["Was empfiehlt er?","Hustenstiller für die Nacht, Lutschpastillen am Tag, viel Tee.","Alles rezeptfrei."],["Wann soll Ana zum Arzt?","Wenn es nach einer Woche nicht besser ist oder Fieber kommt.","Grenze der Selbstbehandlung."],["Was sagt man zu Kranken?","„Gute Besserung!“","Fester Ausdruck."]],"teaser":"In der Apotheke beraten werden – und den Unterschied zwischen trockenem und festsitzendem Husten lernen.","words":185},{"id":"schwimmbad","title":"Bademeister Uwe","level":"B2","topic":"Sport · Regeln","min":4,"p":["Es war der erste heiße Tag des Jahres, und das Freibad in Stuttgart-Möhringen war voll. Kwame legte sein Handtuch auf die Wiese und ging direkt zum Becken. Er sprang hinein.","Ein Pfiff. Laut, scharf. Ein Mann in roter Badehose und mit Sonnenbrille zeigte auf ihn. „Junger Mann! Erst duschen!“","Kwame stieg wieder aus. „Entschuldigung. Das wusste ich nicht.“","„Steht da“, sagte der Bademeister und zeigte auf ein Schild. „Vor dem Baden duschen. Ist Pflicht.“","Kwame duschte. Dann sprang er wieder ins Becken, diesmal ins Schwimmerbecken. Er schwamm quer, um zu seinen Freunden zu kommen.","Wieder ein Pfiff. „Nicht quer! Da wird in Bahnen geschwommen! Rechts hin, links zurück!“","Kwame schwamm an den Rand. Seine Freundin Lea lachte so sehr, dass sie Wasser schluckte. „Das ist Uwe“, sagte sie. „Der ist seit dreißig Jahren hier. Der kennt jede Regel.“","„Gibt es noch mehr?“","„Viele. Nicht rennen am Beckenrand. Nicht vom Rand springen, nur vom Sprungbrett. Keine Glasflaschen. Und nicht mit Straßenschuhen auf die Wiese.“","„Das ist ja wie ein Gesetzbuch.“","„Ja. Aber deshalb passiert hier auch fast nie was.“","Später, auf dem Weg zum Kiosk, kam Kwame an Uwe vorbei. Der Bademeister nickte ihm zu. „Na? Jetzt hast du's raus?“","„Ich glaube schon. Duschen, Bahnen, nicht rennen.“","„Sehr gut.“ Uwe nahm die Sonnenbrille ab. „Willst du ein Geheimnis wissen? Die Pommes am Kiosk sind die besten in ganz Stuttgart. Mit Mayo. Sag, Uwe schickt dich.“","Kwame tat es. Er bekam eine extra große Portion."],"g":[["Freibad","outdoor pool"],["Becken","pool"],["Pfiff","whistle"],["Bademeister","lifeguard"],["Pflicht","obligatory"],["quer","across"],["in Bahnen schwimmen","to swim in lanes"],["Beckenrand","poolside"],["Sprungbrett","diving board"],["Gesetzbuch","code of law"],["den Dreh raushaben","to have got the hang of it"],["Geheimnis","secret"],["Pommes","chips, fries"]],"q":[["Welche zwei Fehler macht Kwame?","Nicht geduscht und quer geschwommen.","Uwe pfeift beide Male."],["Welche weiteren Regeln nennt Lea?","Nicht rennen, nur vom Sprungbrett springen, kein Glas, keine Straßenschuhe auf der Wiese.","Viele ungeschriebene und geschriebene Regeln."],["Warum sind die Regeln sinnvoll?","Deshalb passiert fast nie etwas.","Sicherheit."],["Wie verändert sich Uwe am Ende?","Er wird freundlich und verrät einen Tipp für Pommes.","Strenge Schale, weicher Kern."]],"teaser":"Ein Freibad, ein strenger Bademeister und die vielen ungeschriebenen Regeln des deutschen Schwimmbads.","words":243},{"id":"geschenk","title":"Was schenkt man einer Chefin?","level":"B2","topic":"Arbeit · Höflichkeit","min":4,"p":["Die Mail kam am Montag: „Psst! Am Freitag wird unsere Chefin 50. Wir sammeln für ein Geschenk. Umschlag liegt bei Jana. Bitte nicht verraten!“","Hyun-woo las sie zweimal. „Was heißt ‚sammeln'?“, fragte er seinen Tischnachbarn Marco.","„Jeder gibt ein bisschen Geld in einen Umschlag, und davon kaufen wir was. Und jeder unterschreibt auf einer Karte.“","„Wie viel gibt man?“","Marco überlegte. „Bei Kollegen so fünf Euro. Bei der Chefin vielleicht zehn. Mehr wirkt komisch. Weniger auch.“","„Und was kauft man?“","„Das entscheidet Jana. Meistens Gutschein oder Blumen. Letztes Mal hat einer vorgeschlagen, eine Wellness-Tag zu schenken. Wurde abgelehnt. Zu persönlich.“","Hyun-woo ging zu Jana und legte zehn Euro in den Umschlag. Dann sollte er auf der Karte unterschreiben. Die Karte war schon voll mit Sprüchen: „Alles Gute zum Runden!“, „Bleib, wie du bist!“, „50 ist das neue 30!“.","Er wusste nicht, was er schreiben sollte. „Muss ich einen Spruch schreiben?“","„Nein, Name reicht“, sagte Jana. „Aber ein kurzer Satz ist nett.“","Er schrieb: „Herzlichen Glückwunsch und danke für Ihre Geduld mit meinem Deutsch! Hyun-woo“. Dann merkte er, dass alle anderen „du“ geschrieben hatten. Er war der Einzige mit „Ihre“.","„Ist das schlimm?“, fragte er Jana.","Sie lachte. „Nein. Das ist süß. Sie wird sich freuen.“","Am Freitag gab es Kuchen, Sekt und einen Blumenstrauß. Die Chefin las die Karte vor allen vor. Bei Hyun-woos Satz blieb sie stehen und lächelte. „Herr Kim, Ihre Geduld mit meinen Besprechungen ist viel größer. Und übrigens: Wir können uns gern duzen.“"],"g":[["sammeln","to collect (money)"],["verraten","to give away, reveal"],["Umschlag","envelope"],["unterschreiben","to sign"],["komisch wirken","to seem odd"],["Gutschein","voucher"],["ablehnen","to reject"],["Spruch","saying, line"],["Alles Gute","all the best"],["zum Runden","(for a) round birthday"],["Geduld","patience"],["süß","sweet, cute"],["Sekt","sparkling wine"],["sich duzen","to use \"du\" with each other"]],"q":[["Wie funktioniert das Sammeln im Büro?","Jeder gibt Geld in einen Umschlag und unterschreibt eine Karte.","Für ein gemeinsames Geschenk."],["Wie viel gibt man laut Marco?","Bei Kollegen etwa fünf, bei der Chefin etwa zehn Euro.","Mehr oder weniger wirkt komisch."],["Was ist an Hyun-woos Karte besonders?","Er siezt die Chefin als Einziger.","Die anderen duzen."],["Wie reagiert die Chefin?","Sie freut sich und bietet ihm das Du an.","Ein wichtiger sozialer Moment."]],"teaser":"Ein runder Geburtstag im Büro, eine Sammelkarte und die Frage, wie viel Geld man reinlegt.","words":247},{"id":"waschkueche","title":"Die Waschküche","level":"B2","topic":"Wohnen · Regeln","min":3,"p":["An der Kellertür hing ein Plan. „Waschküche: Mo – Erdgeschoss links, Di – Erdgeschoss rechts, Mi – 1. OG links …“ Martina wohnte im zweiten Stock rechts. Ihr Tag war Samstag.","Am Samstag um neun ging sie mit zwei Körben hinunter. Die Waschmaschine war voll. Nasse Wäsche, fertig gewaschen, offensichtlich seit gestern.","Martina stand eine Weile da. Was jetzt? Rausnehmen? Liegen lassen? In Deutschland, hatte sie gelernt, fasst man fremde Wäsche nicht an. Aber sie wollte auch waschen.","Sie ging nach oben und klingelte im ersten Stock rechts, Freitag. Ein junger Mann öffnete, verschlafen.","„Entschuldigung, dass ich störe. Ist das Ihre Wäsche in der Maschine?“","Er wurde sofort wach. „Oh nein! Die hab ich total vergessen! Sorry! Ich komm sofort!“","Er rannte in Hausschuhen in den Keller und nahm die Wäsche heraus. „Das ist mir echt peinlich. Ich hab gestern bis spät gearbeitet.“","„Kein Problem. Passiert.“","„Kann ich das irgendwie gutmachen?“","Martina überlegte. „Wissen Sie, wie der Trockner funktioniert? Ich krieg den nie an.“","Er lachte. „Der ist launisch. Man muss die Tür zweimal fest zudrücken, dann den Knopf drei Sekunden halten.“ Er zeigte es ihr. Der Trockner sprang an.","Seitdem nickten sie sich im Treppenhaus zu. Und einmal, als Martina ihre Wäsche vergessen hatte, fand sie sie ordentlich gefaltet in ihrem Korb, mit einem Zettel: „Jetzt sind wir quitt 😉“."],"g":[["Waschküche","laundry room"],["Keller","cellar"],["OG (Obergeschoss)","upper floor"],["Korb","basket"],["anfassen","to touch"],["verschlafen","sleepy"],["stören","to disturb"],["Hausschuhe","slippers"],["peinlich","embarrassing"],["gutmachen","to make up for"],["Trockner","dryer"],["launisch","moody, temperamental"],["falten","to fold"],["quitt","even, square"]],"q":[["Was regelt der Plan an der Tür?","Welche Wohnung an welchem Tag waschen darf.","Martina hat Samstag."],["Was ist das Problem?","Die Maschine ist voll mit fremder, nasser Wäsche.","Man fasst fremde Wäsche nicht gern an."],["Wie macht der Nachbar es gut?","Er zeigt ihr, wie der launische Trockner funktioniert.","Gegenseitige Hilfe."],["Was bedeutet „Jetzt sind wir quitt“?","Beide haben sich einmal geholfen; die Rechnung ist ausgeglichen.","Humorvolles Ende."]],"teaser":"Ein Waschplan an der Kellertür, eine vergessene Ladung Wäsche und eine unerwartet nette Lösung.","words":221},{"id":"bahnhof","title":"Gleisänderung","level":"B2","topic":"Reisen · Hören","min":3,"p":["„Achtung an Gleis 8. Der ICE 597 nach München Hauptbahnhof, planmäßige Abfahrt 14:51 Uhr, fährt heute von Gleis 11. Ich wiederhole: von Gleis 11.“","Olga hatte nur „ICE“, „München“ und „Gleis“ verstanden. Um sie herum setzten sich plötzlich viele Menschen in Bewegung, mit Koffern, schnell.","„Entschuldigung“, fragte sie eine Frau mit Rucksack, „was wurde gesagt?“","„Gleisänderung. Der Zug nach München fährt von Gleis elf. Kommen Sie mit, ich muss auch dahin.“","Sie liefen zusammen. „Die Durchsagen versteht doch keiner“, sagte die Frau. „Ich bin aus Hamburg und versteh nur die Hälfte. Der Lautsprecher hallt, und die reden zu schnell.“","Auf Gleis 11 stand der Zug schon. Dann kam die nächste Durchsage: „Information zum ICE 597: Heute in umgekehrter Wagenreihung. Die Wagen der ersten Klasse befinden sich im Abschnitt E bis F.“","„Was heißt umgekehrte Wagenreihung?“","„Der Zug steht andersrum. Ihr Wagen ist jetzt am anderen Ende. Welche Nummer haben Sie?“","„Wagen 25.“","„Dann müssen Sie nach vorne. Abschnitt A.“","Olga rannte. Sie fand Wagen 25 genau in dem Moment, als der Pfiff kam. Im Zug fiel sie auf ihren Platz und atmete aus.","Auf ihrem Handy notierte sie: „Gleisänderung“, „umgekehrte Wagenreihung“, „Abschnitt“, „planmäßig“. Darunter schrieb sie: „Tipp: Immer die DB-App checken. Und Leute mit Rucksack fragen.“"],"g":[["Gleis","track, platform"],["planmäßig","scheduled"],["Gleisänderung","platform change"],["sich in Bewegung setzen","to start moving"],["Durchsage","announcement"],["hallen","to echo"],["Lautsprecher","loudspeaker"],["Wagenreihung","coach order"],["umgekehrt","reversed"],["Abschnitt","section (on platform)"],["andersrum","the other way round"],["ausatmen","to breathe out"]],"q":[["Was war die erste Durchsage?","Der ICE nach München fährt von Gleis 11 statt Gleis 8.","Gleisänderung."],["Warum sind Durchsagen schwer?","Der Lautsprecher hallt, und es wird schnell gesprochen.","Auch für Deutsche."],["Was bedeutet „umgekehrte Wagenreihung“?","Der Zug steht andersherum; die Wagen sind am anderen Ende.","Olga muss nach vorne rennen."],["Welche Tipps notiert Olga?","DB-App prüfen und Menschen mit Rucksack fragen.","Praktische Strategie."]],"teaser":"Bahnhofsdurchsagen verstehen – eine der schwierigsten Hörprüfungen des deutschen Alltags.","words":206},{"id":"flohmarkt","title":"Was kostet das?","level":"B2","topic":"Einkaufen · Handeln","min":4,"p":["„Was soll die Kamera kosten?“, fragte Sofia und hielt eine alte Analogkamera hoch.","Der Verkäufer, ein Mann mit Hut, schaute sie an, als würde er ihr Budget schätzen. „Fünfzig.“","Sofia hatte gelesen, dass man auf dem Flohmarkt handelt. Sie legte die Kamera vorsichtig zurück. „Fünfzig ist ein bisschen viel. Funktioniert sie überhaupt?“","„Natürlich! Ist ein Klassiker. Siebziger Jahre.“","„Haben Sie eine Batterie zum Testen?“","Er hatte keine. „Aber die funktioniert. Ehrenwort.“","„Ohne Test kann ich nicht fünfzig zahlen. Zwanzig.“","Er lachte. „Zwanzig? Da leg ich ja drauf. Vierzig.“","„Dreißig. Und wenn sie nicht funktioniert, komme ich nächste Woche wieder.“","„Nächste Woche bin ich nicht hier.“","„Dann eben fünfundzwanzig.“","Er schaute sie lange an. Dann grinste er. „Sie sind gut. Fünfunddreißig, und ich leg den Ledergurt dazu.“","Sofia tat so, als würde sie überlegen, obwohl sie längst entschieden hatte. „Fünfunddreißig mit Gurt und dem Objektivdeckel.“","„Abgemacht.“ Er hielt ihr die Hand hin, und sie schlug ein.","Zu Hause setzte sie eine Batterie ein. Die Kamera funktionierte perfekt. Auf Internetseiten sah sie, dass solche Kameras für achtzig Euro verkauft wurden.","Am nächsten Wochenende ging sie wieder auf den Flohmarkt, diesmal ohne etwas kaufen zu wollen. Der Mann mit Hut war doch da. „Na?“, rief er. „Funktioniert sie?“","„Perfekt“, sagte Sofia.","„Hab ich doch gesagt. Ehrenwort.“ Er zwinkerte. „Und jetzt? Brauchen Sie noch Filme?“","Sie kaufte drei. Diesmal ohne zu handeln."],"g":[["Flohmarkt","flea market"],["handeln","to haggle"],["schätzen","to estimate"],["Ehrenwort","word of honour"],["drauflegen","to make a loss"],["dann eben","well then"],["Ledergurt","leather strap"],["Objektivdeckel","lens cap"],["Abgemacht","deal"],["einschlagen","to shake on it"],["einsetzen","to insert"],["zwinkern","to wink"]],"q":[["Was verlangt der Verkäufer zuerst?","Fünfzig Euro.","Sofia beginnt mit zwanzig."],["Welches Argument nutzt Sofia?","Ohne Test kann sie nicht viel zahlen.","Risiko als Verhandlungsmittel."],["Wie einigen sie sich?","Fünfunddreißig Euro mit Gurt und Objektivdeckel.","Per Handschlag."],["Warum kauft sie am Ende ohne zu handeln?","Der Verkäufer war ehrlich, die Kamera war ein gutes Geschäft.","Vertrauen entstanden."]],"teaser":"Auf dem Flohmarkt handeln lernen – mit einer alten Kamera, einem cleveren Verkäufer und einer noch cleveren Käuferin.","words":228},{"id":"hochzeit","title":"Die deutsche Hochzeit","level":"B2","topic":"Feste · Tradition","min":4,"p":["„Polterabend?“, fragte Gabriel. „Was ist das?“","Seine Kollegin Katrin lachte. „Am Abend vor der Hochzeit bringen alle Gäste altes Geschirr mit und werfen es auf den Boden. Teller, Tassen, alles. Scherben bringen Glück. Und dann muss das Brautpaar zusammen aufkehren.“","„Warum?“","„Damit sie lernen, dass sie zusammen Probleme lösen können.“","Gabriel brachte zwei alte Teller und eine Tasse mit, die er auf dem Flohmarkt gekauft hatte. Er warf sie mit großer Freude auf den Hof. Katrin und ihr Verlobter Tobias kehrten eine Stunde lang Scherben zusammen, und alle schauten zu und klatschten.","Am nächsten Tag war die Trauung im Standesamt. Sie dauerte nur zwanzig Minuten. „Das Standesamt ist das Offizielle“, flüsterte eine Kollegin. „Die große Feier kommt danach.“","Die große Feier war in einem Gasthof auf dem Land. Es gab Reden, viele Reden. Der Vater der Braut sprach zehn Minuten, der Trauzeuge fünfzehn, und eine Tante las ein Gedicht vor, das sie selbst gedichtet hatte und das sich auf „Tobias“ und „Baby, ja“ reimte. Alle lachten, besonders Katrin, die rot wurde.","Dann kam der Brautstrauß. Katrin stellte sich mit dem Rücken zu den unverheirateten Frauen und warf. Der Strauß flog zu hoch, prallte an einem Lampenschirm ab und landete direkt in Gabriels Händen.","Es gab einen Moment Stille. Dann brüllte der ganze Saal vor Lachen.","„Was bedeutet das?“, fragte Gabriel.","„Dass du als Nächster heiratest!“, rief Katrin.","„Aber ich habe keine Freundin!“","„Dann musst du dich beeilen!“","Gabriel tanzte den Rest des Abends mit dem Strauß. Um zwei Uhr nachts, beim Mitternachtsimbiss mit Würstchen, gab er ihn der Tante mit dem Gedicht. Sie war verwitwet und siebzig. „Sie haben ihn mehr verdient“, sagte er. Sie lachte so laut, dass sie sich verschluckte."],"g":[["Polterabend","party before a wedding (smashing crockery)"],["Geschirr","crockery"],["Scherben","shards"],["aufkehren","to sweep up"],["Verlobter","fiancé"],["Trauung","wedding ceremony"],["Standesamt","registry office"],["Trauzeuge","best man, witness"],["dichten","to write poetry"],["Brautstrauß","bridal bouquet"],["abprallen","to bounce off"],["brüllen","to roar"],["sich beeilen","to hurry"],["sich verschlucken","to choke"]],"q":[["Was passiert beim Polterabend?","Gäste werfen altes Geschirr; das Brautpaar kehrt zusammen auf.","Scherben bringen Glück."],["Was ist der Unterschied zwischen Standesamt und Feier?","Das Standesamt ist offiziell und kurz, danach kommt die große Feier.","Zwei Teile."],["Was passiert mit dem Brautstrauß?","Er landet zufällig bei Gabriel.","Alle lachen."],["Wem gibt Gabriel den Strauß?","Der verwitweten Tante mit dem Gedicht.","Freundliche Geste."]],"teaser":"Eine Einladung zur Hochzeit einer Kollegin – mit Standesamt, Polterabend und einem Brautstrauß, der falsch landet.","words":282},{"id":"laden","title":"Kurz vor acht im Supermarkt","level":"B2","topic":"Einkaufen · Tempo","min":3,"p":["Lin legte ihre Sachen aufs Band: Milch, Brot, Tomaten, Käse, Spülmittel, eine Packung Nudeln. Die Kassiererin zog alles über den Scanner, so schnell, dass Lin kaum zuschauen konnte.","„Vierzehn neunzig.“","Lin hatte noch nichts eingepackt. Die Sachen stapelten sich am Ende des Bandes, und schon kamen die Einkäufe des nächsten Kunden hinterher. Sie zahlte hektisch mit Karte und stopfte alles in ihren Rucksack. Die Tomaten landeten unter der Milch.","Der Mann hinter ihr wartete ungeduldig. Die Kassiererin sagte nichts, aber ihr Blick sagte alles.","Draußen beschwerte sich Lin bei ihrem Freund am Telefon. „Warum sind die so schnell? Ich fühle mich wie bei einem Wettrennen.“","„Weil's in Deutschland so ist“, lachte er. „Der Trick ist: Du packst nicht an der Kasse ein. Du legst alles zurück in den Wagen und packst dann an der Ablage am Fenster ein. In Ruhe.“","„Und das ist erlaubt?“","„Das machen alle. Schau mal genau hin.“","Beim nächsten Einkauf schaute Lin genau hin. Und tatsächlich: Die meisten Leute warfen die Sachen nach dem Scannen einfach zurück in den Einkaufswagen. Dann schoben sie den Wagen zu einer langen Ablage am Fenster und packten dort in Ruhe ein, manche mit Stofftaschen, die sie von zu Hause mitgebracht hatten.","Lin machte es nach. Die Kassiererin zog alles über den Scanner, Lin warf es in den Wagen, zahlte, ging zur Ablage. Keine Hektik. Kein Blick.","„Schönen Abend noch“, sagte die Kassiererin sogar.","„Ihnen auch“, sagte Lin, und zum ersten Mal fühlte sie sich wie jemand, der hier wohnt."],"g":[["Band","conveyor belt"],["Spülmittel","washing-up liquid"],["Kassiererin","cashier"],["einpacken","to pack"],["sich stapeln","to pile up"],["hektisch","hectic"],["stopfen","to stuff"],["ungeduldig","impatient"],["sich beschweren","to complain"],["Wettrennen","race"],["Einkaufswagen","shopping trolley"],["Ablage","shelf, counter"],["Stofftasche","cloth bag"],["nachmachen","to copy"]],"q":[["Warum fühlt sich Lin gestresst?","Die Kassiererin scannt sehr schnell, und Lin kann nicht rechtzeitig einpacken.","Hinter ihr wartet jemand."],["Was ist der Trick?","Alles zurück in den Wagen und an der Ablage in Ruhe einpacken.","Das machen alle."],["Was ändert sich beim nächsten Einkauf?","Lin ist entspannt, die Kassiererin sogar freundlich.","Sie hat das System verstanden."],["Was bedeutet das Ende?","Sie fühlt sich zum ersten Mal zugehörig.","Kleine Alltagskompetenz."]],"teaser":"Die deutsche Supermarktkasse – das schnellste Wettrennen des Alltags.","words":249},{"id":"mieter","title":"Der erste Besichtigungstermin","level":"B2","topic":"Wohnen · Suche","min":4,"p":["Die Anzeige versprach „2 Zimmer, Altbau, Balkon, 780 warm, Stuttgart-West“. Als Juan um 17:55 Uhr ankam, standen schon zwanzig Menschen vor der Haustür. Um 18 Uhr waren es dreißig.","Die Vermieterin, eine ältere Dame mit Klemmbrett, öffnete die Tür. „Bitte immer nur zehn Personen gleichzeitig. Und bitte die Schuhe ausziehen.“","Juan war in der zweiten Gruppe. Die Wohnung war wunderschön: hohe Decken, alter Holzboden, ein kleiner Balkon mit Blick auf Bäume. Alle anderen Interessenten liefen schnell durch, machten Fotos und gaben der Vermieterin eine Mappe.","„Was ist in den Mappen?“, fragte Juan leise eine Frau neben sich.","„Bewerbungsunterlagen. Schufa-Auskunft, Gehaltsnachweise, Mietschuldenfreiheitsbescheinigung, Personalausweis. Haben Sie das nicht?“","Juan hatte nichts davon. Er hatte nur sich selbst.","Er wartete, bis alle anderen gegangen waren. Dann ging er zur Vermieterin. „Entschuldigen Sie, dass ich keine Mappe habe. Ich wusste nicht, dass man das braucht. Ich bin erst seit zwei Monaten in Deutschland.“","Sie schaute ihn über ihre Brille an. „Woher kommen Sie?“","„Aus Chile. Ich arbeite als Ingenieur bei Bosch.“","„Und warum wollen Sie gerade diese Wohnung?“","Er überlegte kurz. „Wegen des Holzbodens. Mein Großvater war Schreiner. In seinem Haus gab es auch so einen Boden. Er hat immer gesagt, ein guter Holzboden erzählt Geschichten.“","Die Vermieterin schwieg einen Moment. Dann sagte sie: „Den Boden hat mein Mann verlegt. 1978.“ Sie gab ihm ihre Karte. „Schicken Sie mir die Unterlagen bis Freitag. Was Ihnen fehlt, steht auf meiner Webseite.“","Juan besorgte alles. Die Schufa-Auskunft dauerte drei Tage, die Gehaltsnachweise bekam er von der Personalabteilung. Am Montag kam die Zusage.","Beim Einzug sagte die Vermieterin: „Wissen Sie, warum ich Sie genommen habe? Alle hatten gute Mappen. Aber nur Sie haben den Boden angeschaut.“"],"g":[["Besichtigung","viewing"],["Bewerber","applicant"],["Klemmbrett","clipboard"],["Interessent","interested party"],["Mappe","folder"],["Bewerbungsunterlagen","application documents"],["Schufa-Auskunft","credit report"],["Gehaltsnachweis","proof of salary"],["Mietschuldenfreiheitsbescheinigung","proof of no rent arrears"],["Schreiner","carpenter"],["verlegen","to lay (a floor)"],["besorgen","to get hold of"],["Zusage","acceptance"],["Einzug","moving in"]],"q":[["Was ist das Problem bei der Besichtigung?","Es gibt sehr viele Bewerber, und Juan hat keine Unterlagen.","Andere haben Mappen."],["Was gehört in eine Bewerbungsmappe?","Schufa, Gehaltsnachweise, Mietschuldenfreiheitsbescheinigung, Ausweis.","Standard in Deutschland."],["Wie überzeugt Juan die Vermieterin?","Mit einer ehrlichen, persönlichen Geschichte über den Holzboden.","Ihr Mann hat ihn verlegt."],["Warum bekommt er die Wohnung?","Er war der Einzige, der den Boden wirklich angeschaut hat.","Persönlichkeit statt nur Papier."]],"teaser":"Eine Wohnungsbesichtigung mit dreißig Bewerbern – und wie man trotzdem auffällt.","words":279},{"id":"sauna","title":"Nackt in der Sauna","level":"B2","topic":"Kultur · Freizeit","min":4,"p":["„Du willst wirklich mit Badeanzug rein?“, fragte Anja und hielt die Tür zur Saunalandschaft auf.","Mei-Ling blieb stehen. „Was meinst du? Natürlich mit Badeanzug.“","„In Deutschland ist die Sauna textilfrei. Steht da.“ Anja zeigte auf ein Schild.","Mei-Ling las es zweimal. „Textilfrei heißt … nackt?“","„Genau. Aber keine Sorge, niemand schaut. Wirklich niemand.“","Mei-Ling zögerte lange. Dann sagte sie: „Okay. Aber ich gehe hinter dir.“","In der Umkleide zog sie sich aus und wickelte sich ein riesiges Handtuch um. In der Sauna saßen zehn Menschen, alle nackt, alle auf ihren Handtüchern. Ein älterer Mann las ein Saunaschild, eine junge Frau hatte die Augen geschlossen. Niemand schaute auf.","Anja legte ihr Handtuch auf die Bank. „Das ist die wichtigste Regel“, flüsterte sie. „Kein Schweiß aufs Holz. Immer komplett aufs Handtuch, auch die Füße.“","Nach fünf Minuten kam ein Mann mit einem Eimer und einem großen Tuch. „Aufguss!“, rief er. Er goss Wasser mit Eukalyptus auf die heißen Steine und wedelte dann mit dem Tuch, sodass heiße Luft durch den Raum strömte. Mei-Ling hatte das Gefühl, ihre Haut würde schmelzen. Die anderen klatschten am Ende.","Danach gingen sie ins kalte Tauchbecken. Mei-Ling schrie, als sie einstieg. Ein Mann neben ihr lachte freundlich. „Das ist beim ersten Mal immer so. Ab dem dritten Mal wollen Sie nicht mehr ohne.“","Auf der Liegewiese, eingewickelt in Bademäntel, fragte Anja: „Und? Schlimm?“","Mei-Ling dachte nach. „Am Anfang ja. Nach zwei Minuten habe ich vergessen, dass ich nackt bin. Weil alle es vergessen hatten.“","„Siehst du. Das ist das Geheimnis.“"],"g":[["Badeanzug","swimsuit"],["Therme","thermal spa"],["textilfrei","clothes-free"],["Umkleide","changing room"],["wickeln","to wrap"],["Schweiß","sweat"],["Aufguss","infusion (water on sauna stones)"],["Eimer","bucket"],["wedeln","to wave, fan"],["strömen","to stream"],["schmelzen","to melt"],["Tauchbecken","plunge pool"],["Liegewiese","sunbathing lawn"],["Geheimnis","secret"]],"q":[["Was bedeutet „textilfrei“?","Ohne Kleidung, also nackt.","Normal in deutschen Saunen."],["Was ist die wichtigste Regel?","Kein Schweiß aufs Holz – komplett auf dem Handtuch sitzen.","Hygiene."],["Was ist ein Aufguss?","Wasser mit Duft auf heiße Steine gießen und die heiße Luft verteilen.","Mit Applaus."],["Warum vergisst Mei-Ling schnell ihre Nacktheit?","Weil alle anderen es auch vergessen haben.","Normalität entspannt."]],"teaser":"Ein Kulturschock in der Therme – und warum ein Handtuch die wichtigste Regel ist.","words":253},{"id":"abmelden","title":"Den Strom anmelden","level":"B2","topic":"Behörden · Telefon","min":3,"p":["Am ersten Abend in der neuen Wohnung ging das Licht nicht an. Elias drückte alle Schalter, dann suchte er mit der Handylampe den Sicherungskasten. Alle Sicherungen waren oben. Trotzdem kein Strom.","Er rief seinen Vermieter an. „Haben Sie den Strom schon angemeldet?“, fragte der.","„Anmelden? Muss ich das?“","„Natürlich. Sie brauchen einen Stromanbieter. Sonst bekommen Sie zwar Grundversorgung, aber der Zähler muss erst freigeschaltet sein. Rufen Sie morgen früh bei den Stadtwerken an.“","Am nächsten Morgen saß Elias mit Kerzenlicht beim Frühstück und rief an.","„Stadtwerke, Kundenservice, mein Name ist Lorenz.“","„Guten Morgen. Ich bin gestern eingezogen und habe keinen Strom. Ich möchte den Strom anmelden.“","„Kein Problem. Ich brauche Ihre Adresse, Ihr Einzugsdatum und den Zählerstand. Haben Sie den Zählerstand abgelesen?“","„Was ist der Zählerstand?“","„Die Zahl auf dem Stromzähler. Der ist meistens im Keller oder im Flur. Eine Nummer mit fünf oder sechs Stellen.“","Elias lief in den Keller, suchte den Zähler mit seinem Namen und las die Zahl vor. „Eins, zwei, drei, vier, null, sieben.“","„Perfekt. Und die Zählernummer steht darunter, eine lange Nummer.“","Er las auch die. Herr Lorenz tippte. „So, Sie sind angemeldet. Der Strom ist innerhalb von zwei Stunden da. Wollen Sie Ökostrom?“","„Ist der teurer?“","„Zwei Euro im Monat.“","„Dann ja.“","Um elf Uhr ging das Licht an. Elias machte als Erstes Kaffee. Dann schrieb er auf einen Zettel und klebte ihn an den Kühlschrank: „Nächstes Mal: Strom anmelden VOR dem Einzug. Zählerstand fotografieren.“"],"g":[["Schalter","switch"],["Sicherungskasten","fuse box"],["Sicherung","fuse"],["Stromanbieter","electricity supplier"],["Grundversorgung","basic supply"],["Zähler","meter"],["freischalten","to activate"],["Stadtwerke","municipal utilities"],["Kerzenlicht","candlelight"],["einziehen","to move in"],["Zählerstand","meter reading"],["ablesen","to read (a meter)"],["Stelle","digit"],["Ökostrom","green electricity"]],"q":[["Warum hat Elias keinen Strom?","Er hat ihn noch nicht angemeldet.","Der Zähler ist nicht freigeschaltet."],["Was braucht der Kundenservice?","Adresse, Einzugsdatum, Zählerstand und Zählernummer.","Alles am Zähler im Keller."],["Was ist Ökostrom und was kostet er?","Grüner Strom, zwei Euro mehr im Monat.","Elias nimmt ihn."],["Was ist seine Lehre?","Strom vor dem Einzug anmelden und den Zählerstand fotografieren.","Zettel am Kühlschrank."]],"teaser":"Neue Wohnung, kein Strom, und ein Anruf beim Energieversorger, der überraschend einfach wird.","words":241},{"id":"chor","title":"Der Kirchenchor sucht Männer","level":"B2","topic":"Freizeit · Musik","min":4,"p":["Am Schwarzen Brett im Supermarkt hing ein Zettel: „Unser Chor sucht dringend Männerstimmen! Keine Vorkenntnisse nötig. Wir proben mittwochs um 19:30 im Gemeindehaus. Wir freuen uns auf dich!“","Abebe las ihn dreimal. Er hatte nie in einem Chor gesungen. Aber „dringend“ und „keine Vorkenntnisse“ klangen wie eine Einladung, die man nicht ablehnen durfte.","Im Gemeindehaus saßen zwanzig Frauen und vier Männer, alle über sechzig. Als Abebe hereinkam, standen drei Frauen gleichzeitig auf. „Ein Mann!“, rief eine. „Ein junger Mann!“","Die Chorleiterin, eine energische Frau namens Ursula, gab ihm die Hand. „Willkommen! Singen Sie Tenor oder Bass?“","„Ich weiß nicht.“","„Dann singen Sie mal eine Tonleiter.“ Sie spielte am Klavier. Abebe sang. Es klang, fand er, schrecklich.","Ursula nickte zufrieden. „Tenor! Wunderbar! Setzen Sie sich zu Herrn Bauer.“","Herr Bauer war achtzig und flüsterte ihm sofort zu: „Ich singe seit fünfzig Jahren Tenor. Ich treffe die hohen Töne nicht mehr. Wenn Sie sie treffen, sind Sie unser Held.“","Sie probten ein altes deutsches Volkslied. Abebe verstand den Text kaum: „Kein schöner Land in dieser Zeit …“ Aber er las die Noten, die Herr Bauer ihm mit dem Finger zeigte, und versuchte, mitzusingen. Beim dritten Mal traf er einen hohen Ton. Herr Bauer drückte ihm den Arm.","Nach der Probe gab es Tee und Kuchen. Die Frauen fragten ihn aus: Woher er komme, was er arbeite, ob er verheiratet sei, ob er Kuchen möge. Er beantwortete alles und aß drei Stücke.","Beim Weihnachtskonzert stand Abeb
