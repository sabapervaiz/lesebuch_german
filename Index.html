nde?","Er hat den Krimi nach einem halben Jahr gelesen, dreimal verlängert.","Fortschritt."]],"teaser":"Die Stadtbibliothek – kostenlos, ruhig und voller Überraschungen.","words":151},{"id":"notfall","title":"Die Notaufnahme","level":"B2","topic":"Gesundheit · Notfall","min":3,"p":["Um 22 Uhr fiel Benedikt mit dem Fahrrad auf glattem Laub. Sein Handgelenk schwoll sofort an. Seine Freundin Aiko brachte ihn mit dem Taxi in die Notaufnahme.","An der Anmeldung fragte eine Pflegekraft kurz: „Was ist passiert? Schmerzen von eins bis zehn?“","„Acht“, sagte Benedikt.","„Bitte setzen Sie sich ins Wartezimmer.“","Das Wartezimmer war voll. Ein Mann mit blutigem Kopf, eine Frau mit hohem Fieber, ein betrunkener Jugendlicher. Nach einer Stunde wurde der Mann mit dem Kopf aufgerufen. Dann ein älterer Herr, der nach Benedikt gekommen war.","„Warum ist der vor uns dran?“, fragte Aiko empört.","Eine Pflegekraft hörte es. „Wir behandeln nicht nach Reihenfolge, sondern nach Dringlichkeit. Der Herr hatte Brustschmerzen. Das kann ein Herzinfarkt sein. Ein Handgelenk kann warten.“","Aiko schämte sich ein bisschen. Benedikt nickte. „Das ist fair.“","Nach dreieinhalb Stunden kam er dran. Röntgen: Das Handgelenk war gebrochen. Gips für sechs Wochen.","Um drei Uhr nachts saßen sie im Taxi. „Sorry, dass ich mich beschwert habe“, sagte Aiko.","„Kein Problem. Ich bin froh, dass wir hier warten mussten. Das heißt, wir waren nicht die Schlimmsten.“"],"g":[["glatt","slippery"],["Laub","leaves"],["anschwellen","to swell"],["Notaufnahme","A&E, emergency room"],["Pflegekraft","nurse"],["aufrufen","to call (name)"],["empört","indignant"],["Dringlichkeit","urgency"],["Herzinfarkt","heart attack"],["Röntgen","X-ray"],["Gips","plaster cast"]],"q":[["Warum kommt der ältere Herr vor Benedikt dran?","Er hatte Brustschmerzen, möglicherweise einen Herzinfarkt.","Dringlichkeit vor Reihenfolge."],["Was ist Triage?","Behandlung nach Dringlichkeit.","Nicht nach Ankunft."],["Wie sieht Benedikt das Warten?","Positiv – sie waren nicht die schlimmsten Fälle.","Perspektivwechsel."]],"teaser":"Ein Sturz vom Fahrrad, eine lange Nacht in der Notaufnahme und eine Lektion über Triage.","words":179},{"id":"kaffeeklatsch","title":"Kaffee und Kuchen bei Oma Erna","level":"B2","topic":"Tradition · Familie","min":2,"p":["„Um drei gibt's Kaffee und Kuchen“, sagte Thomas. „Bei meiner Oma ist das heilig.“","Chiara verstand nicht ganz. „Kuchen um drei? Und dann Abendessen um sechs?“","„Genau. Dazwischen nichts.“","Bei Oma Erna war der Tisch gedeckt wie für eine Hochzeit. Feines Porzellan, eine Tischdecke mit Spitze, drei Kuchen: Käsekuchen, Apfelkuchen, Schwarzwälder Kirschtorte.","„Nimm, Kind, nimm“, sagte Oma Erna und legte Chiara ein riesiges Stück auf den Teller.","Chiara aß. Es war köstlich. Dann legte Oma Erna noch ein Stück auf.","„Danke, ich bin satt.“","„Ach was, ein Stückchen geht noch.“","Thomas flüsterte: „Du musst beim dritten Mal Nein sagen. Fest. Sonst hört sie nie auf.“","Beim dritten Mal sagte Chiara: „Nein, wirklich nicht, Frau Becker. Aber es war wunderbar. Darf ich das Rezept für den Käsekuchen haben?“","Oma Erna strahlte. Sie schrieb das Rezept auf einen Zettel, in alter Schrift, die Chiara kaum lesen konnte. Unten stand: „Nicht verraten! Familiengeheimnis.“"],"g":[["heilig","sacred"],["gedeckt","laid (table)"],["Porzellan","china"],["Spitze","lace"],["Schwarzwälder Kirschtorte","Black Forest gateau"],["köstlich","delicious"],["satt","full"],["Ach was","oh, come on"],["strahlen","to beam"],["verraten","to give away"]],"q":[["Was ist „Kaffee und Kuchen“?","Eine Nachmittagsmahlzeit um drei Uhr.","Bei Oma heilig."],["Was ist der Trick beim Ablehnen?","Beim dritten Mal fest Nein sagen.","Sonst kommt immer mehr."],["Wie gewinnt Chiara die Oma?","Sie fragt nach dem Rezept.","Familiengeheimnis."]],"teaser":"Die heiligste Stunde des deutschen Nachmittags: Kaffee und Kuchen um drei.","words":150},{"id":"hausaufgaben","title":"Mathe auf Deutsch","level":"B2","topic":"Familie · Schule","min":2,"p":["„Mama, was ist eine Textaufgabe?“, fragte Yasmin, neun Jahre alt.","Leila schaute ins Heft. „Ein Bauer hat 24 Kühe. Er verkauft ein Drittel. Wie viele Kühe hat er noch?“","Mathematik war leicht. Leila war Bauingenieurin. Aber die Wörter: „ein Drittel“, „verkaufen“, „noch“. Yasmin verstand die Mathematik nicht, weil sie die Sprache nicht verstand.","„Was ist ein Drittel?“","Leila holte drei Äpfel. „Wenn ich die Äpfel in drei gleiche Teile teile, ist ein Teil ein Drittel.“ Dann schnitt sie einen Apfel in drei Stücke. Yasmin aß eins. „Jetzt hast du ein Drittel gegessen.“","Yasmin lachte. „Dann hat der Bauer acht Kühe verkauft. Und hat noch sechzehn.“","„Genau!“","Ab da machten sie alle Textaufgaben mit Gegenständen aus der Küche. Nudeln für Plus, Löffel für Minus, ein Kuchen für Brüche. Leila lernte dabei Wörter wie „Bruch“, „Nenner“ und „Zähler“, die sie nie gebraucht hatte.","Bei der nächsten Mathearbeit bekam Yasmin eine Zwei. Die Lehrerin schrieb drunter: „Super, wie du die Textaufgaben verstehst!“ Yasmin sagte: „Das ist, weil wir sie essen.“"],"g":[["Textaufgabe","word problem"],["ein Drittel","a third"],["verkaufen","to sell"],["Bauingenieurin","civil engineer"],["teilen","to divide"],["Gegenstand","object"],["Bruch","fraction"],["Nenner","denominator"],["Zähler","numerator"],["Mathearbeit","maths test"]],"q":[["Was ist Yasmins Problem?","Sie versteht die Sprache der Aufgabe, nicht die Mathematik.","Wörter wie „Drittel“."],["Wie hilft Leila?","Mit Gegenständen aus der Küche.","Äpfel, Nudeln, Kuchen."],["Was lernt Leila selbst?","Fachwörter wie Bruch, Nenner, Zähler.","Gemeinsames Lernen."]],"teaser":"Eine Mutter, die Mathematik kann, aber die deutschen Wörter dafür nicht.","words":167},{"id":"erste_wohnung","title":"Möbel vom Schweden","level":"B2","topic":"Wohnen · Humor","min":2,"p":["Die Anleitung hatte keine Wörter. Nur Bilder von einem kleinen Mann, der lächelte.","„Schritt eins“, sagte Ömer. „Teil A an Teil B schrauben.“","„Welches ist Teil A?“, fragte seine Freundin Ella.","Sie suchten zwanzig Minuten. Teil A war unter dem Karton.","Bei Schritt sieben stritten sie zum ersten Mal. „Die Tür ist falsch rum!“ – „Nein, das Bild ist falsch!“ – „Das Bild ist nie falsch!“","Bei Schritt zwölf fehlte eine Schraube. Ömer fluchte auf Türkisch. Ella fluchte auf Deutsch. Dann fanden sie die Schraube in Ellas Socke.","Nach vier Stunden stand das Regal. Es wackelte ein bisschen. Übrig waren drei Schrauben.","„Wo gehören die hin?“","„Egal. Das sind Ersatzschrauben“, sagte Ella. „Die legen sie immer extra dazu. Glaub ich.“","Sie stellten Bücher hinein. Es hielt. Sie stießen mit Apfelschorle an.","„Weißt du“, sagte Ömer, „man sagt, wer zusammen ein Regal aufbaut, kann auch zusammen leben.“","„Wer sagt das?“","„Ich. Gerade eben.“"],"g":[["Anleitung","instructions"],["Schritt","step"],["schrauben","to screw"],["falsch rum","the wrong way round"],["fluchen","to swear"],["wackeln","to wobble"],["übrig","left over"],["Ersatzschraube","spare screw"],["anstoßen","to toast"],["aufbauen","to assemble"]],"q":[["Was ist schwierig an der Anleitung?","Sie hat keine Wörter, nur Bilder.","Teile finden."],["Wo war die fehlende Schraube?","In Ellas Socke.","Humor."],["Was ist Ömers Spruch?","Wer zusammen ein Regal aufbaut, kann zusammen leben.","Selbst erfunden."]],"teaser":"Ein Regal, achtundvierzig Schrauben, eine Anleitung ohne Worte und eine Beziehung, die es übersteht.","words":152},{"id":"zoll","title":"Das Paket vom Zoll","level":"B2","topic":"Behörden · Post","min":2,"p":["Statt des Pakets kam ein Brief: „Ihre Sendung liegt beim Zollamt zur Abholung bereit. Bitte bringen Sie einen Nachweis über den Warenwert mit.“","Vikram fuhr zum Zollamt am Stadtrand. Eine Stunde Wartezeit. Dann öffnete ein Beamter das Paket vor ihm. Darin: Gewürze, ein Seidenschal und Süßigkeiten von seiner Mutter.","„Was ist der Wert?“","„Es ist ein Geschenk. Von meiner Mutter.“","„Geschenke sind bis 45 Euro zollfrei. Aber der Schal sieht teuer aus.“","Vikram rief seine Mutter per Video an. Der Beamte schaute auf den Bildschirm, wo eine kleine Frau aufgeregt auf Hindi erklärte, dass der Schal vom Markt sei und nur zwölf Euro gekostet habe. Vikram übersetzte.","Der Beamte lächelte zum ersten Mal. „Grüßen Sie Ihre Mutter. Zollfrei.“","Auf dem Heimweg aß Vikram die Süßigkeiten im Bus. Sie schmeckten nach zu Hause und ein bisschen nach Zollamt."],"g":[["Zoll","customs"],["Sendung","consignment"],["Abholung","collection"],["Nachweis","proof"],["Warenwert","value of goods"],["Stadtrand","outskirts"],["Beamter","official"],["Seidenschal","silk scarf"],["zollfrei","duty-free"],["übersetzen","to translate"]],"q":[["Warum muss Vikram zum Zollamt?","Das Paket aus Indien wurde vom Zoll zurückgehalten.","Nachweis über den Wert."],["Bis wann sind Geschenke zollfrei?","Bis 45 Euro.","Der Schal sah teuer aus."],["Wie löst er das Problem?","Mit einem Videoanruf mit seiner Mutter.","Der Beamte glaubt ihr."]],"teaser":"Ein Geschenk aus Indien, eine Mitteilung vom Zoll und ein Morgen im Zollamt.","words":137},{"id":"sprachcafe","title":"Das Sprachcafé","level":"B2","topic":"Lernen · Freundschaft","min":2,"p":["Das Sprachcafé fand jeden Donnerstag in einer Kneipe statt. An jedem Tisch stand ein Fähnchen: Spanisch, Arabisch, Englisch, Deutsch. Man setzte sich an den Tisch der Sprache, die man üben wollte.","Amina setzte sich an den deutschen Tisch. Dort saß ein älterer Herr, Klaus, der Arabisch lernte. „Ich spreche dreißig Minuten Deutsch mit Ihnen, dann Sie dreißig Minuten Arabisch mit mir. Einverstanden?“","„Einverstanden.“","Klaus korrigierte freundlich. „Man sagt nicht ‚Ich habe Hunger bekommen', sondern ‚Ich habe Hunger gekriegt'. Umgangssprachlich.“ Amina korrigierte zurück: „Man sagt nicht ‚Ana kitab', das heißt ‚Ich bin ein Buch'.“","Klaus lachte so laut, dass sich alle umdrehten. „Ich bin ein Buch! Seit drei Monaten sage ich das!“","Nach einem halben Jahr trafen sie sich nicht mehr nur donnerstags. Klaus zeigte ihr die Wanderwege um Stuttgart. Amina kochte für ihn und seine Frau. Sein Arabisch blieb schrecklich. Ihr Deutsch wurde fließend.","„Ich glaube, der Tausch ist nicht fair“, sagte Klaus einmal.","„Doch“, sagte Amina. „Sie haben Deutsch gegeben. Ich habe Essen gegeben.“"],"g":[["Sprachcafé","language exchange café"],["Kneipe","pub"],["Fähnchen","little flag"],["einverstanden","agreed"],["korrigieren","to correct"],["kriegen","(colloquial) to get"],["umgangssprachlich","colloquially"],["sich umdrehen","to turn round"],["fließend","fluent"],["Tausch","exchange"]],"q":[["Wie funktioniert das Sprachcafé?","Man setzt sich an den Tisch der Sprache, die man üben will, und tauscht.","Halbe-halbe."],["Was war Klaus' Fehler?","Er sagte „Ich bin ein Buch“ statt „Ich habe ein Buch“.","Drei Monate lang."],["Warum ist der Tausch laut Amina fair?","Er gab Deutsch, sie gab Essen.","Freundschaft."]],"teaser":"Jeden Donnerstag tauschen Fremde ihre Sprachen – und manchmal mehr.","words":165},{"id":"trinkgeld","title":"Wie viel Trinkgeld?","level":"B2","topic":"Restaurant · Kultur","min":2,"p":["„Das macht dann 37,40“, sagte die Kellnerin.","Jian legte zwei Zwanziger hin und wartete auf das Wechselgeld. Die Kellnerin wartete auch. Es entstand eine seltsame Pause.","Seine Kollegin Nina flüsterte: „Du musst sagen, wie viel du geben willst. Zum Beispiel: ‚Machen Sie vierzig.'“","Jian wurde rot. „Machen Sie vierzig“, sagte er.","„Danke schön!“, sagte die Kellnerin und ging.","„Wie viel gibt man?“, fragte Jian.","„Ungefähr zehn Prozent. Man rundet auf. Und man sagt den Betrag gleich beim Bezahlen, nicht später auf den Tisch legen.“","„Und wenn man mit Karte zahlt?“","„Dann sagst du auch den Betrag. ‚Zweiundvierzig, bitte.' Die Kellnerin tippt das ein.“","„Und ‚Stimmt so'?“","„Das sagst du, wenn sie das ganze Wechselgeld behalten soll.“","Beim nächsten Mal zahlte Jian allein. „Das macht 18,60.“ Er gab einen Zwanziger. „Stimmt so.“ Die Kellnerin lächelte. Jian fühlte sich, als hätte er eine Prüfung bestanden."],"g":[["Kellnerin","waitress"],["Wechselgeld","change"],["Pause","pause"],["aufrunden","to round up"],["Betrag","amount"],["eintippen","to key in"],["Stimmt so","keep the change"],["behalten","to keep"],["eine Prüfung bestehen","to pass a test"]],"q":[["Was war das Missverständnis?","Jian wartete aufs Wechselgeld, die Kellnerin wartete auf den Trinkgeldbetrag.","Peinliche Pause."],["Wie viel Trinkgeld gibt man?","Etwa zehn Prozent, aufgerundet.","Betrag beim Bezahlen nennen."],["Was bedeutet „Stimmt so“?","Das ganze Wechselgeld als Trinkgeld behalten.","Bequeme Formel."]],"teaser":"Die Rechnung kommt, und die schwierigste Rechnung beginnt im Kopf.","words":143},{"id":"ferien","title":"Wenn die Kinder Ferien haben","level":"B2","topic":"Familie · Arbeit","min":2,"p":["„Sechs Wochen?“, fragte Rosa entsetzt. „Die Kinder haben sechs Wochen Sommerferien?“","„Ja“, sagte die Lehrerin. „Und dazu Herbstferien, Weihnachtsferien, Faschingsferien, Osterferien, Pfingstferien.“","Rosa rechnete. Sie und ihr Mann hatten zusammen sechzig Urlaubstage. Die Kinder hatten fast vierzehn Wochen frei.","Am Abend machten sie einen Plan. Zwei Wochen Rosa, zwei Wochen ihr Mann, eine Woche gemeinsam Urlaub. Blieb eine Woche.","Rosas Kollegin hatte einen Tipp. „Ferienbetreuung! Die Stadt bietet Programme an. Zirkus, Sport, Kunst. Musst du aber früh buchen, im Februar.“","Es war Mai. Alle Plätze waren weg.","Dann bot die Nachbarin, eine pensionierte Lehrerin, an: „Ich nehme die beiden eine Woche. Gegen Bezahlung in Kuchen.“","Rosa backte jeden Tag. Die Kinder lernten bei der Nachbarin Kartenspiele, Gärtnern und schwäbische Schimpfwörter. Nächstes Jahr, schwor Rosa, buche sie im Februar. Die Kinder hofften, sie würde es vergessen."],"g":[["Ferien","school holidays"],["entsetzt","horrified"],["Fasching","carnival"],["Pfingsten","Whitsun"],["Urlaubstag","day of leave"],["Ferienbetreuung","holiday childcare"],["buchen","to book"],["pensioniert","retired"],["gärtnern","to garden"],["Schimpfwort","swear word"],["schwören","to swear"]],"q":[["Was ist Rosas Problem?","Die Kinder haben viel mehr Ferien als die Eltern Urlaub.","Fast vierzehn Wochen."],["Was ist Ferienbetreuung?","Städtische Programme für Kinder in den Ferien.","Früh buchen."],["Wie wird die letzte Woche gelöst?","Die Nachbarin betreut die Kinder gegen Kuchen.","Nachbarschaftshilfe."]],"teaser":"Sechs Wochen Sommerferien, zwei arbeitende Eltern und ein Puzzle aus Betreuung.","words":135},{"id":"radfahren","title":"Mit dem Fahrrad durch Stuttgart","level":"B2","topic":"Verkehr · Sport","min":2,"p":["„Mit dem Fahrrad? In Stuttgart?“, lachte die Kollegin. „Hier ist alles bergauf.“","Jorge glaubte es nicht, bis er es versuchte. Von seiner Wohnung im Kessel bis zur Firma auf der Höhe waren es nur vier Kilometer, aber 200 Höhenmeter. Er kam an wie nach einem Marathon.","Am Wochenende ging er in ein Fahrradgeschäft. „Ich brauche Hilfe. Ich wohne unten und arbeite oben.“","Der Verkäufer nickte wissend. „Das ist das Stuttgarter Problem. Sie brauchen ein E-Bike. Oder Sie nehmen die Zacke.“","„Die Zacke?“","„Die Zahnradbahn. Da kann man das Fahrrad mitnehmen. Bergauf mit der Bahn, bergab mit dem Rad.“","Jorge probierte es. Morgens mit der Zacke hoch, die Aussicht über die Stadt war wunderschön. Abends mit dem Rad runter, in sieben Minuten, mit Wind im Gesicht.","Nach einem Monat kaufte er ein gebrauchtes E-Bike. Aber manchmal nahm er trotzdem die Zacke. Wegen der Aussicht."],"g":[["bergauf","uphill"],["Kessel","basin (Stuttgart's valley)"],["Höhe","height, upper part"],["Höhenmeter","metres of elevation"],["wissend","knowingly"],["Zahnradbahn","rack railway"],["mitnehmen","to take along"],["bergab","downhill"],["Aussicht","view"],["gebraucht","second-hand"]],"q":[["Warum ist Radfahren in Stuttgart schwer?","Die Stadt liegt im Kessel; vieles ist bergauf.","200 Höhenmeter."],["Was ist die „Zacke“?","Die Zahnradbahn, in der man das Rad mitnehmen kann.","Bergauf mit der Bahn."],["Warum nimmt Jorge sie trotz E-Bike?","Wegen der Aussicht.","Genuss statt Pflicht."]],"teaser":"Eine Stadt voller Hügel, ein E-Bike und die überraschende Freude am Pendeln.","words":143},{"id":"tankstelle","title":"Nachts an der Tankstelle","level":"B2","topic":"Arbeit · Menschen","min":2,"p":["Um 23 Uhr begann Yaws Schicht. Bis sechs Uhr morgens war er allein in der Tankstelle an der B27.","Um Mitternacht kam ein Taxifahrer für Kaffee. „Wie immer“, sagte er, und Yaw wusste nach drei Wochen, dass das schwarz mit zwei Zucker hieß.","Um eins kamen drei junge Leute nach einer Party, kauften Chips und fragten, ob er wisse, wo man noch Pizza bekomme. Er wusste es.","Um drei kam eine Krankenschwester nach der Spätschicht und kaufte eine Brezel. Sie erzählte von einem schweren Abend. Er hörte zu.","Um vier kam ein Lkw-Fahrer aus Polen, der kein Deutsch sprach. Yaw half ihm mit Händen und Füßen, die richtige Autobahn zu finden.","Um fünf kam der Bäcker mit den frischen Brötchen. „Morgen, Philosoph!“, sagte er. So nannte er Yaw, weil er zwischen den Kunden Bücher las.","Um sechs übergab er an die Frühschicht. Draußen ging die Sonne auf. Er war müde, aber er dachte: In keinem Kurs der Uni lernt man so viel über Menschen wie in einer Nacht an der Tankstelle."],"g":[["Schicht","shift"],["Tankstelle","petrol station"],["Taxifahrer","taxi driver"],["Spätschicht","late shift"],["Lkw-Fahrer","lorry driver"],["mit Händen und Füßen","with gestures"],["übergeben","to hand over"],["Frühschicht","early shift"],["aufgehen","to rise (sun)"]],"q":[["Wer kommt in der Nacht?","Taxifahrer, Partygäste, eine Krankenschwester, ein Lkw-Fahrer, der Bäcker.","Ein Querschnitt."],["Warum heißt Yaw „Philosoph“?","Er liest zwischen den Kunden Bücher.","Spitzname vom Bäcker."],["Was lernt Yaw?","Viel über Menschen.","Mehr als in der Uni."]],"teaser":"Ein Student arbeitet die Nachtschicht an einer Tankstelle und lernt Deutschland von seiner ehrlichsten Seite kennen.","words":171},{"id":"putzfrau","title":"Die Reinigungskraft","level":"B2","topic":"Arbeit · Respekt","min":2,"p":["Meistens war das Büro leer, wenn Frau Dimitriou kam. Heute nicht. Mia arbeitete noch.","„Entschuldigung, ich bin gleich weg“, sagte Mia.","„Bleiben Sie ruhig. Ich mache um Sie herum.“","Mia beobachtete, wie Frau Dimitriou die Papierkörbe leerte, die Tische wischte, die Pflanzen goss. Auch Mias Pflanze, die Mia selbst vergessen hatte.","„Sie gießen meine Pflanze?“","„Jeden Dienstag. Sie war fast tot.“","Mia war beschämt. Seit einem Jahr arbeitete sie hier und hatte nie mit dieser Frau gesprochen.","Sie redeten. Frau Dimitriou war in Griechenland Lehrerin gewesen, Biologie. In Deutschland wurde ihr Abschluss nicht anerkannt. Sie putzte abends und lernte tagsüber Deutsch für die Anerkennung.","„Noch ein Jahr“, sagte sie. „Dann darf ich wieder unterrichten.“","Ein Jahr später bekam Mia eine Postkarte. Vorne ein Schulgebäude in Esslingen. Hinten: „Erste Woche als Lehrerin. Ihre Pflanze müssen Sie jetzt selbst gießen. Herzlich, Eleni Dimitriou.“"],"g":[["Reinigungskraft","cleaner"],["putzen","to clean"],["beobachten","to observe"],["Papierkorb","waste-paper bin"],["wischen","to wipe"],["gießen","to water"],["beschämt","ashamed"],["Abschluss","qualification"],["anerkennen","to recognise"],["unterrichten","to teach"]],"q":[["Was bemerkt Mia?","Die Reinigungskraft gießt ihre vergessene Pflanze.","Seit einem Jahr unbeachtet."],["Was ist Frau Dimitrious Geschichte?","Lehrerin in Griechenland, Abschluss in Deutschland nicht anerkannt.","Sie lernt für die Anerkennung."],["Wie endet es?","Sie wird in Deutschland Lehrerin.","Postkarte an Mia."]],"teaser":"Jeden Abend um acht putzt Frau Dimitriou die Büros – und eine Ingenieurin bemerkt sie zum ersten Mal.","words":141},{"id":"versicherung","title":"Haftpflicht","level":"B2","topic":"Versicherung · Unfall","min":2,"p":["Beim Abendessen bei Freunden stieß Carlos sein Rotweinglas um. Der Wein lief direkt über den Laptop seines Freundes Jan. Der Bildschirm wurde schwarz.","„Oh nein. Es tut mir so leid. Ich bezahle das.“","„Der hat 1.400 Euro gekostet“, sagte Jan leise.","Carlos wurde blass. Dann fragte Jans Freundin: „Hast du eine Haftpflichtversicherung?“","„Eine was?“","„Haftpflicht. Die bezahlt, wenn du aus Versehen etwas von anderen kaputt machst. Fast jeder in Deutschland hat eine. Kostet fünf Euro im Monat.“","Carlos hatte keine. Er zahlte den Laptop in Raten, sechs Monate lang. Jan war großzügig und wollte nur die Hälfte. Carlos bestand auf dem ganzen Betrag.","Am nächsten Tag schloss er eine Haftpflichtversicherung ab. Online, in zehn Minuten. Als er drei Monate später beim Umzug eines Freundes eine Tür beschädigte, rief er nur bei der Versicherung an.","„Die wichtigste Versicherung in Deutschland“, sagte er später zu jedem Neuen. „Wichtiger als alles andere. Fünf Euro. Glaub mir.“"],"g":[["umstoßen","to knock over"],["Bildschirm","screen"],["blass werden","to turn pale"],["Haftpflichtversicherung","personal liability insurance"],["aus Versehen","by accident"],["in Raten","in instalments"],["großzügig","generous"],["abschließen","to take out (insurance)"],["beschädigen","to damage"]],"q":[["Was ist passiert?","Carlos hat Rotwein über Jans Laptop geschüttet.","1.400 Euro Schaden."],["Was ist eine Haftpflichtversicherung?","Sie zahlt, wenn man aus Versehen Sachen anderer beschädigt.","Etwa fünf Euro im Monat."],["Was lernt Carlos?","Sie ist die wichtigste Versicherung.","Er empfiehlt sie allen."]],"teaser":"Ein umgestoßenes Weinglas, ein teures Laptop und die wichtigste Versicherung in Deutschland.","words":153},{"id":"joggen","title":"Der Lauftreff","level":"B2","topic":"Sport · Gemeinschaft","min":2,"p":["„Lauftreff, jeden Dienstag, 19 Uhr, am Eingang zum Rosensteinpark. Alle Tempos willkommen!“ Haruto las das Plakat und ging hin.","Zwanzig Leute standen da. Ein Mann mit grauem Bart begrüßte ihn. „Neu? Ich bin Herbert. Wir laufen in drei Gruppen: schnell, mittel, gemütlich. Wo willst du hin?“","„Gemütlich“, sagte Haruto ehrlich.","Die gemütliche Gruppe bestand aus einer Mutter, die gerade wieder anfing, einem Rentner mit künstlichem Knie und zwei Studentinnen, die beim Laufen ununterbrochen redeten. „Wir laufen so langsam, dass man reden kann“, erklärte eine. „Das ist die Regel.“","Haruto redete. Über Japan, über seine Arbeit, über das Wetter. Er merkte gar nicht, dass sie sechs Kilometer gelaufen waren.","Danach gingen alle zusammen in eine Kneipe. Herbert hob sein Glas. „Auf Haruto! Neues Mitglied!“","Nach einem Jahr lief Haruto in der mittleren Gruppe. Im Herbst lief er seinen ersten Halbmarathon. Im Ziel standen die beiden Studentinnen und schrien seinen Namen."],"g":[["Lauftreff","running group"],["Tempo","pace"],["willkommen","welcome"],["gemütlich","leisurely"],["künstlich","artificial"],["ununterbrochen","non-stop"],["merken","to notice"],["Mitglied","member"],["Ziel","finish line"]],"q":[["Wie ist die Gruppe organisiert?","In drei Tempogruppen: schnell, mittel, gemütlich.","Alle willkommen."],["Was ist die Regel der gemütlichen Gruppe?","So langsam laufen, dass man reden kann.","Gespräch statt Leistung."],["Was erreicht Haruto nach einem Jahr?","Er läuft in der mittleren Gruppe und einen Halbmarathon.","Mit Unterstützung."]],"teaser":"Dienstags um sieben läuft eine bunte Gruppe durch den Park – und nimmt jeden mit.","words":149},{"id":"abschied","title":"Der letzte Arbeitstag","level":"B2","topic":"Arbeit · Abschied","min":2,"p":["Nach 41 Jahren hatte Herr Krause seinen letzten Arbeitstag. Er war der Älteste in der Firma und der Einzige, der noch wusste, wo die Akten von 1985 lagen.","Das Team hatte heimlich gesammelt. Ein Fahrrad, weil er immer gesagt hatte, in der Rente wolle er an den Bodensee radeln.","Um 15 Uhr versammelten sich alle in der Kantine. Die Chefin hielt eine kurze Rede. „Herr Krause hat drei Chefs, zwei Umzüge und vier Computersysteme überlebt. Und er war nie krank. Kein einziges Mal.“","Alle klatschten. Herr Krause stand auf. Er war kein Mann vieler Worte. „Danke“, sagte er. Pause. „Es war … eine gute Zeit.“ Dann setzte er sich wieder. Seine Augen waren feucht.","Dann rollten zwei Kollegen das Fahrrad herein, mit einer großen Schleife. Herr Krause sprang auf. „Das ist doch …“","„Für den Bodensee!“, riefen alle.","Zum ersten Mal in 41 Jahren sah man Herrn Krause lachen und weinen gleichzeitig. Zwei Wochen später kam eine Postkarte aus Friedrichshafen: „Bin angekommen. Das Fahrrad ist schneller als ich. Grüße an alle. Ihr fehlt mir. Euer Krause.“ Es war das erste Mal, dass er „euer“ geschrieben hatte."],"g":[["Rente","retirement"],["Akte","file"],["heimlich","secretly"],["radeln","to cycle"],["sich versammeln","to gather"],["eine Rede halten","to give a speech"],["überleben","to survive"],["feucht","moist"],["Schleife","bow"],["Ihr fehlt mir","I miss you"]],"q":[["Was schenkt das Team?","Ein Fahrrad für den Bodensee.","Sein Traum für die Rente."],["Wie reagiert Herr Krause?","Er lacht und weint gleichzeitig.","Sonst ein Mann weniger Worte."],["Was ist besonders an der Postkarte?","Er schreibt zum ersten Mal „euer“.","Nähe nach 41 Jahren."]],"teaser":"Ein Kollege geht in Rente, und das Team hat eine Überraschung vorbereitet.","words":186},{"id":"garten","title":"Der Kleingarten","level":"B2","topic":"Natur · Regeln","min":2,"p":["Endlich hatten Amira und Tom einen Kleingarten bekommen. Nach drei Jahren auf der Warteliste. 300 Quadratmeter, eine Laube, zwei Apfelbäume.","Der Vorsitzende des Vereins gab ihnen die Gartenordnung. Siebenundvierzig Seiten.","„Siebenundvierzig?“, fragte Tom.","„Lesen Sie Paragraf 12 besonders gründlich. Hecken nicht höher als 1,25 Meter. Ein Drittel der Fläche muss für Obst und Gemüse genutzt werden. Rasenmähen nicht in der Mittagsruhe.“","Am ersten Samstag kam der Nachbar, Herr Pfleiderer, mit einem Zollstock. Er maß die Hecke. „1,31 Meter. Das müssen Sie schneiden.“","Amira war genervt. Aber Tom schnitt die Hecke. Und Herr Pfleiderer brachte am Abend Tomatenpflanzen vorbei. „Für das Drittel“, sagte er. „Die sind robust. Für Anfänger.“","Im August hatten sie mehr Tomaten, als sie essen konnten. Herr Pfleiderer zeigte ihnen, wie man Tomatensoße einkocht. Amira merkte: Hinter jeder strengen Regel stand ein Nachbar, der helfen wollte. Man musste nur die Hecke schneiden."],"g":[["Kleingarten / Schrebergarten","allotment"],["Warteliste","waiting list"],["Laube","summer house"],["Vorsitzende","chairperson"],["Gartenordnung","garden rules"],["Hecke","hedge"],["Fläche","area"],["Mittagsruhe","midday quiet time"],["Zollstock","folding ruler"],["einkochen","to preserve"]],"q":[["Was regelt die Gartenordnung?","Heckenhöhe, Obst- und Gemüseanteil, Ruhezeiten.","47 Seiten."],["Was macht Herr Pfleiderer?","Er misst die Hecke, bringt dann aber Tomatenpflanzen.","Streng und hilfsbereit."],["Was ist Amiras Erkenntnis?","Hinter strengen Regeln stehen hilfsbereite Nachbarn.","Man muss sich anpassen."]],"teaser":"Ein Schrebergarten mit 47 Seiten Gartenordnung und einem Nachbarn, der die Heckenhöhe misst.","words":144},{"id":"stammtisch","title":"Der Stammtisch","level":"B2","topic":"Tradition · Gemeinschaft","min":2,"p":["Auf dem Tisch in der Ecke stand ein Schild aus Messing: „Stammtisch“. Elias setzte sich trotzdem hin, weil sonst alles voll war.","Der Wirt kam sofort. „Da können Sie nicht sitzen. Das ist der Stammtisch. Um acht kommen die Herren.“","„Welche Herren?“","„Vier Männer. Seit fünfzig Jahren, jeden Freitag.“","Elias wollte aufstehen. In dem Moment kamen die Herren. Vier alte Männer, mit Hut. Einer schaute ihn an. „Bleiben Sie sitzen, junger Mann. Wir sind nur noch vier. Früher waren wir zwölf.“","Elias blieb. Die Männer bestellten Bier, ohne zu fragen, was es gab; der Wirt wusste es. Sie diskutierten über den VfB, über die Politik in Berlin, über die Brezelpreise. Dann fragten sie ihn aus. Woher? Was arbeiten? Fußball?","„Ich bin für den VfB“, sagte Elias.","Die vier schauten sich an. „Dann kannst du nächsten Freitag wiederkommen“, sagte einer. „Wir brauchen junges Blut.“","Elias kam wieder. Ein Jahr später war er der Jüngste am Stammtisch, mit einem eigenen Bierkrug mit seinem Namen."],"g":[["Stammtisch","regulars' table"],["Messing","brass"],["Wirt","landlord (pub)"],["bestellen","to order"],["ausfragen","to question"],["VfB","VfB Stuttgart (football club)"],["junges Blut","new blood"],["Bierkrug","beer mug"]],"q":[["Was ist ein Stammtisch?","Ein reservierter Tisch für feste Gäste, die regelmäßig kommen.","Hier seit 50 Jahren."],["Warum darf Elias bleiben?","Die Gruppe ist klein geworden und braucht neue Leute.","Und er ist für den VfB."],["Was zeigt der Bierkrug?","Er gehört jetzt fest dazu.","Mit eigenem Namen."]],"teaser":"Ein Tisch in der Kneipe, der seit 1974 denselben Männern gehört – und ein neuer Gast.","words":162},{"id":"verspaetung","title":"Zu spät zum Meeting","level":"B2","topic":"Arbeit · Pünktlichkeit","min":2,"p":["Die Besprechung begann um 9:00. Nikhil kam um 9:06. Alle schauten auf.","„Entschuldigung, die S-Bahn hatte Verspätung“, sagte er und setzte sich.","Die Teamleiterin nickte und machte weiter. Nach der Besprechung nahm ihn sein Kollege Felix zur Seite. „Kleiner Tipp: Wenn du zu spät kommst, schreib vorher eine Nachricht. ‚Ich bin fünf Minuten später, S-Bahn.' Dann warten alle nicht und machen sich keine Gedanken.“","„Auch bei fünf Minuten?“","„Gerade bei fünf Minuten. Fünf Minuten ohne Nachricht sind schlimmer als fünfzehn mit Nachricht.“","Nikhil fand das übertrieben. In Indien hätten fünf Minuten niemanden interessiert. Aber er machte es.","Zwei Wochen später kam die Teamleiterin selbst zu spät. Um 8:57 kam eine Nachricht in die Gruppe: „Bin 10 Min später, Stau auf der B10. Fangt gern ohne mich an.“","Nikhil musste lächeln. Es war keine Frage der Höflichkeit. Es war eine Frage der Planung. Und Planung war hier, wie er langsam verstand, eine Form von Respekt."],"g":[["Besprechung","meeting"],["Verspätung","delay"],["zur Seite nehmen","to take aside"],["sich Gedanken machen","to worry"],["übertrieben","exaggerated"],["Stau","traffic jam"],["Höflichkeit","politeness"],["Planung","planning"],["Respekt","respect"]],"q":[["Was rät Felix?","Bei Verspätung vorher eine kurze Nachricht schreiben.","Auch bei fünf Minuten."],["Warum ist das wichtig?","Fünf Minuten ohne Nachricht sind schlimmer als fünfzehn mit.","Andere können planen."],["Was versteht Nikhil am Ende?","Planung ist eine Form von Respekt.","Die Chefin macht es genauso."]],"teaser":"Fünf Minuten zu spät und die Frage, wie man sich in Deutschland richtig entschuldigt.","words":154},{"id":"abschiedsbrief","title":"Der Brief an die Vermieterin","level":"B2","topic":"Wohnen · Schreiben","min":2,"p":["Nach fünf Jahren zog Aaliyah aus. Ein neuer Job in Hamburg. Sie hatte die Wohnung gekündigt, drei Monate vorher, schriftlich, per Einschreiben.","Bei der Wohnungsübergabe ging die Vermieterin, Frau Ostertag, mit Klemmbrett durch alle Räume. Sie notierte einen kleinen Kratzer im Parkett und ein Loch in der Wand, wo ein Bild gehangen hatte.","„Das Loch müssen Sie zuspachteln“, sagte sie. „Sonst ziehe ich es von der Kaution ab.“","Aaliyah spachtelte das Loch. Dann schrieb sie einen Brief, mit der Hand, und legte ihn auf den Küchentisch mit den Schlüsseln.","„Liebe Frau Ostertag, danke für fünf gute Jahre. Danke, dass Sie die Heizung im ersten Winter sofort repariert haben. Danke für die Tomaten aus Ihrem Garten. Ich habe mich hier zu Hause gefühlt. Herzliche Grüße, Aaliyah.“","Zwei Wochen später kam die Kaution zurück. Komplett. Ohne Abzug für den Kratzer. Dazu eine Karte: „Liebe Aaliyah, so einen Brief habe ich in 30 Jahren als Vermieterin noch nie bekommen. Alles Gute in Hamburg. Und wenn Sie zurückkommen: Sie wissen, wo Sie klingeln.“"],"g":[["ausziehen","to move out"],["kündigen","to give notice"],["Einschreiben","registered letter"],["Wohnungsübergabe","handover"],["Klemmbrett","clipboard"],["Kratzer","scratch"],["Parkett","parquet floor"],["zuspachteln","to fill (a hole)"],["abziehen","to deduct"],["Abzug","deduction"]],"q":[["Wie kündigt man eine Wohnung?","Schriftlich, drei Monate vorher, am besten per Einschreiben.","Aaliyah macht es richtig."],["Was macht Aaliyah außer Spachteln?","Sie schreibt einen persönlichen Dankesbrief.","Mit der Hand."],["Was ist das Ergebnis?","Volle Kaution ohne Abzug und eine herzliche Karte.","Freundlichkeit zahlt sich aus."]],"teaser":"Ein Auszug nach fünf Jahren – und ein Brief, der mehr zurückbringt als die Kaution.","words":169},{"id":"sonntag_baeckerei","title":"Die Sonntagsbrötchen","level":"B2","topic":"Alltag · Ritual","min":2,"p":["Sonntags hatte die Bäckerei an der Ecke von acht bis elf geöffnet. Um 8:05 stand eine Schlange bis auf die Straße.","Ivan stellte sich an. Vor ihm stand ein Mann im Bademantel unter der Jacke. Hinter ihm eine Familie mit drei verschlafenen Kindern.","„Ist das jeden Sonntag so?“, fragte Ivan den Mann im Bademantel.","„Jeden Sonntag. Seit ich denken kann. Sonntagsbrötchen sind heilig.“","Drinnen rief die Verkäuferin: „Der Nächste, bitte!“ Ivan bestellte: „Vier Brötchen, bitte.“","„Welche? Laugen, Kaiser, Körner, Dinkel, Mohn, Sesam?“","Ivan wusste nicht. „Von jedem eins?“","Sie lachte. „Gute Entscheidung.“","Zu Hause deckte er den Tisch, wie er es bei deutschen Freunden gesehen hatte: Brötchen, Butter, Marmelade, ein gekochtes Ei, Kaffee. Er aß langsam. Draußen läuteten die Kirchenglocken.","Ab da ging Ivan jeden Sonntag. Nach einem Jahr sagte die Verkäuferin, bevor er etwas sagen konnte: „Einmal von jedem, wie immer?“ Und Ivan fühlte sich, zum ersten Mal, irgendwo zu Hause."],"g":[["sich anstellen","to queue"],["Bademantel","bathrobe"],["verschlafen","sleepy"],["seit ich denken kann","for as long as I can remember"],["Der Nächste, bitte!","Next, please!"],["Laugenbrötchen","pretzel roll"],["Körner","grains, seeds"],["Mohn","poppy seed"],["den Tisch decken","to lay the table"],["läuten","to ring (bells)"]],"q":[["Was sind Sonntagsbrötchen?","Frische Brötchen am Sonntagmorgen – ein Ritual.","Lange Schlange."],["Wie wählt Ivan?","Von jeder Sorte eins.","Er kennt die Namen nicht."],["Was zeigt das Ende?","Die Verkäuferin kennt seine Bestellung; er fühlt sich zu Hause.","Ritual als Heimat."]],"teaser":"Sonntagmorgen, eine Schlange vor der Bäckerei und ein Ritual, das zur Heimat wird.","words":152},{"id":"vorlesen","title":"Gute-Nacht-Geschichte","level":"B2","topic":"Familie · Sprache","min":2,"p":["„Papa, das heißt nicht ‚der Maus', das heißt ‚die Maus'“, sagte Sara, sechs Jahre alt, und zeigte auf das Bild im Buch.","Abdul seufzte. Seine Tochter ging seit drei Jahren in den deutschen Kindergarten. Ihr Deutsch war inzwischen besser als seins.","„Danke, Lehrerin“, sagte er und las weiter. „Die Maus … geht in den Wald.“","„Läuft“, sagte Sara. „Mäuse laufen. Und es heißt ‚in den Wald hinein'.“","„Du bist sehr streng.“","„Frau Weber sagt, man muss genau sein.“","Abdul legte das Buch weg. „Weißt du was? Heute liest du mir vor.“","Sara las. Langsam, mit dem Finger unter den Zeilen. Bei schwierigen Wörtern buchstabierte sie. Abdul hörte zu und lernte. „Igel“, „Eichhörnchen“, „Höhle“.","Ab da lasen sie abwechselnd. Einen Abend er, einen Abend sie. Wenn er Fehler machte, korrigierte sie. Wenn sie ein Wort nicht kannte, schlugen sie es zusammen nach.","Nach einem Jahr sagte seine Kollegin: „Dein Deutsch ist so viel besser geworden. Hast du einen Kurs gemacht?“","„Ja“, sagte Abdul. „Bei einer sehr strengen Lehrerin. Sie ist sieben.“"],"g":[["vorlesen","to read aloud"],["Gute-Nacht-Geschichte","bedtime story"],["streng","strict"],["genau","precise"],["Zeile","line"],["buchstabieren","to spell"],["Igel","hedgehog"],["Eichhörnchen","squirrel"],["Höhle","cave"],["abwechselnd","taking turns"],["nachschlagen","to look up"]],"q":[["Warum korrigiert Sara ihren Vater?","Ihr Deutsch ist durch den Kindergarten besser.","Artikel und Verben."],["Was ändert Abdul?","Sie lesen abwechselnd vor.","Gemeinsames Lernen."],["Wer ist die „strenge Lehrerin“?","Seine siebenjährige Tochter.","Pointe."]],"teaser":"Ein Vater liest seiner Tochter auf Deutsch vor – und sie korrigiert ihn.","words":170},{"id":"hund","title":"Hundebegegnung","level":"B2","topic":"Haustiere · Angst","min":2,"p":["Seit ihrer Kindheit hatte Nasrin Angst vor Hunden. In Deutschland gab es überall Hunde. Im Park, im Bus, sogar im Restaurant.","An einem Morgen kam ihr ein riesiger schwarzer Hund entgegen. Ohne Leine. Nasrin blieb stehen, erstarrt.","Der Besitzer, ein Mann mit Mütze, sah es sofort. „Bruno, hier! Sitz!“ Der Hund setzte sich. Der Mann nahm ihn an die Leine. „Entschuldigung. Haben Sie Angst?“","„Ja. Sehr.“","„Das tut mir leid. Er hätte an der Leine sein müssen. Er ist harmlos, aber das können Sie nicht wissen.“","Nasrin war überrascht. Sie hatte erwartet, dass er sagen würde: „Der tut nichts.“","„Wollen Sie ihn kennenlernen? Nur wenn Sie möchten. Langsam.“","Sie zögerte. Dann nickte sie. Der Mann hielt Bruno fest. Nasrin streckte langsam die Hand aus. Bruno schnupperte und legte den Kopf auf ihre Hand. Er war warm.","Danach trafen sie sich oft im Park. Bruno lief immer zu ihr, an der Leine. Nach einem halben Jahr streichelte Nasrin auch andere Hunde. Vorsichtig. Aber ohne Angst."],"g":[["Kindheit","childhood"],["entgegenkommen","to come towards"],["Leine","lead, leash"],["erstarrt","frozen"],["Besitzer","owner"],["Sitz!","Sit!"],["harmlos","harmless"],["Der tut nichts","he won't hurt you"],["schnuppern","to sniff"],["streicheln","to stroke"]],"q":[["Was macht der Besitzer richtig?","Er nimmt den Hund an die Leine und erkennt ihre Angst an.","Nicht „Der tut nichts“."],["Wie überwindet Nasrin die Angst?","Langsam, freiwillig, mit Bruno an der Leine.","Schrittweise."],["Was ist das Ergebnis?","Sie streichelt auch andere Hunde.","Ohne Angst."]],"teaser":"Eine Frau mit Angst vor Hunden, ein riesiger Hund im Park und ein Besitzer, der versteht.","words":164},{"id":"hochdeutsch","title":"„Ich schwätz koi Hochdeutsch“","level":"B2","topic":"Dialekt · Humor","min":2,"p":["Im Sprachkurs in Berlin hatte Chen perfektes Hochdeutsch gelernt. Dann zog er für einen Job nach Stuttgart.","Am ersten Tag sagte ein Kollege: „Hosch du scho gveschpert?“","Chen verstand kein Wort. „Entschuldigung?“","„Ob du schon Vesper gemacht hast. Gegessen. Brotzeit.“","Beim Bäcker sagte die Verkäuferin: „A Weckle oder a Brezel?“ Chen sagte: „Ein … was?“ „Brötchen“, übersetzte jemand hinter ihm.","Abends rief er seine Deutschlehrerin aus Berlin an. „Ich verstehe hier niemanden. Habe ich das falsche Deutsch gelernt?“","Sie lachte. „Nein. Du hast die Grundlage gelernt. Der Dialekt ist das Gewürz.“","Chen kaufte ein Buch: „Schwäbisch für Reigschmeckte“. Reigschmeckte, lernte er, heißt Zugezogene. Er lernte: Weckle, Gsälz (Marmelade), schaffe (arbeiten), Grombiera (Kartoffeln).","Ein Jahr später sagte er beim Bäcker: „Zwoi Weckle und a Brezel, bitte.“ Die Verkäuferin schaute ihn überrascht an. Dann sagte sie auf Hochdeutsch, ganz langsam: „Möchten Sie auch eine Tüte?“ Sie hatte ihm die schwäbischen Sätze einfach nicht geglaubt."],"g":[["Hosch","(Swabian) hast du"],["vespern","(Swabian) to have a snack"],["Brotzeit","snack, light meal"],["Weckle","(Swabian) bread roll"],["übersetzen","to translate"],["Grundlage","foundation"],["Gewürz","spice"],["Reigschmeckter","(Swabian) newcomer"],["Gsälz","(Swabian) jam"],["Grombiera","(Swabian) potatoes"],["Tüte","bag"]],"q":[["Warum versteht Chen niemanden?","In Stuttgart sprechen viele Schwäbisch.","Er lernte Hochdeutsch in Berlin."],["Was sagt die Lehrerin?","Hochdeutsch ist die Grundlage, Dialekt das Gewürz.","Kein falsches Deutsch."],["Was ist der Witz am Ende?","Die Verkäuferin antwortet auf Hochdeutsch.","Sie glaubt ihm sein Schwäbisch nicht."]],"teaser":"Ein Kurs in Hochdeutsch, und dann eine Stadt, in der niemand so spricht.","words":152},{"id":"jahr","title":"Ein Jahr später","level":"C1","topic":"Ankommen · Rückblick","min":5,"p":["Am 30. Oktober, genau ein Jahr nach ihrer Ankunft, saß Saba am Fenster ihrer Wohnung und trank Tee. Draußen fiel Nieselregen auf die Dächer. Vor einem Jahr hätte sie das Wort „Nieselregen“ nicht gekannt. Heute benutzte sie es, ohne nachzudenken.","Sie nahm ihr Notizbuch aus dem Regal, das erste, das sie in Deutschland gekauft hatte. Auf der ersten Seite stand in vorsichtiger Schrift: „Ich hätte gern einen Termin.“ Darunter: „Können Sie das bitte wiederholen?“ Und: „Entschuldigung, ich bin neu hier.“ Sie musste lächeln. Diese drei Sätze hatte sie in den ersten Wochen hundertmal gesagt.","Weiter hinten im Notizbuch wurden die Einträge länger, mutiger, manchmal falsch. „Ich bin heute total fertig“ stand da, mit einem Ausrufezeichen. „Mahlzeit sagt man auch ohne Essen“, mit drei Fragezeichen. „Halt = so ist es eben“. Und, unterstrichen: „Nie wieder einfach Ja sagen, wenn ich nichts verstehe.“","Sie dachte an die Fehler. An den Tag, an dem sie beim Bäcker „Ich bin warm“ gesagt hatte statt „Mir ist warm“, und die Verkäuferin rot geworden war. An die Mail an ihren Chef, in der sie aus Versehen „Liebe Herr Groß“ geschrieben hatte. An die Kehrwoche, die sie zweimal vergessen hatte, bis Frau Haug ihr einen Kuchen brachte und dabei ganz nebenbei das Schild zurechtrückte.","Aber sie dachte auch an die Menschen. An die Kollegin, die ihr erklärt hatte, warum man an seinem eigenen Geburtstag Kuchen mitbringt. An den Nachbarn mit der Schneeschaufel. An die ältere Frau im Zug, die ihr Maultaschen angeboten hatte, und mit der sie heute noch manchmal telefonierte.","Am Nachmittag traf sie sich mit ihrer Freundin Lea im Café. „Und?“, fragte Lea. „Wie fühlt sich ein Jahr an?“","Saba überlegte. „Am Anfang dachte ich, ich lerne Deutsch, um hier zu leben. Jetzt merke ich: Ich lebe hier, und dabei lerne ich Deutsch. Das ist ein Unterschied.“","Lea nickte langsam. „Das ist ein ziemlich schöner Satz. Auf Deutsch.“","„Ich weiß“, sagte Saba. „Ich hab ihn heute Morgen geübt.“","Sie lachten beide. Dann bestellte Saba noch einen Kaffee, auf Deutsch, ohne Zettel, ohne nachzudenken, und merkte es erst, als die Tasse vor ihr stand."],"g":[["Rückblick","look back, review"],["Nieselregen","drizzle"],["Regal","shelf"],["Eintrag","entry"],["mutig","brave"],["Ausrufezeichen","exclamation mark"],["unterstreichen","to underline"],["Mir ist warm","I feel warm"],["aus Versehen","by mistake"],["zurechtrücken","to straighten, adjust"],["anbieten","to offer"],["üben","to practise"]],"q":[["Was findet Saba in ihrem ersten Notizbuch?","Die ersten Sätze, die sie in Deutschland gebraucht hat.","„Ich hätte gern einen Termin.“"],["Welche Fehler erinnert sie?","„Ich bin warm“ statt „Mir ist warm“, „Liebe Herr Groß“, die vergessene Kehrwoche.","Fehler gehören zum Lernen."],["Was ist der Unterschied, den sie Lea erklärt?","Früher lernte sie Deutsch, um hier zu leben – jetzt lebt sie hier und lernt dabei Deutsch.","Sprache folgt dem Leben."],["Was zeigt das Ende?","Sie bestellt ohne nachzudenken auf Deutsch.","Die Sprache ist ein Stück ihre eigene geworden."]],"teaser":"Die letzte Geschichte des Buches: Ein Jahr nach der Ankunft schaut Saba zurück – auf Fehler, Freunde und die Sprache, die langsam ihre eigene wird.","words":348},{"id":"abend","title":"Feierabend auf dem Balkon","level":"B2","topic":"Alltag · Ruhe","min":3,"p":["Es war ein warmer Abend im Juni. Daniel saß auf seinem Balkon mit einem kalten Getränk und tat nichts. Auf dem Nachbarbalkon goss Frau Kessler ihre Tomaten.","„Schöner Abend, gell?“, sagte sie.","„Ja, wunderbar. Endlich mal warm.“","„Die Tomaten mögen's auch. Schauen Sie, die erste wird schon rot.“ Sie zeigte stolz auf eine kleine Tomate.","„Die ist ja schön. Wie lange haben Sie die schon?“","„Seit April. Jedes Jahr sag ich, nächstes Jahr pflanz ich keine mehr, so viel Arbeit. Und jedes Jahr pflanz ich wieder welche.“","Daniel lachte. „Das kenne ich. So geht's mir mit dem Joggen.“","Sie redeten zwanzig Minuten. Über das Wetter, über die Baustelle an der Ecke, die seit zwei Jahren nicht fertig wurde, über den Hund vom dritten Stock, der jeden Morgen um sechs bellte. Nichts davon war wichtig. Und doch fühlte sich Daniel danach leichter.","Als die Sonne unterging, reichte Frau Kessler ihm die kleine rote Tomate über das Geländer. „Hier. Die erste ist für Sie. Weil Sie immer so freundlich grüßen.“","Daniel aß sie sofort. Sie war warm von der Sonne und schmeckte nach Sommer. „Die beste Tomate meines Lebens“, sagte er.","„Das sagen alle“, sagte Frau Kessler zufrieden. „Gute Nacht, Herr Daniel.“","„Gute Nacht, Frau Kessler.“","Er blieb noch eine Weile sitzen, im Dunkeln, und dachte, dass Small Talk vielleicht gar nicht so klein ist."],"g":[["Feierabend","end of the working day, evening off"],["gießen","to water"],["gell?","(southern German) isn't it?"],["stolz","proud"],["pflanzen","to plant"],["Baustelle","construction site"],["bellen","to bark"],["leichter","lighter"],["Geländer","railing"],["grüßen","to greet"],["zufrieden","content"],["eine Weile","a while"]],"q":[["Worüber reden die beiden?","Über Wetter, Tomaten, die Baustelle und den Hund – nichts Wichtiges.","Typischer Small Talk."],["Was sagt Frau Kessler jedes Jahr?","Dass sie nächstes Jahr keine Tomaten mehr pflanzt – und tut es doch.","Daniel kennt das vom Joggen."],["Warum schenkt sie ihm die erste Tomate?","Weil er immer freundlich grüßt.","Kleine Gesten zählen."],["Was erkennt Daniel am Ende?","Small Talk ist gar nicht so klein.","Er verbindet Menschen."]],"teaser":"Ein ganz normaler Abend, eine Nachbarin am Nachbarbalkon und ein Gespräch über nichts – und genau das ist der Punkt.","words":223}],"lex":[["Rücksprache halten","Rücksprache halten","to consult, to check back with someone","","hält Rücksprache hielt Rücksprache hat Rücksprache gehalten haben"],["nachvollziehen","nachvollziehen","to understand (someone's reasoning), to trace","","vollzieht nach vollzog nach hat nachvollzogen haben"],["Zuständigkeit","die Zuständigkeit","responsibility, remit","die Zuständigkeiten",""],["veranlassen","veranlassen","to arrange for, to initiate","","veranlasst veranlasste hat veranlasst haben" <script>
const DB=window.__LB__,$=s=>document.querySelector(s);
const st={get:(k,d)=>{try{return JSON.parse(localStorage.getItem('lb_'+k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem('lb_'+k,JSON.stringify(v))}catch{}}};
let done=st.get('done',[]),saved=st.get('saved',{}),font=st.get('font',1.12),cur=null;
document.documentElement.dataset.theme=st.get('theme','light');
const esc=x=>String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const norm=x=>x.toLowerCase().replace(/[^a-zäöüß]/g,'');
// lexicon index
const IDX=new Map();const add=(k,e)=>{k=norm(k);if(k.length<2)return;if(!IDX.has(k))IDX.set(k,[]);IDX.get(k).push(e)};
for(const[l,d,m,pl,f]of DB.lex){const e={d,m};add(l,e);if(pl)add(pl.replace(/^die /,''),e);for(const x of (f+' '+l).split(/\s+/))if(x.length>3&&!['hat','ist'].includes(x))add(x,e)}
const SUF=['ern','en','er','es','em','e','n','s','t','st','te','ten','et'];
function lexLook(w){const n=norm(w);let r=IDX.get(n);if(r)return r;for(const s of SUF)if(n.endsWith(s)&&n.length>s.length+2){r=IDX.get(n.slice(0,-s.length))||IDX.get(n.slice(0,-s.length)+'en');if(r)return r}return null}
function glossFor(story,w){const n=norm(w),out=[];for(const[k,m]of story.g){const toks=k.split(/[\s,]+/).map(norm);if(toks.includes(n)||toks.some(t=>t.length>4&&(n.startsWith(t.slice(0,-1))||t.startsWith(n.slice(0,-1))&&n.length>4)))out.push([k,m])}return out}
// audio
let voice=null;function voices(){if(!('speechSynthesis'in window))return;const v=speechSynthesis.getVoices().filter(x=>/^de/i.test(x.lang));voice=v.find(x=>/Anna|Petra|Katja|Google/.test(x.name))||v[0]||null}
if('speechSynthesis'in window){speechSynthesis.onvoiceschanged=voices;voices()}
function say(t){if(!('speechSynthesis'in window))return alert('Keine Sprachausgabe verfügbar.');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=+$('#rate').value;if(voice)u.voice=voice;speechSynthesis.speak(u)}
let queue=[];function readAll(i){queue=cur.p.slice(i);next()}function next(){if(!queue.length)return;const t=queue.shift();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='de-DE';u.rate=+$('#rate').value;if(voice)u.voice=voice;u.onend=next;speechSynthesis.speak(u)}
function stop(){queue=[];try{speechSynthesis.cancel()}catch{}}
// views
function lib(){cur=null;stop();$('#home').hidden=true;$('#pop').style.display='none';
 const byL=['B2','C1','C2'];
 $('#app').innerHTML=`<div class="card"><h1 style="margin:.1em 0">Geschichten zum Eintauchen</h1><p class="muted">${DB.stories.length} lange Geschichten · ${DB.stories.reduce((a,s)=>a+s.words,0).toLocaleString('de-DE')} Wörter · ${done.length} gelesen<br>Tippen Sie auf jedes Wort für Bedeutung und Aussprache. Gepunktet unterstrichen = Wort aus dem Glossar.</p></div>`+
 byL.map(L=>{const l=DB.stories.filter(s=>s.level===L);return l.length?`<h2>${L}</h2>`+l.map(s=>`<div class="card"><span class="tag">${s.level}</span><span class="tag">${esc(s.topic)}</span><span class="small muted">${s.min} Min · ${s.words} Wörter ${done.includes(s.id)?'· <span class="done">✓ gelesen</span>':''}</span><h3 style="margin:.4em 0 .2em">${esc(s.title)}</h3><p class="muted" style="margin:0 0 .6em">${esc(s.teaser)}</p><button class="pri" data-open="${s.id}">Lesen</button></div>`).join(''):''}).join('')+
 (Object.keys(saved).length?`<div class="card"><h2>★ Meine Wörter (${Object.keys(saved).length})</h2><div class="gl">${Object.entries(saved).map(([k,m])=>`<div><b>${esc(k)}</b> <button class="pp" data-say="${esc(k)}">🔊</button><br><span class="small muted">${esc(m)}</span></div>`).join('')}</div></div>`:'');scrollTo(0,0)}
function open(id){cur=DB.stories.find(s=>s.id===id);$('#home').hidden=false;const gk=new Set();for(const[k]of cur.g)for(const t of k.split(/[\s,]+/))if(t.length>3)gk.add(norm(t));
 const wrap=t=>esc(t).replace(/([A-Za-zÄÖÜäöüß][A-Za-zÄÖÜäöüß-]*)/g,m=>`<span class="w${gk.has(norm(m))?' g':''}" data-w="${m}">${m}</span>`);
 $('#app').innerHTML=`<div class="bar"><button class="pri" id="all">▶ Alles vorlesen</button><button id="stop">■</button><button id="fm">A−</button><button id="fp">A+</button><span class="small muted">${cur.min} Min</span></div>
 <article class="card story" style="font-size:${font}rem"><h1 style="font-family:inherit;margin:.1em 0">${esc(cur.title)}</h1><p class="muted" style="font-style:italic">${esc(cur.teaser)}</p>
 ${cur.p.map((p,i)=>`<p><button class="pp" data-from="${i}">▶</button>${wrap(p)}</p>`).join('')}</article>
 <div class="card"><h2>Glossar</h2><div class="gl">${cur.g.map(([k,m])=>`<div><b>${esc(k)}</b> <button class="pp" data-say="${esc(k)}">🔊</button><br><span class="small muted">${esc(m)}</span></div>`).join('')}</div></div>
 <div class="card"><h2>Verständnis</h2>${cur.q.map(([q,a,w])=>`<details><summary>${esc(q)}</summary><p><b>${esc(a)}</b></p><p class="small muted">${esc(w)}</p></details>`).join('')}</div>
 <div class="card"><h2>Nacherzählen</h2><p class="small muted">Erzählen Sie die Geschichte laut in 2 Minuten nach – benutzen Sie mindestens 5 Wörter aus dem Glossar.</p><textarea id="note" rows="5" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--paper);color:var(--ink)">${esc(st.get('note_'+id,''))}</textarea>
 <p><button class="pri" id="fin">${done.includes(id)?'✓ Gelesen':'Als gelesen markieren'}</button></p></div>`;scrollTo(0,0)}
function pop(w,el){document.querySelectorAll('.w.on').forEach(x=>x.classList.remove('on'));el.classList.add('on');
 const g=glossFor(cur,w),l=lexLook(w)||[];let body='';
 if(g.length)body+=g.map(([k,m])=>`<p><b>${esc(k)}</b><br><span class="m">${esc(m)}</span> <button class="pp" style="float:none" data-sv="${esc(k)}|${esc(m)}">☆ merken</button></p>`).join('');
 if(l.length)body+=l.slice(0,2).map(e=>`<p><b>${esc(e.d)}</b><br><span class="m">${esc(e.m)}</span> <button class="pp" style="float:none" data-sv="${esc(e.d)}|${esc(e.m)}">☆ merken</button></p>`).join('');
 if(!body)body=`<p class="muted small">Nicht im Glossar.</p>`;
 $('#pop').innerHTML=`<div style="display:flex;gap:8px;align-items:center"><h3 style="flex:1">${esc(w)}</h3><button data-say="${esc(w)}">🔊</button><button id="x">✕</button></div>${body}<p class="small"><a target="_blank" rel="noopener" href="https://dict.leo.org/englisch-deutsch/${encodeURIComponent(w)}">Im Wörterbuch (LEO) nachschlagen ↗</a></p>`;
 $('#pop').style.display='block';say(w)}
document.addEventListener('click',e=>{const t=e.target,c=s=>t.closest(s);let x;
 if(x=c('[data-open]'))return open(x.dataset.open);
 if(x=c('.w'))return pop(x.dataset.w,x);
 if(x=c('[data-say]'))return say(x.dataset.say);
 if(x=c('[data-from]'))return readAll(+x.dataset.from);
 if(x=c('[data-sv]')){const[k,m]=x.dataset.sv.split('|');saved[k]=m;st.set('saved',saved);x.textContent='★ gemerkt';return}
 ({home:lib,x:()=>{$('#pop').style.display='none'},all:()=>readAll(0),stop,
  fp:()=>{font=Math.min(1.6,font+.08);st.set('font',font);document.querySelector('.story').style.fontSize=font+'rem'},
  fm:()=>{font=Math.max(.9,font-.08);st.set('font',font);document.querySelector('.story').style.fontSize=font+'rem'},
  fin:()=>{if(!done.includes(cur.id))done.push(cur.id);st.set('done',done);t.textContent='✓ Gelesen'},
  theme:()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;st.set('theme',n)}}[t.id]||(()=>{}))()});
document.addEventListener('input',e=>{if(e.target.id==='note')st.set('note_'+cur.id,e.target.value)});
lib();
</script></body></html>
