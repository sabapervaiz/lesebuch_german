<script>window.__LB__={"stories":[{"id":"wg","title":"Sechs Leute, ein Kühlschrank","level":"B2","topic":"Wohnen · Alltag","min":12,"p":["Die Anzeige war kurz gewesen: „Netter WG-Zimmer in Heslach, 16 qm, ab 1. September, 480 warm. Wir sind zu fünft, kochen manchmal zusammen und mögen Leute, die nicht nur im Zimmer hocken.“ Nilay hatte sie dreimal gelesen, bevor sie schrieb. Was genau bedeutete „hocken“? Und warum stand da „Netter Zimmer“ und nicht „Nettes Zimmer“? Sie beschloss, sich nicht an einem Tippfehler aufzuhalten, und schickte eine Nachricht, die sie vorher zweimal von einer Freundin hatte korrigieren lassen.","Zwei Tage später saß sie in einer Küche, die gleichzeitig Wohnzimmer, Büro und Fahrradwerkstatt zu sein schien. Auf dem Tisch standen eine Kanne Tee, ein angeschnittener Zwetschgenkuchen und ein Laptop, auf dem jemand eine Tabelle mit dem Namen „Putzplan – diesmal ernsthaft“ geöffnet hatte.","„Also, erzähl mal ein bisschen von dir“, sagte Jonas, ein großer Typ mit Wollmütze, obwohl draußen fünfundzwanzig Grad waren. „Was machst du so, wenn du nicht arbeitest?“","Nilay hatte sich auf diese Frage vorbereitet. Sie erzählte, dass sie in der IT arbeite, gern wandere und gerade versuche, ihr Deutsch zu verbessern. „Ich verstehe fast alles, wenn man langsam spricht“, sagte sie. „Aber wenn alle durcheinanderreden, bin ich manchmal raus.“","„Oh, dann bist du hier genau richtig“, lachte Pia, die auf der Fensterbank saß. „Bei uns reden alle durcheinander. Immer.“","„Und wie stehst du zum Thema Putzen?“, fragte Jonas mit gespieltem Ernst. „Das ist nämlich die wichtigste Frage. Unser letzter Mitbewohner hat in acht Monaten genau einmal das Bad geputzt. Und das auch nur, weil seine Mutter zu Besuch kam.“","„Ich putze nicht gern“, sagte Nilay ehrlich, „aber ich mach's. Und ich halte mich an Pläne.“","Für einen Moment war es still. Dann klatschte Pia in die Hände. „Ehrlichkeit! Endlich mal jemand, der nicht behauptet, dass Putzen sein Hobby ist.“","Am Abend kam eine Nachricht: „Hey Nilay, wir fänden's mega, wenn du einziehst. Sag einfach Bescheid, ob du noch Lust hast. LG Pia.“ Nilay starrte eine Weile auf das Wort „mega“, dann auf „LG“, und musste beides nachschlagen.","Die erste Woche war anstrengend auf eine Art, die sie nicht erwartet hatte. Nicht die Arbeit war das Problem, sondern die Küche. Jeden Abend saßen dort zwei, drei Leute und redeten, und Nilay verstand jedes einzelne Wort, aber nicht, worüber eigentlich gesprochen wurde. „Hat jemand den Ofen ausgemacht?“ – „Klar, hab ich doch.“ – „Echt jetzt? Der war noch warm.“ – „Ja, weil er halt gerade erst aus war, Mann.“","Diese kleinen Wörter machten sie verrückt: halt, doch, mal, eben, ja. Sie standen in jedem zweiten Satz, und keines davon hatte im Kurs eine richtige Bedeutung bekommen. Am Mittwoch fragte sie Pia direkt.","„Was heißt eigentlich ‚halt'? Du sagst das ständig.“","Pia überlegte. „Puh. Das heißt … so ist es eben. Man kann nichts machen. Wenn ich sage ‚Der Bus ist halt weg', dann meine ich: Pech, ist so.“","„Und ‚doch'?“","„Das ist schwieriger. Wenn du sagst ‚Komm doch mit', dann klingt das freundlicher als ‚Komm mit'. Und wenn jemand sagt ‚Du warst nicht da', und du sagst ‚Doch!', dann heißt es, dass er unrecht hat.“","Nilay schrieb alles in ihr Handy. In den nächsten Tagen fing sie an, auf diese Wörter zu achten, und merkte, dass sie überall waren: im Bus, in der Kantine, sogar in den Nachrichten. Am Freitag sagte sie zum ersten Mal selbst „Ist halt so“, als Jonas sich über den Regen beschwerte. Er schaute sie an und grinste. „Na, du bist ja schon richtig angekommen.“","Die erste echte Prüfung kam in der dritten Woche. Im Kühlschrank fehlte Nilays Käse. Nicht ein Stück, sondern der ganze teure Bergkäse, den sie vom Wochenmarkt mitgebracht hatte. Sie ärgerte sich, schrieb aber nichts in die Gruppe, weil sie nicht wusste, wie man so etwas auf Deutsch sagt, ohne beleidigt zu klingen.","Beim Abendessen sprach Pia es selbst an. „Leute, mir ist aufgefallen, dass bei mir Sachen fehlen. Und bei Nilay wohl auch, oder?“","Nilay nickte. „Mein Käse ist weg. Ich will niemandem was unterstellen, aber …“","„Oh nein“, sagte Tim leise, der bisher kaum etwas gesagt hatte. „Das war ich. Ich dachte, das ist der Gemeinschaftskäse. Der lag im mittleren Fach. Sorry, ehrlich. Ich kauf dir morgen einen neuen.“","Und plötzlich ging es nicht mehr um Käse, sondern um das mittlere Fach. Es stellte sich heraus, dass jeder eine andere Vorstellung davon hatte, was „gemeinsam“ war. Für Jonas waren Butter, Milch und Senf selbstverständlich für alle. Für Pia nur das, was ausdrücklich in der Gruppe angekündigt wurde. Tim hatte geglaubt, alles im mittleren Fach sei frei. Nach einer halben Stunde Diskussion beschlossen sie eine neue Regel: Jeder bekommt ein eigenes Fach mit Namen, und das mittlere Fach ist Gemeinschaftsfach – aber nur für Sachen, die jemand mit einem gelben Zettel markiert.","„Typisch deutsch“, sagte Jonas. „Wir lösen ein Käseproblem mit einem Zettelsystem.“","„Funktioniert aber“, sagte Pia.","„Ja, eben“, sagte Nilay, und alle lachten, weil sie das Wort genau richtig benutzt hatte.","Vier Wochen nach dem Einzug saß Nilay an einem Sonntagabend allein in der Küche und schrieb ihrer Mutter. Sie erzählte vom Käse, vom Putzplan und von den kleinen Wörtern. Dann las sie die Nachricht noch einmal und merkte, dass sie aus Versehen „halt“ in einen türkischen Satz geschrieben hatte. Sie ließ es stehen."],"g":[["hocken","to sit around (colloquial)"],["Tippfehler","typo"],["Putzplan","cleaning rota"],["durcheinanderreden","to talk over each other"],["mega","great, awesome (slang)"],["LG","\"Liebe Grüße\", best wishes"],["halt","(particle) that's just how it is"],["doch","(particle) softens a request; contradicts a negative"],["Echt jetzt","Seriously?"],["Pech","bad luck"],["angekommen","settled in, arrived (figuratively)"],["unterstellen","to insinuate, accuse"],["Fach","shelf, compartment"],["ausdrücklich","explicitly"],["aus Versehen","by mistake"],["Zwetschgenkuchen","plum cake"]],"q":[["Warum hatte Nilay Probleme in der Küche, obwohl sie jedes Wort verstand?","Sie verstand nicht, worüber eigentlich gesprochen wurde – Tempo, Modalpartikeln, Durcheinander.","Alltagssprache ist mehr als Wortschatz."],["Wie erklärt Pia das Wort „halt“?","So ist es eben, man kann nichts machen.","Beispiel: Der Bus ist halt weg."],["Was war das eigentliche Problem beim Käse?","Jeder hatte eine andere Vorstellung davon, was „gemeinsam“ ist.","Nicht Diebstahl, sondern unklare Regeln."],["Welche Regel beschließt die WG?","Eigene Fächer mit Namen; im Gemeinschaftsfach nur Sachen mit gelbem Zettel.","„Typisch deutsch“, sagt Jonas."],["Was zeigt das Ende der Geschichte?","Die deutschen Partikeln sind so selbstverständlich geworden, dass sie sogar ins Türkische rutschen.","Sie ist angekommen."]],"teaser":"Nilay zieht in eine WG in Stuttgart-Heslach – und lernt in vier Wochen mehr Alltagsdeutsch als in zwei Jahren Kurs.","words":862},{"id":"zug","title":"Endstation Plochingen","level":"B2","topic":"Reisen · Bahn","min":11,"p":["„Sehr geehrte Fahrgäste, aufgrund einer Störung im Betriebsablauf endet dieser Zug heute in Plochingen. Bitte beachten Sie die Durchsagen am Bahnsteig. Wir bitten um Ihr Verständnis.“","Arjun nahm die Kopfhörer ab und schaute aus dem Fenster. Plochingen. Er wusste nicht genau, wo das war, nur dass es nicht Ulm war, wo er um halb zehn ankommen sollte. Neben ihm seufzte eine ältere Frau mit einem riesigen Koffer und einem Karton, aus dem Basilikum herausschaute.","„Na super“, sagte sie, mehr zu sich selbst als zu ihm. „Das dritte Mal diesen Monat.“","„Wissen Sie, wie es weitergeht?“, fragte Arjun.","„Keine Ahnung, junger Mann. Das weiß die Bahn wahrscheinlich auch nicht.“ Sie lachte trocken. „Wo müssen Sie denn hin?“","„Nach Ulm.“","„Ich auch. Na, dann leiden wir eben gemeinsam. Ich bin übrigens Renate.“","Auf dem Bahnsteig standen etwa zweihundert Menschen im Nieselregen und schauten auf eine Anzeigetafel, auf der nur stand: „Information folgt“. Ein Bahnmitarbeiter in orangefarbener Weste versuchte, von allen Seiten gleichzeitig Fragen zu beantworten.","Renate drängte sich mit erstaunlicher Energie nach vorne, Arjun folgte ihr mit ihrem Koffer, den er ihr ungefragt abgenommen hatte. „Entschuldigung“, sagte sie laut und deutlich, „wir müssen nach Ulm. Gibt's einen Ersatzverkehr oder nicht?“","Der Mann wischte sich den Regen aus dem Gesicht. „Ersatzbusse sind angefordert. Wann die kommen, kann ich Ihnen nicht sagen. Alternativ fährt um 21:40 ein Regionalzug über Göppingen, der hält aber überall.“","„Überall“, wiederholte Renate. „Wunderbar. Dann sehen wir wenigstens was von der Landschaft. Im Dunkeln.“","Sie entschieden sich für den Regionalzug. Er war so voll, dass sie im Gang standen, zwischen einem Kinderwagen und einer Gruppe Fußballfans, die laut und falsch sangen. Arjun verstand von den Liedern kein Wort. Renate schon. „Das ist Schwäbisch und Alkohol“, erklärte sie. „Das verstehen nicht mal die Schwaben.“","In Göppingen wurde ein Sitzplatz frei, und Renate bestand darauf, dass Arjun sich setzt. „Sie haben meinen Koffer geschleppt. Ich bin alt, aber nicht undankbar.“ Er weigerte sich. Am Ende saß niemand, und der Platz blieb bis zur nächsten Station leer, weil keiner von beiden nachgeben wollte. Eine Frau gegenüber schüttelte lächelnd den Kopf.","Zwischen Göppingen und Geislingen erzählte Renate, dass sie aus Esslingen komme und ihre Tochter in Ulm besuche, die gerade ein Baby bekommen habe. Das Basilikum sei für sie. „Sie kocht nicht, aber sie sagt immer, ein Basilikum in der Küche fühlt sich nach Familie an.“ Arjun erzählte, dass er seit einem Jahr als Ingenieur bei einem Zulieferer arbeite und an den Wochenenden Freunde in Ulm besuche, weil er in Stuttgart noch nicht viele Leute kenne.","„Das kommt noch“, sagte Renate. „Die Schwaben brauchen halt ein bisschen. Erst sind sie misstrauisch, und dann laden sie dich zu ihrer Hochzeit ein.“","In Geislingen dann die nächste Durchsage: Wegen eines Polizeieinsatzes auf der Strecke verzögere sich die Weiterfahrt auf unbestimmte Zeit. Der ganze Wagen stöhnte. Einer der Fußballfans rief: „Jetzt reicht's aber!“, und zum ersten Mal an diesem Abend waren sich alle einig.","Renate holte eine Dose aus ihrem Karton. Darin waren Maultaschen, eigentlich für die Tochter. „Die isst sie eh nicht alle“, sagte sie und bot Arjun eine an, dann der Frau gegenüber, dann den Fußballfans, die plötzlich sehr höflich wurden.","„Wie sagt man eigentlich, wenn etwas total schiefgeht?“, fragte Arjun. „Also auf Deutsch, umgangssprachlich?“","Renate überlegte. „Da gibt's viele Möglichkeiten. ‚Das ist ja wohl ein schlechter Witz.' Oder: ‚Da läuft heute aber auch alles schief.' Oder, wenn man richtig sauer ist: ‚Ich glaub, ich spinne.'“","„Ich glaub, ich spinne“, wiederholte Arjun langsam.","„Genau. Aber nicht zum Chef sagen.“","Um 23:52 Uhr fuhr der Zug endlich in Ulm ein, zwei Stunden und zweiundzwanzig Minuten zu spät. Auf dem Bahnsteig wartete eine junge Frau mit einem Kinderwagen und winkte. Renate drückte Arjun einen Zettel in die Hand. „Meine Nummer. Wenn Sie mal in Esslingen sind, kommen Sie vorbei. Ich mache bessere Maultaschen als diese hier, die waren nur für den Notfall.“","Zwei Wochen später saß Arjun tatsächlich in Renates Küche in Esslingen, zusammen mit ihrem Mann, ihrem Nachbarn und einem Basilikum auf der Fensterbank. Sie hatte nicht übertrieben: Die Maultaschen waren besser. Und als er am Abend nach Hause fuhr, war sein Zug pünktlich. Er war fast ein bisschen enttäuscht.","Am nächsten Tag lud er das Fahrgastrechteformular herunter und bekam fünfundzwanzig Prozent seines Ticketpreises zurück. Das Geld gab er für eine Pflanze aus. Basilikum natürlich."],"g":[["Störung im Betriebsablauf","operational disruption (typical Bahn phrase)"],["Durchsage","announcement"],["Na super","(ironic) great, just great"],["Keine Ahnung","no idea"],["leiden","to suffer"],["Nieselregen","drizzle"],["Anzeigetafel","departure board"],["sich nach vorne drängen","to push to the front"],["ungefragt","without being asked"],["Ersatzverkehr","replacement service"],["schleppen","to lug, drag"],["nachgeben","to give in"],["misstrauisch","suspicious, wary"],["auf unbestimmte Zeit","indefinitely"],["Jetzt reicht's","That's enough now"],["eh","anyway (colloquial)"],["Ich glaub, ich spinne","I can't believe this (annoyed, informal)"],["für den Notfall","for emergencies"],["übertreiben","to exaggerate"]],"q":[["Warum endet der Zug in Plochingen?","Wegen einer Störung im Betriebsablauf.","Typische Bahnformulierung."],["Wie kommen Arjun und Renate weiter?","Mit einem Regionalzug über Göppingen, der überall hält.","Die Ersatzbusse hatten keine Zeit."],["Was sagt Renate über die Schwaben?","Sie brauchen ein bisschen, sind erst misstrauisch und laden dann zur Hochzeit ein.","Ein freundliches Klischee."],["Welche umgangssprachlichen Ausdrücke lernt Arjun?","„Das ist ja wohl ein schlechter Witz“, „Da läuft alles schief“, „Ich glaub, ich spinne“.","Letzteres nicht zum Chef sagen."],["Wie endet die Geschichte?","Arjun besucht Renate, bekommt Geld zurück und kauft davon Basilikum.","Aus einer Fremden wird eine Freundin."]],"teaser":"Ein Abend, an dem alles schiefgeht, was bei der Bahn schiefgehen kann – und eine Fremde, die zur Freundin wird.","words":719},{"id":"oma","title":"Oma Ilse lernt WhatsApp","level":"B2","topic":"Familie · Technik","min":10,"p":["Kemal arbeitete seit sechs Jahren im IT-Support. Er hatte Passwörter für Vorstände zurückgesetzt, Drucker überredet, die nichts mehr drucken wollten, und einmal einem Kollegen erklärt, dass der Bildschirm nicht kaputt sei, sondern nur ausgeschaltet. Er dachte, ihn könne nichts mehr überraschen. Dann klingelte Frau Ilse Brenner aus dem zweiten Stock.","„Herr Kemal“, sagte sie, und sie nannte ihn immer so, mit Vornamen und „Herr“ davor, „meine Enkelin hat mir ein Tablet geschenkt. Und jetzt soll ich das WhatsApp haben. Sie sagt, sonst sehe ich die Bilder vom Urlaub nicht.“","Sie hielt ihm das Gerät hin wie ein Tier, das beißen könnte.","„Kein Problem“, sagte Kemal. „Das haben wir in zehn Minuten.“","Es dauerte drei Wochen.","Am ersten Nachmittag scheiterte es am Einschalten. Frau Brenner drückte so kurz auf den Knopf, dass nichts passierte, und dann so lange, dass das Gerät sich wieder ausschaltete. „Es mag mich nicht“, sagte sie.","„Doch, doch“, sagte Kemal. „Es ist nur ein bisschen empfindlich. Wie ein Kaktus. Nicht zu viel, nicht zu wenig.“","Sie schaute ihn über ihre Brille an. „Herr Kemal, ich hatte siebenundzwanzig Jahre lang ein Blumengeschäft. Kakteen sind nicht empfindlich. Sie sind stur.“","Am zweiten Nachmittag ging es um das Wischen. Frau Brenner wischte, als würde sie einen Tisch abwischen: mit der ganzen Hand, kräftig und in Kreisen. Das Tablet öffnete drei Apps gleichzeitig und stellte die Sprache auf Portugiesisch. Kemal brauchte zwanzig Minuten, um es zurückzustellen, und Frau Brenner servierte ihm in der Zeit Kaffee und Rührkuchen.","„Wissen Sie“, sagte sie, während er suchte, „als ich jung war, hatten wir ein Telefon im Flur. Ein einziges, für die ganze Familie. Wenn der Freund anrief, stand der Vater daneben. Da hat man sich gut überlegt, was man sagt.“","„Das ist heute ein bisschen anders“, sagte Kemal.","„Ja. Heute sagt man alles, aber keiner hört zu.“","Am dritten Nachmittag schafften sie die Installation. Kemal erklärte jeden Schritt zweimal, und Frau Brenner schrieb alles in ein kleines Heft mit Blumenmuster: „1. Grünes Bild mit Telefon drücken. NICHT LANGE. 2. Auf Namen tippen. 3. Unten schreiben. 4. Pfeil drücken = abschicken.“","„Und wenn ich mich vertippe?“","„Dann drücken Sie auf das kleine Kreuz mit dem Pfeil. Das löscht den letzten Buchstaben.“","„Und wenn ich es schon abgeschickt habe?“","Kemal zögerte. „Dann … dann ist es halt abgeschickt.“","Sie nickte ernst. „Wie früher mit dem Brief. Einmal im Kasten, ist er weg.“","Die erste Nachricht, die Frau Brenner allein schrieb, ging an ihre Enkelin und lautete: „Liebe Sophie hier ist Oma Ilse das Tablet geht jetzt ich hoffe es ist schön in Italien“. Ohne Punkt und Komma, aber mit drei Blumen-Emojis, die sie zufällig gefunden hatte. Zwei Minuten später kam die Antwort: ein Foto vom Meer und das Wort „OMAAAA ❤️❤️❤️“. Frau Brenner hielt Kemal das Tablet hin, und er sah, dass sie Tränen in den Augen hatte.","„Sie schreibt mit vielen A“, sagte sie. „Das heißt, sie freut sich, oder?“","„Das heißt, sie freut sich sehr“, sagte Kemal.","Danach wurde es schwierig auf eine andere Art. Frau Brenner hatte das Schreiben entdeckt. Sie schrieb der Enkelin, der Tochter, dem Neffen in Kanada und einer Freundin aus dem Seniorentreff, die gar kein Smartphone hatte. Sie schrieb morgens um sechs und abends um elf. Sie schickte Fotos von ihrem Balkon, ihrem Mittagessen und, aus Versehen, vierzehn Fotos von ihrer Hand.","Und sie hatte Fragen. Viele Fragen. Warum zwei Haken grau sind und manchmal blau. Was eine Sprachnachricht ist und warum ihr Neffe ihr eine geschickt hat, die vier Minuten lang war und nur aus Hundegebell bestand. Was „lol“ bedeutet.","„Das heißt ‚laughing out loud'“, erklärte Kemal. „Also: Ich lache laut.“","„Warum schreibt man das, wenn man lacht? Dann soll man doch einfach lachen.“","Darauf hatte Kemal keine Antwort.","Nach drei Wochen kam der Moment, auf den er gewartet hatte: Frau Brenner rief nicht mehr an. Eine ganze Woche lang nicht. Am Samstag bekam er stattdessen eine Nachricht: „Lieber Herr Kemal, ich habe heute zum ersten Mal mit Sophie einen Videoanruf gemacht ganz allein. Das Baby von meiner Nichte habe ich auch gesehen. Vielen Dank für Ihre Geduld. Kommen Sie Sonntag zum Kuchen? Es gibt Zwetschgen. Ihre Ilse Brenner 🌸🌸🌸“","Kemal schrieb zurück: „Sehr gern! lol“","Die Antwort kam sofort: „Ich habe gelacht. Wirklich laut.“"],"g":[["Vorstand","board of directors"],["überreden","to persuade"],["hinhalten","to hold out (towards someone)"],["scheitern an","to fail because of"],["empfindlich","sensitive"],["stur","stubborn"],["wischen","to swipe; to wipe"],["Rührkuchen","pound cake"],["sich vertippen","to make a typo"],["abschicken","to send"],["zögern","to hesitate"],["Haken","tick, check mark"],["Sprachnachricht","voice message"],["Hundegebell","dog barking"],["Geduld","patience"],["Videoanruf","video call"]],"q":[["Warum dauerte die Schulung drei Wochen statt zehn Minuten?","Einschalten, Wischen und Grundfunktionen waren für Frau Brenner völlig neu.","Kemal unterschätzte die Aufgabe."],["Was erzählt Frau Brenner über das Telefon früher?","Ein Telefon im Flur für die ganze Familie; der Vater stand daneben.","Man überlegte genau, was man sagt."],["Womit vergleicht sie eine abgeschickte Nachricht?","Mit einem Brief im Briefkasten – einmal weg, ist er weg.","Sie verknüpft Neues mit Bekanntem."],["Welches neue Problem entsteht danach?","Sie schreibt ständig und hat sehr viele Fragen.","Begeisterung statt Angst."],["Was zeigt der Schluss?","Sie hat sogar den Witz mit „lol“ verstanden und ist selbstständig geworden.","Humor als Zeichen von Sicherheit."]],"teaser":"Ein IT-Supporter, seine 84-jährige Nachbarin und die schwierigste Schulung seines Lebens.","words":707},{"id":"besen","title":"Ein Abend im Besen","level":"B2","topic":"Essen · Kultur","min":11,"p":["„Im Besen sitzt man halt da, wo Platz ist“, sagte Lukas, als sie vor dem alten Bauernhaus in Uhlbach standen. Über der Tür hing tatsächlich ein Besen, ein ganz normaler Reisigbesen, kopfüber an einer Stange. „Das heißt: Hier ist geöffnet. Der Wengerter verkauft seinen eigenen Wein, und dazu gibt's einfaches Essen. Aber nur ein paar Wochen im Jahr.“","Elena nickte, obwohl sie „Wengerter“ nicht verstand. Sie war seit acht Monaten in Stuttgart und hatte sich vorgenommen, jede Einladung anzunehmen, auch wenn sie keine Ahnung hatte, worauf sie sich einließ.","Drinnen war es eng, warm und laut. An langen Holztischen saßen Menschen jeden Alters dicht nebeneinander. Es roch nach Zwiebeln, Bratkartoffeln und Wein. Eine Frau mit Schürze rief ihnen im Vorbeigehen zu: „Da hinten sind noch zwei Plätze, rutschet halt a bissle!“","Die beiden Plätze waren an einem Tisch, an dem schon vier Leute saßen: ein älteres Ehepaar, ein Mann mit Schnurrbart und eine junge Frau mit Laptoptasche. „Dürfen wir?“, fragte Lukas. „Freilich“, sagte der Mann mit Schnurrbart und rückte zur Seite. „Mir beißet net.“","Elena verstand den Satz erst, als Lukas ihn leise übersetzte: „Wir beißen nicht.“","Die Speisekarte war ein laminiertes Blatt mit sechs Gerichten. Lukas bestellte für beide: Zwiebelkuchen, Schupfnudeln mit Sauerkraut und ein Viertele Trollinger. „Ein Viertele ist ein Viertelliter“, erklärte er. „Das ist hier die normale Größe. Wer ein kleineres Glas bestellt, wird komisch angeschaut.“","„Ein Viertel Liter? Das ist viel.“","„Na ja. Man trinkt es langsam. Und isst viel dazu.“","Der Mann mit Schnurrbart, der sich als Herbert vorstellte, hatte zugehört. „Woher kommen Sie denn?“, fragte er Elena, diesmal in deutlichem Hochdeutsch, das er offenbar extra für sie auspackte.","„Aus Spanien. Aus Valencia.“","„Ah, Valencia! Da war ich 1987. Mit dem Wohnwagen. Wunderbar. Aber viel zu heiß.“ Er erzählte eine lange Geschichte über eine Reifenpanne, einen hilfsbereiten Bauern und eine Paella, die er nie vergessen habe. Seine Frau verdrehte die Augen. „Die Geschichte erzählt er jedem“, sagte sie zu Elena. „Jedem. Auch dem Postboten.“","Das ältere Ehepaar mischte sich ein. Sie stellten sich als Gerda und Walter vor, beide über achtzig, und waren seit sechzig Jahren verheiratet. Sie kamen jedes Jahr in diesen Besen, seit ihrer Verlobung. „Damals hat das Viertele achtzig Pfennig gekostet“, sagte Walter. „Und der Wengerter war der Vater von dem jetzigen.“","Die junge Frau mit der Laptoptasche hieß Sina und war Doktorandin an der Uni Hohenheim. Sie forschte über Weinbau und Klimawandel. „Den Trollinger hier gibt's vielleicht in zwanzig Jahren nicht mehr so“, sagte sie. „Es wird zu warm. Die Wengerter pflanzen schon andere Sorten.“","„Was?“, rief Herbert. „Kein Trollinger mehr? Dann wandere ich aus.“","„Nach Valencia?“, fragte seine Frau trocken. „Da ist es noch heißer.“","Der ganze Tisch lachte. Elena merkte, dass sie zum ersten Mal in Deutschland mit Fremden lachte, ohne vorher nachzudenken, ob sie den Witz richtig verstanden hatte.","Später wurde das Gespräch ernster. Gerda fragte Elena, ob sie sich in Stuttgart wohlfühle. Elena zögerte. Sie sagte, die Arbeit sei gut und die Stadt schön, aber es sei schwer, Freunde zu finden. Die Leute seien höflich, aber zurückhaltend. Man rede, aber man komme nicht nah.","Gerda nickte langsam. „Das stimmt“, sagte sie. „Wir Schwaben sind so. Mein Walter hat zwei Jahre gebraucht, bis er mich zum ersten Mal zum Essen eingeladen hat. Zwei Jahre!“","„Ich wollte nichts überstürzen“, sagte Walter.","„Er wollte sparen“, sagte Gerda.","Wieder lachten alle. Dann sagte Gerda etwas, das Elena lange nicht vergaß: „Bei uns dauert's lange, bis man reinkommt. Aber wer einmal drin ist, den lassen wir auch nicht mehr raus.“","Gegen elf zahlten alle getrennt, wie es sich gehört. Herbert bestand darauf, Elena noch ein Viertele auszugeben, „für Valencia“. Sina schrieb ihr ihre Nummer auf einen Bierdeckel: „Wenn du mal einen Weinberg sehen willst – ich hab Zugang zu den Versuchsflächen.“","Auf dem Heimweg fragte Lukas: „Und? Wie fandest du's?“","Elena dachte an Gerda und Walter, an Herberts Paella und an den Bierdeckel in ihrer Tasche. „Ich glaube“, sagte sie, „ich bin heute ein bisschen reingekommen.“"],"g":[["Besen","(here) seasonal wine tavern; literally broom"],["Wengerter","winegrower (Swabian)"],["Reisigbesen","broom made of twigs"],["sich einlassen auf","to get involved in"],["Schürze","apron"],["rutschet halt a bissle","(Swabian) just move up a bit"],["Freilich","of course (southern German)"],["Mir beißet net","(Swabian) we don't bite"],["Viertele","quarter litre of wine"],["komisch angeschaut werden","to get funny looks"],["auspacken","(here) to bring out (a skill)"],["Reifenpanne","flat tyre"],["die Augen verdrehen","to roll one's eyes"],["sich einmischen","to join in, interfere"],["Verlobung","engagement"],["auswandern","to emigrate"],["zurückhaltend","reserved"],["überstürzen","to rush"],["wie es sich gehört","as is proper"],["Bierdeckel","beer mat"]],"q":[["Was bedeutet der Besen über der Tür?","Dass der Besen geöffnet ist und der Winzer eigenen Wein ausschenkt.","Nur einige Wochen im Jahr."],["Was ist ein Viertele?","Ein Viertelliter Wein, die normale Glasgröße.","Kleinere Gläser sind unüblich."],["Welches Zukunftsproblem erwähnt Sina?","Durch den Klimawandel wird es für den Trollinger zu warm.","Winzer pflanzen andere Sorten."],["Was erzählt Elena über ihr Leben in Stuttgart?","Die Menschen sind höflich, aber zurückhaltend; Freunde zu finden ist schwer.","Gerda bestätigt das."],["Was meint Gerda mit „reinkommen“ und „rauslassen“?","Es dauert, bis man aufgenommen wird, aber dann gehört man fest dazu.","Elena spürt, dass es begonnen hat."]],"teaser":"Ein schwäbischer Weinausschank, ein Tisch voller Fremder und ein Gespräch, das niemand geplant hat.","words":664},{"id":"probezeit","title":"Die letzten zwei Wochen","level":"C1","topic":"Arbeit · Karriere","min":12,"p":["Noch vierzehn Tage. Malik hatte den Countdown nicht absichtlich gestartet, aber sein Kopf tat es von allein. Am 31. März endete seine Probezeit als Systemadministrator in einem mittelständischen Maschinenbauunternehmen bei Heilbronn, und bisher hatte niemand ein Wort darüber verloren, ob man ihn behalten würde.","Objektiv betrachtet lief es gut. Er hatte die veraltete Backup-Lösung ersetzt, ohne dass ein einziger Datensatz verloren ging. Er hatte ein Dokumentationswiki aufgebaut, das inzwischen sogar die Kollegen aus der Fertigung benutzten. Aber Objektivität ist ein schwacher Trost, wenn die eigene Vorgesetzte bei jeder Begegnung auf dem Flur nur „Morgen“ sagt und weitergeht.","Frau Dietrich, seine Teamleiterin, war eine Frau von wenigen Worten. Lob gab es bei ihr nicht, höchstens ein knappes „Passt“. Kritik ebenfalls kaum, eher ein hochgezogenes Augenbrauen. Malik hatte drei Monate gebraucht, um zu verstehen, dass „Passt“ bei ihr ungefähr das Gleiche bedeutete wie bei anderen „Hervorragend, vielen Dank!“. Aber was bedeutete Schweigen?","Am Montag sprach er mit seinem Kollegen Stefan in der Kaffeeküche darüber. Stefan war seit zwölf Jahren im Haus und hatte, wie er selbst sagte, „schon drei Geschäftsführer und vier Kaffeemaschinen überlebt“.","„Die Dietrich redet nicht drüber, weil's für sie kein Thema ist“, sagte er. „Wenn sie dich loswerden wollte, wüsstest du's längst. Hier wird niemand in der letzten Woche überrascht.“","„Und wenn doch?“","Stefan zuckte mit den Schultern. „Dann frag sie halt. Ist doch dein gutes Recht.“","Das klang einfach. Es war es nicht. Malik kam aus einer Arbeitskultur, in der man nicht nach seiner eigenen Beurteilung fragt, weil es als Unsicherheit oder sogar als Druck ausgelegt werden konnte. Wer nachfragt, so hatte er gelernt, signalisiert, dass er an sich zweifelt. Und wer an sich zweifelt, bei dem zweifeln bald auch die anderen.","Am Mittwoch hatte er drei Versionen einer E-Mail geschrieben und alle drei gelöscht. Die erste war zu unterwürfig („Ich wollte mich erkundigen, ob Sie mit meiner Arbeit zufrieden sind, falls es Verbesserungsbedarf gibt …“), die zweite zu fordernd („Da meine Probezeit am 31. endet, bitte ich um eine verbindliche Aussage …“), die dritte so vage, dass er selbst nicht mehr wusste, worum es ging.","Am Donnerstag entschied er sich gegen die E-Mail. Er klopfte an die offene Tür von Frau Dietrichs Büro.","„Haben Sie zehn Minuten?“","Sie schaute auf die Uhr. „Fünf. Um halb hab ich die Geschäftsleitung.“","Er setzte sich. Er hatte sich die Sätze vorher zurechtgelegt und merkte jetzt, dass sie alle zu lang waren. Also sagte er einfach: „Meine Probezeit endet in zwei Wochen. Ich würde gern wissen, wie Sie meine Arbeit bisher einschätzen. Und ob es etwas gibt, was ich anders machen sollte.“","Frau Dietrich lehnte sich zurück und sah ihn eine Weile an. Malik spürte, wie sein Puls stieg.","„Die Probezeit“, sagte sie schließlich, „hab ich schon im Januar abgehakt. Ich hab der Personalabteilung damals gesagt, dass Sie bleiben. Hat Ihnen das keiner mitgeteilt?“","„Nein.“","„Hm.“ Sie runzelte die Stirn. „Das ist ärgerlich. Da hätte ich nachhaken müssen. Tut mir leid.“","Malik war so überrascht, dass er nichts sagte.","„Was Ihre Arbeit angeht“, fuhr sie fort, „das Backup-Projekt war sauber. Das Wiki ist gut, nur zu wenig gepflegt bei den Netzwerkthemen. Und Sie könnten in den Besprechungen öfter widersprechen. Sie haben letzte Woche bei der Firewall-Frage recht gehabt und nichts gesagt. Der Kollege, der nicht recht hatte, hat sehr viel gesagt.“","„Ich wollte nicht …“, begann Malik.","„Sich in der Probezeit nicht unbeliebt machen. Verstehe ich. Die ist jetzt vorbei. Ab sofort möchte ich, dass Sie widersprechen, wenn Sie es besser wissen. Freundlich, aber deutlich.“ Sie schaute auf die Uhr. „Sonst noch was?“","„Nein. Danke.“","„Passt.“ Sie stand auf und griff nach ihrem Notizbuch. An der Tür drehte sie sich noch einmal um. „Und Herr Hamidi? Gut, dass Sie gefragt haben. Hätte ich an Ihrer Stelle auch.“","Am Abend erzählte Malik seiner Schwester am Telefon davon. Sie lachte, als er beschrieb, wie er drei E-Mails geschrieben und gelöscht hatte. „Und das Wichtigste hast du am Ende gar nicht gefragt“, sagte sie. „Du hast nur gefragt, wie sie dich findet. Aber jetzt weißt du, was sie von dir will. Das ist viel besser.“","In der Teambesprechung am folgenden Dienstag ging es um die Migration der E-Mail-Server. Ein Kollege schlug vor, sie über Ostern durchzuziehen, wenn ohnehin niemand im Haus sei. Malik hob die Hand. „Ich sehe das ein bisschen anders. Über Ostern ist auch der Dienstleister nicht erreichbar. Wenn etwas schiefgeht, sitzen wir vier Tage ohne Support da.“","Es entstand eine kurze Diskussion. Am Ende wurde die Migration auf das Wochenende danach verschoben. Frau Dietrich sagte kein Wort. Aber als sie den Raum verließ, nickte sie ihm kurz zu."],"g":[["Probezeit","probation period"],["kein Wort über etwas verlieren","not to say a word about something"],["Fertigung","production (department)"],["ein schwacher Trost","cold comfort"],["Passt","(colloquial) fine, OK"],["loswerden","to get rid of"],["dein gutes Recht","your right"],["auslegen als","to interpret as"],["unterwürfig","submissive"],["sich etwas zurechtlegen","to prepare (words) in advance"],["einschätzen","to assess"],["abhaken","to tick off, deal with"],["nachhaken","to follow up"],["die Stirn runzeln","to frown"],["sich unbeliebt machen","to make oneself unpopular"],["durchziehen","to push through, carry out"],["schiefgehen","to go wrong"]],"q":[["Warum macht sich Malik Sorgen, obwohl es objektiv gut läuft?","Seine Teamleiterin sagt nichts über die Probezeit, und Schweigen ist schwer zu deuten.","Objektivität ist ein schwacher Trost."],["Was bedeutet „Passt“ bei Frau Dietrich?","Etwa so viel wie großes Lob.","Kommunikationsstil lernen."],["Warum fällt es Malik schwer nachzufragen?","In seiner gewohnten Arbeitskultur wirkt Nachfragen wie Unsicherheit.","Er schreibt und löscht drei E-Mails."],["Was erfährt Malik im Gespräch?","Die Probezeit war seit Januar entschieden, nur hatte ihn niemand informiert.","Frau Dietrich entschuldigt sich."],["Was erwartet die Teamleiterin künftig von ihm?","Dass er in Besprechungen freundlich, aber deutlich widerspricht.","Er setzt es bei der Server-Migration um."]],"teaser":"Die Probezeit läuft ab, die Teamleiterin schweigt – und Malik muss lernen, nach etwas zu fragen, das er eigentlich nicht wissen will.","words":767},{"id":"erbe","title":"Die Kiste vom Dachboden","level":"C1","topic":"Geschichte · Familie","min":12,"p":["Das Haus in Reutlingen war seit drei Monaten verkauft, und bis Ende des Monats musste der Dachboden leer sein. Johanna hatte sich zwei Tage Urlaub genommen und gehofft, dass es in einem erledigt wäre. Ihr Großvater hatte nichts weggeworfen, nie. Unter dem Dach standen Kisten mit Zeitschriften aus den Siebzigern, Schachteln mit Schrauben, sortiert nach Länge, und ein Fahrrad ohne Reifen, das er „irgendwann noch richten“ wollte.","Die Holzkiste fand sie am zweiten Nachmittag, hinter einem zusammengerollten Teppich. Sie war schwerer, als sie aussah, und mit einem kleinen Vorhängeschloss gesichert, dessen Schlüssel – natürlich – mit Klebeband auf der Unterseite befestigt war. Opa Ernst hatte vieles versteckt, aber nie gut.","Darin lagen Briefe. Hunderte, mit Bindfaden zu Bündeln verschnürt, nach Jahren geordnet. Die ersten stammten aus dem Jahr 1962, die letzten aus 1971. Die Handschrift auf den Umschlägen kannte Johanna nicht. Die Briefmarken waren italienisch.","Sie setzte sich auf den staubigen Boden und öffnete den ersten Brief. Er war auf Deutsch geschrieben, in einem Deutsch, das sorgfältig und manchmal ungelenk war, mit Fehlern, die man liebevoll nennen konnte. „Lieber Ernst, heute ist der dritte Tag zu Hause und ich vermisse schon die Arbeit in der Fabrik. Das sage ich nicht meiner Mutter. Sie denkt, Deutschland ist kalt. Aber du bist nicht kalt.“ Unterschrieben war er mit „Deine Lucia“.","Johanna las den Satz dreimal. Ihr Großvater war mit ihrer Großmutter Hildegard verheiratet gewesen, achtundfünfzig Jahre lang, bis zu ihrem Tod. Sie kannte die Geschichte, wie sie sich kennengelernt hatten: beim Tanzen in Tübingen, 1972, er hatte ihr auf den Fuß getreten. Diese Geschichte war bei jeder Familienfeier erzählt worden. Von einer Lucia hatte nie jemand gesprochen.","Sie rief ihre Mutter an. „Mama, sagt dir der Name Lucia etwas? Aus Italien?“","Am anderen Ende war es lange still. Dann sagte ihre Mutter: „Wo hast du das her?“","Am Abend saßen sie zu zweit in der leeren Küche, zwischen Umzugskartons, und lasen. Ihre Mutter wusste nur Bruchstücke. Ernst hatte in den Sechzigern in einer Textilfabrik gearbeitet, als Vorarbeiter. Viele Arbeiterinnen dort kamen aus Italien, angeworben im Rahmen des Abkommens zwischen beiden Ländern. Lucia war eine von ihnen gewesen. Mehr wusste die Mutter nicht. „Dein Opa hat einmal davon angefangen, da war ich vielleicht fünfzehn. Deine Oma hat das Zimmer verlassen. Danach hat er nie wieder davon gesprochen.“","Aus den Briefen ergab sich nach und nach eine Geschichte. Lucia war 1961 als Zwanzigjährige nach Reutlingen gekommen, hatte in einem Wohnheim mit vier anderen Frauen gewohnt und in der Spinnerei gearbeitet. Sie schrieb über die Kälte im ersten Winter, über das Essen, das sie fade fand, über Kolleginnen, die sie „Spaghettifresserin“ nannten, und darüber, wie Ernst einmal dazwischengegangen war. In einem Brief stand: „Du hast gesagt, wer so redet, kann gleich gehen. Danach hat niemand mehr etwas gesagt. Ich habe nicht gewusst, dass ein Vorarbeiter so mutig sein darf.“","Die Briefe aus den Jahren danach waren wärmer, dann sehnsüchtig. Lucia war 1964 zurück nach Kalabrien gegangen, weil ihr Vater krank geworden war. Sie hatte geschrieben, dass sie zurückkommen wolle, sobald es ihm besser gehe. Es ging ihm nicht besser. 1968 heiratete sie einen Mann aus ihrem Dorf. Die Briefe wurden seltener, kürzer, höflicher. Der letzte, von 1971, bestand aus vier Zeilen: Sie habe eine Tochter bekommen, es gehe ihr gut, und sie wünsche ihm von Herzen, dass auch er glücklich werde. „Du verdienst eine gute Frau, die bei dir bleibt. Ich konnte es nicht.“","Ein Jahr später hatte Ernst Hildegard beim Tanzen auf den Fuß getreten.","Johannas Mutter weinte nicht. Sie saß lange still da und sagte dann: „Weißt du, was komisch ist? Ich bin nicht enttäuscht. Ich hab immer gedacht, mein Vater war ein Mensch ohne große Geschichte. Ein Mann, der Schrauben sortiert. Und jetzt merke ich, dass er eine hatte. Er hat sie nur für sich behalten.“","„Glaubst du, Oma hat die Briefe gekannt?“","„Ich glaube, sie wusste, dass es sie gab. Und sie wollte sie nicht lesen. Das war ihre Art, damit umzugehen.“","Sie überlegten lange, was sie mit der Kiste tun sollten. Wegwerfen kam nicht in Frage. Verbrennen erschien ihnen theatralisch. Am Ende entschied Johanna, etwas zu tun, was ihr Großvater vielleicht nie gewagt hätte. Auf dem letzten Umschlag stand ein Absender, ein Dorf in Kalabrien. Sie schrieb einen Brief, auf Deutsch und mit Hilfe eines Übersetzungsprogramms auf Italienisch, an „die Familie von Lucia“, ohne zu wissen, ob es dort noch jemanden gab.","Sieben Wochen später kam eine Antwort, in ordentlicher Handschrift und gutem Deutsch. Sie war von Lucias Tochter, Maria, die als junge Frau selbst ein paar Jahre in Stuttgart gearbeitet hatte. Ihre Mutter sei 2019 gestorben. Aber in ihrem Nachlass habe sie ebenfalls eine Kiste gefunden, mit Briefen eines gewissen Ernst aus Reutlingen. Sie habe nie gewusst, was sie damit machen solle. „Vielleicht“, schrieb sie, „gehören die Briefe zusammen.“","Im Sommer darauf fuhren Johanna und ihre Mutter nach Kalabrien. Sie saßen auf Marias Terrasse, tranken viel zu starken Kaffee und lasen zum ersten Mal beide Seiten einer Geschichte, die zwei Menschen ein Leben lang für sich behalten hatten."],"g":[["Dachboden","attic"],["ausräumen","to clear out"],["richten","(southern German) to repair"],["Vorhängeschloss","padlock"],["Bindfaden","string"],["verschnüren","to tie up"],["ungelenk","clumsy, awkward"],["Bruchstück","fragment"],["Vorarbeiter","foreman"],["anwerben","to recruit"],["Abkommen","agreement (here: guest-worker agreement)"],["Wohnheim","hostel, residence"],["fade","bland"],["dazwischengehen","to intervene"],["sehnsüchtig","longing, yearning"],["Absender","sender (address)"],["Nachlass","estate (of a deceased person)"],["theatralisch","theatrical"],["für sich behalten","to keep to oneself"]],"q":[["Was findet Johanna in der Kiste?","Hunderte Briefe von Lucia aus Italien, 1962 bis 1971.","Eine unbekannte Familiengeschichte."],["Wer war Lucia?","Eine italienische Arbeiterin in der Reutlinger Textilfabrik, in der Ernst Vorarbeiter war.","Angeworben über das Abkommen zwischen beiden Ländern."],["Warum ging Lucia zurück nach Italien?","Ihr Vater war krank geworden.","Sie wollte zurückkommen, konnte aber nicht."],["Wie reagiert Johannas Mutter?","Nicht enttäuscht; sie entdeckt, dass ihr Vater eine eigene Geschichte hatte.","Er hatte sie nur für sich behalten."],["Wie endet die Geschichte?","Lucias Tochter hat Ernsts Briefe gefunden; beide Seiten werden in Kalabrien zusammen gelesen.","Die Briefe gehören zusammen."]],"teaser":"Beim Ausräumen der Wohnung ihres Großvaters findet Johanna Briefe, die eine andere Familiengeschichte erzählen als die, die sie kannte.","words":839},{"id":"arzt","title":"Wartezimmer, zweiter Stock","level":"B2","topic":"Gesundheit · Alltag","min":10,"p":["„Praxis Dr. Weinmann, Sie sprechen mit Frau Kübler, was kann ich für Sie tun?“","Amir hatte sich die Sätze aufgeschrieben, auf einen Zettel, der jetzt neben seiner Kaffeetasse lag. „Guten Morgen. Ich hätte gern einen Termin. Ich habe seit drei Wochen Rückenschmerzen, und es wird nicht besser.“","„Sind Sie schon Patient bei uns?“","„Nein, ich bin neu in Stuttgart.“","Am anderen Ende hörte er Tippen, dann ein Seufzen, das nicht unfreundlich klang, eher müde. „Neue Patienten nehmen wir eigentlich gerade nicht auf. Der nächste reguläre Termin wäre im Februar.“","Es war Oktober. Amir schaute auf seinen Zettel. Für diesen Fall hatte er nichts aufgeschrieben. „Im Februar“, wiederholte er. „Das ist … lange.“","„Ich weiß.“ Wieder Tippen. „Aber wissen Sie was? Wenn es akut ist, können Sie in die offene Sprechstunde kommen. Montag bis Freitag, acht bis zehn. Ohne Termin. Sie müssen halt Zeit mitbringen.“","„Wie viel Zeit?“","Frau Kübler lachte kurz. „Bringen Sie ein Buch mit. Ein dickes.“","Am nächsten Morgen stand Amir um 7:40 Uhr vor der Praxis. Er war nicht der Erste. Vor der Tür warteten bereits vier Menschen: eine junge Frau mit einem hustenden Kleinkind, ein älterer Herr mit Stock, ein Mann in Arbeitskleidung und eine Frau, die ununterbrochen telefonierte. Niemand sprach. Um Punkt acht öffnete sich die Tür, und alle gingen hinein, in exakt der Reihenfolge, in der sie gekommen waren. Amir war beeindruckt. In seiner Heimatstadt hätte es an dieser Stelle mindestens eine Diskussion gegeben.","Am Empfang saß eine Frau Mitte fünfzig mit Lesebrille an einer Kette. Das musste Frau Kübler sein. „Versichertenkarte, bitte“, sagte sie, ohne aufzuschauen. Amir gab sie ihr. Sie steckte die Karte ins Lesegerät, schaute auf den Bildschirm und dann zum ersten Mal zu ihm hoch. „Ah. Der Rücken. Sie haben gestern angerufen.“","„Sie erinnern sich?“","„Ich erinnere mich an alles“, sagte sie trocken. „Das ist mein Problem. Füllen Sie bitte diesen Bogen aus. Vorerkrankungen, Medikamente, Allergien. Wenn Sie etwas nicht verstehen, fragen Sie mich, nicht das Handy.“","Der Bogen hatte zwei Seiten. Die meisten Fragen verstand Amir. Bei einer zögerte er: „Besteht eine Unverträglichkeit gegenüber bestimmten Wirkstoffen?“ Er ging zurück zum Empfang. Frau Kübler erklärte es, ohne dass er die Frage zu Ende stellen musste: „Ob Sie ein Medikament mal nicht vertragen haben. Ausschlag, Magenprobleme, so was.“","Das Wartezimmer war voll. Es gab eine Ecke mit Spielzeug, einen Stapel Zeitschriften von 2023 und ein Schild: „Bitte schalten Sie Ihr Handy auf lautlos.“ Die telefonierende Frau ignorierte es. Der ältere Herr mit dem Stock schaute sie lange und strafend an, bis sie schließlich auflegte.","Neben Amir setzte sich der Mann in Arbeitskleidung. „Erstes Mal hier?“, fragte er leise.","„Ja.“","„Gute Praxis. Die Weinmann hört zu. Das ist selten.“ Er zeigte auf seine Hand, die mit einem Verband umwickelt war. „Kreissäge. Nicht so schlimm, wie's aussieht. Aber meine Frau hat gesagt, entweder ich geh zum Arzt, oder sie lässt sich scheiden.“","Amir lachte, und der Mann grinste. „Und Sie? Rücken?“","„Woher wissen Sie das?“","„Sie sitzen wie mein Schwiegervater. Ganz vorne auf der Kante, gerade wie ein Brett. Das macht man nur, wenn's wehtut.“","Nach einer Stunde und vierzig Minuten wurde Amir aufgerufen. Dr. Weinmann war eine schmale Frau mit kurzen grauen Haaren und einer Stimme, die leiser war, als er erwartet hatte. Sie fragte viel. Wann es angefangen habe. Ob er etwas Schweres gehoben habe. Wie er sitze, wie er schlafe, wie viele Stunden er am Computer arbeite. Ob die Schmerzen ins Bein ausstrahlten. Ob er gestresst sei.","Bei der letzten Frage zögerte Amir. „Ein bisschen“, sagte er. „Neue Stadt, neue Arbeit. Ich kenne noch niemanden.“","Sie nickte, als hätte sie genau das erwartet. Dann untersuchte sie ihn, ließ ihn sich vorbeugen, auf einem Bein stehen, die Arme heben. „Ein Bandscheibenvorfall ist das nicht“, sagte sie schließlich. „Ihre Muskulatur ist völlig verspannt. Das kommt vom Sitzen, und, ehrlich gesagt, wahrscheinlich auch vom Kopf.“","„Vom Kopf?“","„Stress setzt sich bei vielen Menschen in den Rücken. Ich schreibe Ihnen Physiotherapie auf, sechs Termine. Und ich möchte, dass Sie sich jeden Tag eine halbe Stunde bewegen. Kein Fitnessstudio, einfach gehen. Am besten mit jemandem zusammen.“","„Ich kenne ja niemanden.“","„Dann ist das Ihre zweite Aufgabe“, sagte Dr. Weinmann und lächelte zum ersten Mal.","Am Empfang gab Frau Kübler ihm das Rezept für die Physiotherapie und eine Liste mit Praxen in der Nähe. „Rufen Sie gleich heute an“, sagte sie. „Die haben auch Wartezeiten. Und die Praxis in der Hohenstaufenstraße ist am besten, aber das haben Sie nicht von mir.“","Draußen auf der Straße blieb Amir einen Moment stehen. Dann drehte er sich um, weil hinter ihm jemand „Hey!“ rief. Es war der Mann mit dem Verband. „Ich geh jeden Abend um sieben mit dem Hund an der Feuerbacher Heide spazieren“, sagte er. „Wenn Sie wollen. Rücken und so.“","Amir wollte. Drei Wochen später waren die Schmerzen fast weg. Ob es an der Physiotherapie lag oder an den Abendspaziergängen mit Rolf und seinem Hund Bruno, konnte er nicht genau sagen. Wahrscheinlich, dachte er, an beidem."],"g":[["Sprechstundenhilfe","medical receptionist"],["akut","acute, urgent"],["offene Sprechstunde","walk-in hours"],["Versichertenkarte","health insurance card"],["Bogen","form"],["Vorerkrankung","pre-existing condition"],["Unverträglichkeit","intolerance"],["Ausschlag","rash"],["lautlos","silent mode"],["strafend","reproachful"],["Verband","bandage"],["Kreissäge","circular saw"],["Kante","edge"],["ausstrahlen","to radiate (pain)"],["Bandscheibenvorfall","slipped disc"],["verspannt","tense (muscles)"],["aufschreiben","(here) to prescribe"],["Rezept","prescription"]],"q":[["Warum bekommt Amir keinen normalen Termin?","Die Praxis nimmt kaum neue Patienten auf; der nächste Termin wäre im Februar.","Er kann zur offenen Sprechstunde kommen."],["Was überrascht Amir vor der Praxis?","Alle gehen ruhig in der Reihenfolge ihrer Ankunft hinein.","Keine Diskussion."],["Woran erkennt der Mann, dass Amir Rückenschmerzen hat?","An seiner Sitzhaltung: ganz vorne auf der Kante, gerade wie ein Brett.","Alltagsbeobachtung."],["Was ist laut Ärztin die Ursache?","Verspannte Muskulatur durch Sitzen und Stress.","Kein Bandscheibenvorfall."],["Was ist Amirs „zweite Aufgabe“ und wie löst er sie?","Jemanden zum Spazierengehen finden – er geht mit Rolf und dessen Hund.","Gesundheit und Kontakt verbinden sich."]],"teaser":"Seit drei Wochen Rückenschmerzen, kein Termin frei – und eine Sprechstundenhilfe, die alles weiß.","words":830},{"id":"date","title":"Zweimal Kaffee, getrennt","level":"B2","topic":"Beziehungen · Small Talk","min":10,"p":["Sara kam um 15:58 Uhr ins Café. Das war Absicht. Sie hatte gelesen, dass man in Deutschland bei Verabredungen pünktlich sein sollte, und lieber zwei Minuten zu früh als eine zu spät. Sie setzte sich an einen Tisch am Fenster, bestellte ein Wasser und schaute auf die Tür.","Um 16:00 Uhr kam niemand. Um 16:05 Uhr auch nicht. Um 16:09 Uhr vibrierte ihr Handy. „Sorry!!! Stehe im Stau auf der B14, bin in 10 Min da. Bestell dir schon was, geht auf mich 🙈 Felix“","Sara las die Nachricht zweimal. „Geht auf mich“ verstand sie aus dem Zusammenhang. Das Affen-Emoji, das sich die Augen zuhält, verstand sie auch. Sie bestellte einen Cappuccino und beschloss, nicht beleidigt zu sein. Noch nicht.","Felix kam um 16:21 Uhr, außer Atem, mit einem Fahrradhelm in der Hand. „Es tut mir echt leid“, sagte er, bevor er sich setzte. „Ich hab gedacht, mit dem Auto geht's schneller. Dann hab ich's stehen lassen und bin mit dem Leihrad weiter. Das war vielleicht keine gute Idee, ich bin komplett durchgeschwitzt.“","Er sah tatsächlich so aus. Sara musste lachen. „Ist schon okay“, sagte sie. „Ich hatte Zeit, den Cappuccino zu genießen.“","„Gut. Der geht natürlich auf mich. Und der nächste auch.“","Das Gespräch begann vorsichtig, wie solche Gespräche beginnen. Was machst du beruflich? Wie lange wohnst du schon in Stuttgart? Was machst du am Wochenende? Felix war Landschaftsarchitekt und plante gerade einen Spielplatz in Bad Cannstatt. Sara war Pharmazeutin und arbeitete in einem Labor. Sie redeten über Arbeit, über Wohnungssuche, über die Frage, ob man in Stuttgart ein Auto braucht. Felix meinte: nein, eigentlich nicht. Sara zeigte auf seinen Fahrradhelm und hob eine Augenbraue.","„Okay“, gab er zu. „Heute war eine Ausnahme.“","Nach etwa einer halben Stunde fiel Sara auf, dass Felix sie oft unterbrach. Nicht böse, eher begeistert. Wenn sie von ihrer Arbeit erzählte, sagte er „Ah, das kenn ich, bei uns ist es so …“ und erzählte von seiner. Wenn sie von ihrer Familie sprach, erzählte er von seiner. Sie wusste nicht, ob das in Deutschland normal war oder einfach Felix. Sie beschloss, es zu testen.","„Darf ich dich was fragen?“","„Klar.“","„Du hast mich jetzt viermal unterbrochen. Ist das bei euch so üblich? Ich frage ehrlich, ich weiß es nicht.“","Felix hielt inne, die Tasse halb zum Mund gehoben. Dann stellte er sie langsam ab. „Oh Mann“, sagte er. „Hab ich? Echt?“","„Viermal. Ich hab mitgezählt.“","Er lachte, aber verlegen. „Meine Schwester sagt mir das auch immer. Ich mach das, wenn ich nervös bin. Dann rede ich zu viel, damit keine Pause entsteht.“ Er schaute sie an. „Sorry. Erzähl weiter. Ich halte jetzt mal die Klappe.“","Es war das erste Mal an diesem Nachmittag, dass Sara ihn wirklich mochte.","Danach wurde das Gespräch anders. Langsamer. Felix stellte Fragen und wartete die Antworten ab. Sara erzählte, dass sie vor vier Jahren nach Deutschland gekommen war, allein, und dass das erste Jahr das schwierigste ihres Lebens gewesen sei. Dass sie manchmal immer noch das Gefühl habe, in einer Sprache zu leben, die ihr nicht ganz gehört. Dass sie Witze auf Deutsch erst dann lustig finde, wenn sie sie schon dreimal gehört habe.","„Das kenne ich ein bisschen“, sagte Felix leise. „Nicht mit der Sprache. Aber ich bin auf dem Dorf aufgewachsen, auf der Schwäbischen Alb. Als ich nach Stuttgart zum Studium kam, haben sich alle über meinen Dialekt lustig gemacht. Ich hab ein Jahr lang fast nichts gesagt, weil ich Angst hatte, wie ein Bauer zu klingen.“","„Und jetzt?“","„Jetzt red ich zu viel.“ Er grinste. „Hab's übertrieben mit dem Ausgleich.“","Um kurz nach sechs bat Sara um die Rechnung. Der Kellner kam und fragte, wie in Deutschland üblich: „Zusammen oder getrennt?“","„Zusammen“, sagte Felix schnell.","„Getrennt“, sagte Sara gleichzeitig.","Der Kellner wartete mit unbewegtem Gesicht. Er hatte offenbar schon viele solcher Momente erlebt.","„Du hast gesagt, der Cappuccino geht auf dich“, sagte Sara. „Den nehme ich an. Den Rest zahle ich selbst. Beim nächsten Mal kannst du mich einladen. Falls es ein nächstes Mal gibt.“","Felix überlegte kurz. „Das ist ein guter Deal“, sagte er. „Aber dann suche ich das Café aus. Und ich komme pünktlich. Versprochen.“","Beim zweiten Treffen, eine Woche später, war er um 15:52 Uhr da. Er schickte ihr ein Foto von der leeren Tür, mit der Nachricht: „Ich warte. Du bist zu spät. 😇“ Es war 15:53 Uhr. Sara stand auf der anderen Straßenseite und lachte so laut, dass sich zwei Passanten nach ihr umdrehten."],"g":[["Verabredung","date, appointment"],["Das geht auf mich","it's on me (I'll pay)"],["beleidigt","offended"],["außer Atem","out of breath"],["Leihrad","rental bike"],["durchgeschwitzt","drenched in sweat"],["eine Augenbraue heben","to raise an eyebrow"],["zugeben","to admit"],["unterbrechen","to interrupt"],["innehalten","to pause"],["verlegen","embarrassed"],["die Klappe halten","to shut up (colloquial)"],["auf dem Dorf aufwachsen","to grow up in a village"],["sich lustig machen über","to make fun of"],["übertreiben","to overdo"],["Ausgleich","compensation, balance"],["Zusammen oder getrennt?","Together or separately? (paying)"],["Versprochen","promise"]],"q":[["Warum kam Sara zwei Minuten zu früh?","Sie hatte gelesen, dass man in Deutschland pünktlich sein soll.","Kulturelle Erwartung."],["Warum war Felix zu spät?","Stau auf der B14; dann ist er mit dem Leihrad weitergefahren.","Er kam durchgeschwitzt."],["Was fiel Sara während des Gesprächs auf?","Felix unterbrach sie oft.","Sie spricht ihn offen darauf an."],["Was erklärt Felix über sein Verhalten?","Er redet zu viel, wenn er nervös ist, als Ausgleich für eine Zeit, in der er wegen seines Dialekts geschwiegen hat.","Ehrlichkeit verändert das Gespräch."],["Wie lösen sie die Frage der Rechnung?","Felix zahlt den Cappuccino, den Rest zahlt Sara; beim nächsten Mal lädt er ein.","Ein Kompromiss."]],"teaser":"Ein erstes Date über eine App, zwei Menschen mit sehr unterschiedlichen Vorstellungen von Pünktlichkeit – und ein Gespräch, das plötzlich ehrlich wird.","words":743},{"id":"baeckerei","title":"Um vier Uhr morgens","level":"B2","topic":"Arbeit · Handwerk","min":10,"p":["Der Wecker klingelte um 2:45 Uhr. Yusuf hatte sich in den letzten drei Monaten nicht daran gewöhnt und war ziemlich sicher, dass er sich nie daran gewöhnen würde. Er zog sich im Dunkeln an, trank einen Schluck Wasser und fuhr mit dem Fahrrad durch eine Stadt, in der um diese Uhrzeit nur Füchse, Taxifahrer und Bäcker unterwegs waren.","Die Bäckerei Kurz lag in einer Seitenstraße der Esslinger Altstadt. Von außen war sie unscheinbar, ein kleiner Laden mit grünem Schild. Hinten aber, in der Backstube, war es um drei Uhr schon warm und hell. Meister Kurz, ein Mann von Anfang sechzig mit Unterarmen wie Baumstämme, stand am Teig und nickte ihm zu. „Morgen. Kaffee steht da. Dann Brezeln.“","Mehr sagte er meistens nicht vor fünf Uhr. Yusuf hatte gelernt, dass das nichts Persönliches war.","Brezeln waren das Erste, was Yusuf in seiner Ausbildung gelernt hatte, und das Schwierigste. Der Teig musste zu langen Strängen gerollt werden, in der Mitte dick, an den Enden dünn. Dann kam der Schwung: die Enden hochnehmen, zweimal umeinander drehen, auf den dicken Bauch drücken. Meister Kurz machte das in drei Sekunden, ohne hinzusehen, während er nebenbei Radio hörte. Yusuf brauchte am Anfang eine halbe Minute pro Brezel, und die Hälfte sah aus wie ein Knoten.","„Nicht denken“, hatte Kurz damals gesagt. „Die Hände müssen das lernen, nicht der Kopf.“","Inzwischen waren Yusufs Brezeln besser. Nicht perfekt, aber verkaufbar. Heute schaffte er in der ersten Stunde zweihundert Stück. Kurz kam vorbei, nahm eine in die Hand, drehte sie um und legte sie zurück. „Passt“, sagte er. Yusuf freute sich mehr darüber, als er zugegeben hätte.","Um halb fünf kam Brigitte, die Frau des Meisters, die den Verkauf leitete. Sie war das Gegenteil ihres Mannes: laut, schnell und um jede Uhrzeit gesprächig. „Na, Yusuf, hat er dich heute schon gelobt? Nein? Dann sag ich's dir: Er hat gestern Abend gesagt, dass du der beste Lehrling seit zehn Jahren bist. Aber das hast du nicht von mir.“","„Brigitte“, brummte Kurz vom Ofen her.","„Was? Stimmt doch.“","Um fünf Uhr kam die Natronlauge. Die Brezeln wurden kurz hineingetaucht, damit sie später ihre braune Farbe und den typischen Geschmack bekamen. Yusuf trug dabei Handschuhe und Schutzbrille, weil die Lauge ätzend war. Kurz hatte ihm am ersten Tag eine Narbe an seinem eigenen Handgelenk gezeigt. „Vierzig Jahre her. Einmal nicht aufgepasst.“","Gegen sechs, als die ersten Bleche aus dem Ofen kamen und der ganze Raum nach frischem Brot roch, wurde Kurz gesprächiger. Das war jeden Tag so, als ob der Geruch ihn auftauen würde. Er erzählte, dass die Bäckerei seit 1921 in der Familie sei. Dass es vor dreißig Jahren in Esslingen noch über vierzig Bäckereien gegeben habe und heute vielleicht zwölf. Dass die Ketten mit ihren Aufbackbrötchen die Preise kaputt gemacht hätten.","„Und warum machen Sie weiter?“, fragte Yusuf.","Kurz überlegte lange. „Weil die Leute es merken“, sagte er schließlich. „Nicht alle. Aber genug. Frau Scholz kommt seit vierzig Jahren jeden Morgen um sieben für zwei Brezeln und ein Roggenbrot. Ihr Mann ist vor fünf Jahren gestorben. Sie kauft trotzdem zwei Brezeln. Eine isst sie, eine bringt sie auf den Friedhof.“","Yusuf wusste nicht, was er darauf sagen sollte. Er sagte nichts, und Kurz schien das richtig zu finden.","„Ich hab keine Kinder, die das übernehmen wollen“, fuhr Kurz fort. „Mein Sohn ist Informatiker in München. Verdient das Dreifache und schläft bis sieben.“ Er lachte kurz, ohne Bitterkeit. „Kann ich ihm nicht verübeln.“","Um sieben öffnete Brigitte den Laden. Die erste Kundin war tatsächlich eine kleine Frau mit Kopftuch und Einkaufstasche. „Zwei Brezeln, ein Roggen, wie immer, Frau Scholz?“, fragte Brigitte, und die Frau nickte. Yusuf sah durch die Durchreiche, wie Brigitte ihr die beiden Brezeln einpackte. Er hatte beide gemacht.","Nach der Schicht, um halb elf, saß Yusuf mit Kurz noch draußen auf der kleinen Bank hinter der Backstube. Kurz trank Kaffee, Yusuf Apfelschorle. Die Altstadt war jetzt voller Leute.","„Darf ich Sie was fragen, Meister?“","„Frag.“","„Wer übernimmt die Bäckerei, wenn Sie aufhören?“","Kurz sah ihn lange an. „Das“, sagte er, „hängt davon ab, wie gut deine Brezeln in drei Jahren sind.“ Dann stand er auf, stellte die Tasse ab und ging nach Hause, um zu schlafen. Yusuf blieb noch eine Weile sitzen. Er war sehr müde. Er war, wenn er ehrlich war, auch ziemlich glücklich."],"g":[["sich gewöhnen an","to get used to"],["unscheinbar","inconspicuous"],["Backstube","bakehouse"],["Teig","dough"],["Strang","strand"],["Knoten","knot"],["verkaufbar","sellable"],["Lehrling","apprentice"],["brummen","to grumble"],["Natronlauge","lye (caustic soda solution)"],["ätzend","corrosive; (slang) awful"],["Narbe","scar"],["Blech","baking tray"],["auftauen","to thaw, loosen up"],["Aufbackbrötchen","part-baked rolls"],["übernehmen","to take over"],["jemandem etwas verübeln","to hold something against someone"],["Durchreiche","serving hatch"],["Schicht","shift"],["Apfelschorle","apple juice spritzer"]],"q":[["Wie lernt man laut Meister Kurz Brezeln zu formen?","Nicht mit dem Kopf, sondern mit den Händen – durch Übung.","„Nicht denken.“"],["Was verrät Brigitte über ihren Mann?","Er hält Yusuf für den besten Lehrling seit zehn Jahren.","Er selbst lobt kaum."],["Warum ist die Natronlauge gefährlich?","Sie ist ätzend; Kurz hat davon eine Narbe.","Schutzbrille und Handschuhe."],["Warum macht Kurz trotz Konkurrenz weiter?","Weil genug Menschen die Qualität merken – wie Frau Scholz.","Sie bringt eine Brezel auf den Friedhof."],["Was deutet das Ende an?","Yusuf könnte die Bäckerei eines Tages übernehmen.","Abhängig von seinen Brezeln."]],"teaser":"Eine Nacht in einer Familienbäckerei in Esslingen – über Brezeln, Müdigkeit und die Frage, ob das Handwerk eine Zukunft hat.","words":717},{"id":"bewerbung","title":"Drei Fragen zu viel","level":"C1","topic":"Karriere · Vorstellungsgespräch","min":11,"p":["Leyla hatte sich auf alles vorbereitet. Auf die Frage nach ihren Stärken und Schwächen, auf die Frage, wo sie sich in fünf Jahren sehe, auf die Frage nach ihrer Gehaltsvorstellung. Sie hatte die Antworten laut geübt, vor dem Spiegel, im Auto und einmal versehentlich in der Straßenbahn, was ihr einen irritierten Blick eines älteren Herrn eingebracht hatte.","Das Unternehmen war ein mittelgroßer Softwareanbieter in Karlsruhe, die Stelle hieß „Senior IT-Sicherheitsanalystin“. Es wäre der nächste große Schritt nach vier Jahren im Support. Sie wollte diese Stelle mehr, als sie sich selbst eingestand.","Im Besprechungsraum warteten zwei Personen: Herr Lindner, der Abteilungsleiter, ein Mann Ende vierzig mit Rollkragenpullover, und Frau Okafor aus der Personalabteilung, die freundlich lächelte und einen Block vor sich hatte.","„Frau Aydın, schön, dass Sie da sind“, sagte Lindner. „Wir machen das heute etwas anders als üblich. Ich will Ihnen nicht die Standardfragen stellen. Ihren Lebenslauf kennen wir. Ich möchte sehen, wie Sie denken.“","Leyla lächelte. Innerlich sah sie, wie ihre gesamte Vorbereitung im Papierkorb verschwand.","„Stellen Sie sich vor“, begann Lindner, „es ist Freitag, 17:30 Uhr. Sie bekommen einen Anruf von der Buchhaltung. Eine Mitarbeiterin hat auf einen Link in einer E-Mail geklickt, die angeblich vom Geschäftsführer kam, und dort ihre Zugangsdaten eingegeben. Sie ist sich jetzt nicht mehr sicher, ob das richtig war. Was tun Sie?“","Leyla atmete einmal durch. Das war keine Theoriefrage. Das war ein Freitag, den sie im letzten Jahr genau so erlebt hatte.","„Zuerst würde ich sie beruhigen“, sagte sie. „Nicht, weil es nicht schlimm sein könnte, sondern weil eine Person in Panik schlechte Informationen liefert. Dann würde ich sie bitten, nichts mehr anzufassen und mir die E-Mail weiterzuleiten, ohne erneut auf den Link zu klicken. Parallel würde ich ihr Passwort zurücksetzen und alle aktiven Sitzungen beenden lassen.“","„Warum parallel und nicht erst prüfen, ob es überhaupt Phishing war?“","„Weil das Zurücksetzen eines Passworts fast nichts kostet, und das Warten im schlimmsten Fall sehr viel. Wenn sich herausstellt, dass es harmlos war, hat sie eben ein neues Passwort. Das ist ärgerlich, aber kein Schaden.“","Lindner nickte und schrieb etwas auf. „Weiter.“","„Dann würde ich prüfen, ob dieselbe E-Mail auch bei anderen angekommen ist. Wenn ja, würde ich sie aus allen Postfächern entfernen lassen und eine kurze Warnung verschicken. Kurz, ohne Fachbegriffe. Und ich würde die Anmeldeprotokolle des Kontos prüfen, ob es in der letzten Stunde Zugriffe von ungewöhnlichen Orten gab.“","„Und die Mitarbeiterin? Was sagen Sie ihr am Montag?“","Diese Frage hatte Leyla nicht erwartet. Sie überlegte kurz. „Dass sie das Richtige getan hat, als sie angerufen hat. Ehrlich gemeint. Wenn Mitarbeitende Angst haben, Fehler zu melden, erfahren wir von solchen Vorfällen erst, wenn es zu spät ist. Der Klick war der Fehler. Der Anruf war die Lösung.“","Zum ersten Mal schaute Frau Okafor von ihrem Block auf.","Die zweite Frage war technischer, die dritte strategisch: Wie würde sie einem Vorstand, der IT-Sicherheit für einen Kostenfaktor hält, ein Budget für Schulungen erklären? Leyla antwortete mit einem Vergleich aus ihrem früheren Job: ein einziger erfolgreicher Angriff auf ein Partnerunternehmen hatte dort zwei Wochen Produktionsausfall verursacht. „Ich würde nicht über Sicherheit reden“, sagte sie, „sondern über Ausfalltage.“","Nach fünfundvierzig Minuten lehnte sich Lindner zurück. „Gut. Haben Sie Fragen an uns?“","Das war der Moment, auf den Leyla sich ebenfalls vorbereitet hatte, mit zwei harmlosen Fragen über Weiterbildung und Teamgröße. Sie stellte sie nicht.","„Ja“, sagte sie stattdessen. „Drei. Erstens: Wie oft passiert so ein Freitagabend bei Ihnen wirklich? Zweitens: Wer hat die Person, die vor mir auf dieser Stelle war, ersetzt, und warum ist sie gegangen? Und drittens: Wenn ich in einer Besprechung widerspreche, weil ich eine Sicherheitslücke sehe, und der Vertrieb sagt, das Produkt muss trotzdem raus – wer entscheidet?“","Es wurde still. Frau Okafor sah Lindner an. Lindner sah aus dem Fenster.","„Die erste Frage“, sagte er schließlich, „etwa einmal im Monat. Die zweite: Mein Vorgänger auf dieser Stelle ist gegangen, weil er genau den Konflikt aus Ihrer dritten Frage dreimal verloren hat. Die dritte: Bisher der Vertrieb. Das soll sich ändern. Deshalb suchen wir jemanden, der widerspricht.“ Er machte eine Pause. „Sie sind die erste Kandidatin, die danach gefragt hat.“","Leyla wusste nicht, ob das gut oder schlecht war.","Zwei Tage später rief Frau Okafor an. Sie bot ihr die Stelle an, mit einem Gehalt, das achttausend Euro über Leylas Vorstellung lag. „Herr Lindner hat gesagt, wer solche Fragen stellt, verhandelt auch hart. Er wollte gleich mit einem guten Angebot anfangen.“","Leyla nahm an. Am Abend schrieb sie ihre vorbereiteten Antworten auf die Standardfragen noch einmal ab, sauber, in ein Notizbuch. Nicht, weil sie sie noch brauchen würde. Sondern weil sie sich erinnern wollte, wie viel Angst sie gehabt hatte, bevor sie gemerkt hatte, dass ihre eigenen Fragen wichtiger waren."],"g":[["sich etwas eingestehen","to admit something to oneself"],["Rollkragenpullover","turtleneck"],["Lebenslauf","CV"],["im Papierkorb verschwinden","to end up in the bin"],["Zugangsdaten","login credentials"],["durchatmen","to take a deep breath"],["beruhigen","to calm down"],["weiterleiten","to forward"],["Sitzung beenden","to end a session"],["harmlos","harmless"],["Postfach","mailbox"],["Anmeldeprotokoll","login log"],["Vorfall","incident"],["Kostenfaktor","cost factor"],["Ausfalltag","day of downtime"],["Vertrieb","sales (department)"],["Vorgänger","predecessor"],["hart verhandeln","to negotiate hard"]],"q":[["Warum war Leylas Vorbereitung plötzlich nutzlos?","Lindner stellte keine Standardfragen, sondern Praxisfälle.","Er wollte sehen, wie sie denkt."],["Warum würde sie das Passwort sofort zurücksetzen?","Es kostet fast nichts, Warten könnte viel kosten.","Risikoabwägung."],["Was würde sie der Mitarbeiterin am Montag sagen?","Dass der Anruf richtig war – der Klick war der Fehler, der Anruf die Lösung.","Sonst meldet niemand mehr Fehler."],["Welche drei Fragen stellt Leyla am Ende?","Wie oft solche Fälle vorkommen, warum ihr Vorgänger ging, und wer bei Konflikten mit dem Vertrieb entscheidet.","Sie prüft das Unternehmen."],["Warum bekommt sie ein besonders hohes Angebot?","Lindner vermutet, dass jemand mit solchen Fragen auch hart verhandelt.","Ihre Fragen überzeugten."]],"teaser":"Ein Vorstellungsgespräch, das völlig anders läuft als geplant – und eine Kandidatin, die am Ende selbst die Fragen stellt.","words":788},{"id":"roadtrip","title":"Drei Tage Ostsee","level":"B2","topic":"Reisen · Freundschaft","min":11,"p":["Der Plan war einfach gewesen, wie alle Pläne, die um Mitternacht in einer Küche geschmiedet werden. Vier Freunde, drei Tage, ein alter VW-Bus von Tims Onkel, und die Ostsee. „Wir fahren Donnerstag früh los“, hatte Tim gesagt, „sind abends in Kiel, schlafen im Bus, Freitag Fehmarn, Samstag Rückfahrt. Easy.“","„Wie weit ist das?“, hatte Mei gefragt.","„Achthundert Kilometer. Ungefähr.“","„Und wie schnell fährt der Bus?“","Tim hatte gezögert. „Hundertzehn. Bergab.“","Sie fuhren trotzdem. Donnerstag um sechs Uhr morgens standen Tim, Mei, Kofi und Hanna vor einem orangefarbenen Bus, Baujahr 1987, der aussah wie aus einem Film über die Siebziger. Innen roch es nach altem Holz und ein bisschen nach Hund. Tims Onkel hatte eine handgeschriebene Liste auf das Armaturenbrett geklebt: „1. Nicht über 100. 2. Öl alle 500 km prüfen. 3. Wenn er komisch klingt, sofort anhalten. 4. Viel Spaß!!!“","Die ersten dreihundert Kilometer waren herrlich. Sie hörten Musik, aßen Brezeln und Mandarinen, spielten „Ich sehe was, was du nicht siehst“, bis Kofi gewann, weil niemand darauf kam, dass er das kleine Wackeldackel-Fähnchen auf dem Rückspiegel meinte. Hanna, die als Einzige Schwäbisch konnte, brachte Mei die wichtigsten Wörter bei: „Grüß Gott“, „Ade“, „Gell?“ und „Des isch mir wurscht“.","Kurz hinter Kassel fing der Bus an, komisch zu klingen.","Erst war es ein leises Klopfen, dann ein Rattern, dann ein Geräusch, das Kofi als „sterbender Rasenmäher“ beschrieb. Tim fuhr auf den Standstreifen und schaltete die Warnblinkanlage ein. Alle stiegen aus und schauten auf den Motor, der bei diesem Modell hinten saß. Keiner von ihnen hatte die geringste Ahnung von Motoren.","„Okay“, sagte Hanna. „Was machen wir jetzt?“","„ADAC anrufen“, sagte Mei.","„Mein Onkel ist nicht im ADAC“, sagte Tim. „Er sagt, das ist was für Leute, die ihrem Auto nicht vertrauen.“","Es entstand eine kurze Pause, in der alle über diesen Satz nachdachten, während hinter ihnen Lastwagen mit hundert Stundenkilometern vorbeidonnerten.","Am Ende rief Kofi seinen eigenen Automobilclub an. Er war Mitglied, weil er, wie er sagte, „seinem Auto nicht vertraute und das auch zu Recht“. Die Frau am Telefon war freundlich und ruhig. „Wo genau stehen Sie? Sehen Sie ein Kilometerschild? Sind alle außerhalb des Fahrzeugs hinter der Leitplanke? Gut. Ein Pannenhelfer ist in etwa fünfzig Minuten bei Ihnen.“","Sie saßen fünfzig Minuten hinter der Leitplanke auf einer Böschung voller Brennnesseln. Mei hatte Kopfhörer dabei. Kofi hatte Spielkarten. Hanna hatte Kuchen. Und Tim hatte ein schlechtes Gewissen, das er in Form von Entschuldigungen alle zehn Minuten vortrug, bis Hanna sagte: „Tim. Wenn du dich noch einmal entschuldigst, schiebe ich dich auf die Autobahn.“","Der Pannenhelfer hieß Dieter, war um die sechzig und begrüßte den Bus wie einen alten Freund. „Ein T3! Mensch, den hab ich ja ewig nicht gesehen.“ Er legte sich unter den Wagen, klopfte hier und da, stellte Fragen, die nur Tim halb beantworten konnte, und kam nach zwanzig Minuten ölverschmiert wieder hervor. „Keilriemen ist hinüber. Und die Lichtmaschine macht's auch nicht mehr lange. Ich kann euch bis zur nächsten Werkstatt schleppen, in Göttingen. Aber heute macht da keiner mehr was dran.“","Göttingen. Nicht Kiel, nicht Fehmarn, nicht die Ostsee. Göttingen.","In der Werkstatt in Göttingen sagte der Meister, das Ersatzteil müsse bestellt werden und sei frühestens am Samstag da. Es war Donnerstag, 16 Uhr. Die vier standen auf dem Hof neben ihrem kranken Bus und schauten sich an.","„Wir könnten mit dem Zug weiter“, sagte Mei.","„Und den Bus hierlassen?“, sagte Tim. „Mein Onkel bringt mich um.“","„Wir könnten nach Hause fahren“, sagte Kofi.","„Nein“, sagte Hanna entschieden. „Wir haben drei Tage frei. Wir sind in einer Stadt, in der keiner von uns je war. Wir machen hier Urlaub.“","Und das taten sie. Sie fanden ein günstiges Zimmer in einer Jugendherberge, mit Stockbetten und Gemeinschaftsdusche, und fühlten sich wie auf Klassenfahrt. Sie liefen durch die Altstadt, sahen das Gänseliesel, die berühmte Brunnenfigur, die laut Tradition von jedem frisch promovierten Doktor geküsst wird. Kofi küsste sie auch, ohne Doktor, und wurde von einem Passanten freundlich darauf hingewiesen, dass das eigentlich nicht erlaubt sei. Sie aßen in einer Studentenkneipe, in der ein Schnitzel so groß war wie ein Lenkrad. Am Freitag liehen sie Fahrräder und fuhren zum Seeburger See. Es war kein Meer. Aber es war Wasser, die Sonne schien, und Mei sagte, das zähle.","Am Samstagmittag war der Bus repariert. Die Rechnung betrug 380 Euro, die sie durch vier teilten. Auf der Rückfahrt fuhr Tim nie schneller als neunzig. Der Bus klang dabei so zufrieden, wie ein Bus von 1987 klingen kann.","Irgendwo bei Würzburg sagte Kofi: „Wisst ihr, was komisch ist? Ich glaube, das war einer der besten Urlaube, die ich je hatte.“","„Wir waren nicht mal am Meer“, sagte Mei.","„Eben“, sagte Hanna. „Deshalb müssen wir nächstes Jahr wieder los.“","Tim schaute in den Rückspiegel, auf den wackelnden Dackel und auf drei Freunde, die auf der Rückbank eingeschlafen waren, und dachte, dass sein Onkel recht gehabt hatte. Nur mit Punkt vier."],"g":[["einen Plan schmieden","to hatch a plan"],["Baujahr","year of manufacture"],["Armaturenbrett","dashboard"],["Wackeldackel","nodding dog figure"],["Des isch mir wurscht","(Swabian) I don't care"],["Standstreifen","hard shoulder"],["Warnblinkanlage","hazard lights"],["vorbeidonnern","to thunder past"],["zu Recht","rightly"],["Leitplanke","crash barrier"],["Pannenhelfer","breakdown mechanic"],["Böschung","embankment"],["Brennnessel","stinging nettle"],["ölverschmiert","smeared with oil"],["Keilriemen","fan belt"],["hinüber sein","(colloquial) to be broken, done for"],["Lichtmaschine","alternator"],["abschleppen","to tow"],["Ersatzteil","spare part"],["Jugendherberge","youth hostel"],["Stockbett","bunk bed"],["promovieren","to get a doctorate"]],"q":[["Was war der ursprüngliche Plan?","In drei Tagen mit dem alten VW-Bus nach Kiel und Fehmarn an die Ostsee.","Etwa 800 Kilometer."],["Was stand auf der Liste des Onkels?","Nicht über 100, Öl prüfen, bei komischem Klang anhalten, viel Spaß.","Punkt vier wird am Ende wichtig."],["Was war kaputt am Bus?","Der Keilriemen, und die Lichtmaschine war fast hinüber.","Ersatzteil erst am Samstag."],["Warum fahren sie nicht nach Hause?","Hanna schlägt vor, einfach in Göttingen Urlaub zu machen.","Neue Stadt, freie Tage."],["Was meint Tim mit „Nur mit Punkt vier“?","Sie hatten trotz allem viel Spaß.","Die anderen Regeln wurden gebrochen oder wurden unwichtig."]],"teaser":"Vier Freunde, ein geliehener Bus, eine Panne auf der A7 und die Erkenntnis, dass die besten Urlaubspläne die sind, die schiefgehen.","words":815},{"id":"krimi","title":"Der Schlüssel unter der Fußmatte","level":"C2","topic":"Krimi · Gesellschaft","min":12,"p":["Hannelore Weiss war seit vier Jahren pensioniert und hatte sich, wie sie bei jeder Gelegenheit betonte, vollständig vom Verbrechen zurückgezogen. Sie las keine Krimis mehr, schaute keinen „Tatort“, und wenn ihr Enkel sie nach ihren alten Fällen fragte, wechselte sie das Thema. Dreißig Jahre bei der Kriminalpolizei in Stuttgart waren genug gewesen. Jetzt züchtete sie Tomaten auf ihrem Balkon in Degerloch und stritt mit ihrer Nachbarin über die korrekte Mülltrennung.","Herr Brandl aus dem dritten Stock war ihr seit Jahren nicht aufgefallen, und das war, im Nachhinein betrachtet, der erste Hinweis. Er war Ende sechzig, verwitwet, freundlich auf eine Art, die nichts von sich preisgab. Er grüßte, er trug den Müll pünktlich hinunter, er hatte jeden Dienstag Kehrwoche, wenn er dran war, und erledigte sie gründlicher als alle anderen. Er war, mit anderen Worten, so unauffällig, dass sein Fehlen niemandem auffiel. Außer Hannelore.","Es begann mit der Zeitung. Herr Brandl hatte eine Tageszeitung abonniert, die jeden Morgen vor seiner Tür lag. Am Montag lag sie noch um elf Uhr da. Am Dienstag lagen zwei dort. Am Mittwoch drei. Am Mittwoch hätte er außerdem Kehrwoche gehabt. Das Treppenhaus war nicht gewischt.","Hannelore klingelte. Niemand öffnete. Sie rief bei der Hausverwaltung an. Die Frau am Telefon war hörbar gelangweilt. „Der Herr ist vielleicht verreist. Das kommt vor.“","„Herr Brandl verreist nicht, ohne die Zeitung abzubestellen“, sagte Hannelore. „Er hat sie in zwölf Jahren kein einziges Mal liegen lassen. Und er verreist schon gar nicht in seiner Kehrwoche.“","„Frau Weiss, mit Verlaub, das ist kein Grund für eine Wohnungsöffnung.“","Hannelore legte auf. Sie kannte den Satz. Sie hatte ihn selbst oft genug gesagt.","Sie rief die Polizei an, die Nummer des örtlichen Reviers, nicht den Notruf. Ein junger Beamter versprach, „mal vorbeizuschauen“. Er kam am Nachmittag, klingelte, klopfte, schaute durch den Briefschlitz und sagte, er sehe nichts Auffälliges. Ohne konkrete Hinweise auf eine Gefahr könne er die Tür nicht öffnen lassen. „Vielleicht ist er bei Verwandten.“","„Er hat keine Verwandten. Seine Frau ist tot, Kinder hat er keine.“","Der Beamte notierte das. Er war höflich, aber Hannelore sah ihm an, dass er die Sache für die Sorge einer gelangweilten Rentnerin hielt. Sie hätte es an seiner Stelle wahrscheinlich auch so gesehen.","Am Abend tat sie etwas, das sie sich nicht erklären konnte, außer mit einer Gewohnheit, die dreißig Jahre alt war. Sie ging durch das Haus und sprach mit jedem Nachbarn, nicht mit Fragen, sondern mit Gesprächen. Über das Wetter, die Tomaten, die Müllabfuhr. Und dabei, ganz nebenbei, über Herrn Brandl.","Die Studentin im Erdgeschoss hatte ihn am Freitagabend gesehen, mit einer Reisetasche. „Er sah irgendwie aufgeregt aus“, sagte sie. „Er hat mich gefragt, ob ich weiß, wie man mit dem Handy ein Zugticket kauft.“ Die Familie im ersten Stock wusste nichts. Der ältere Herr im zweiten Stock erzählte, Brandl habe in letzter Zeit mehrfach Briefe mit einer ausländischen Briefmarke bekommen, „aus Österreich oder so“. Und Frau Lenz, die Nachbarin mit der falschen Mülltrennung, sagte etwas, das Hannelore aufhorchen ließ: „Er hat mir vor zwei Wochen seinen Ersatzschlüssel gegeben. Für Notfälle. Er hat gesagt, falls er mal nicht zurückkommt, soll ich die Blumen gießen. Ich dachte, das war ein Witz.“","Mit dem Schlüssel und Frau Lenz als Zeugin öffnete Hannelore am nächsten Morgen die Tür. Die Wohnung war aufgeräumt, die Pflanzen gegossen, der Kühlschrank fast leer. Kein Zeichen eines Kampfes, keine Spur eines Unfalls. Auf dem Küchentisch lag ein Umschlag, adressiert an „Den, der das hier findet“.","Hannelore öffnete ihn nicht sofort. Sie rief zuerst den jungen Beamten an. Diesmal kam er innerhalb von zwanzig Minuten.","Der Brief war kurz. Herr Brandl schrieb, er habe vor einem halben Jahr über ein Ahnenforschungsportal erfahren, dass er eine Halbschwester habe, in Innsbruck, von der er nichts gewusst habe. Sie sei achtzig und schwer krank. Er sei zu ihr gefahren und wisse nicht, wie lange er bleibe. „Ich habe niemandem davon erzählt, weil ich mich geschämt habe. Ich bin achtundsechzig und weiß nicht, wer mein Vater war. Bitte bestellen Sie die Zeitung ab. Und entschuldigen Sie wegen der Kehrwoche.“","Der junge Beamte las den Brief zweimal. „Dann ist ja alles in Ordnung“, sagte er erleichtert.","Hannelore schüttelte langsam den Kopf. „Nein“, sagte sie. „Es ist nicht in Ordnung, dass ein Mann zwölf Jahre in einem Haus wohnt und niemand weiß, dass er niemanden hat. Es ist nicht in Ordnung, dass ihm erst eine Datenbank im Internet sagen muss, dass es jemanden gibt.“ Sie hielt kurz inne. „Ein Verbrechen ist das nicht. Aber ein Fall ist es trotzdem.“","Drei Wochen später kam eine Postkarte aus Innsbruck. Vorne war die Nordkette im Schnee, hinten standen zwei Sätze in einer zittrigen, ungeübten Schrift, die nicht Herrn Brandls war: „Mein Bruder hat erzählt, dass Sie nach ihm gesucht haben. Danke, dass jemand gesucht hat.“","Hannelore stellte die Karte zwischen ihre Tomaten. Am folgenden Dienstag wischte sie das Treppenhaus im dritten Stock, obwohl es nicht ihre Kehrwoche war. Frau Lenz kam dazu und half. Sie stritten nicht einmal über den Müll."],"g":[["pensioniert","retired"],["sich zurückziehen von","to withdraw from"],["züchten","to grow, breed"],["im Nachhinein","in hindsight"],["verwitwet","widowed"],["preisgeben","to reveal"],["unauffällig","inconspicuous"],["abonnieren","to subscribe to"],["abbestellen","to cancel (a subscription)"],["mit Verlaub","with respect"],["Wohnungsöffnung","(forced) opening of a flat"],["Revier","police station"],["Briefschlitz","letterbox slot"],["aufhorchen","to prick up one's ears"],["Ersatzschlüssel","spare key"],["Zeugin","witness (female)"],["Ahnenforschung","genealogy"],["Halbschwester","half-sister"],["sich schämen","to be ashamed"],["zittrig","shaky"]],"q":[["Warum fällt Hannelore das Fehlen von Herrn Brandl auf?","Zeitungen stapeln sich und er macht seine Kehrwoche nicht – beides völlig untypisch.","Gerade seine Unauffälligkeit war auffällig."],["Warum hilft die Hausverwaltung und die Polizei zunächst nicht?","Ohne konkrete Hinweise auf Gefahr gibt es keinen Grund zur Wohnungsöffnung.","Hannelore kennt diese Logik aus eigener Erfahrung."],["Wie ermittelt Hannelore?","Durch scheinbar beiläufige Gespräche mit allen Nachbarn.","Alte Berufsgewohnheit."],["Was erklärt der Brief?","Brandl ist zu einer bisher unbekannten, kranken Halbschwester nach Innsbruck gefahren.","Er hatte sich geschämt."],["Warum ist es für Hannelore trotzdem „ein Fall“?","Weil niemand im Haus wusste, wie allein Brandl war – soziale Isolation als stilles Problem.","Kein Verbrechen, aber ein gesellschaftlicher Fall."]],"teaser":"Eine pensionierte Kommissarin, ein verschwundener Nachbar und ein Fall, den eigentlich niemand für einen Fall hält.","words":830},{"id":"handy","title":"Das Handy ist weg","level":"B2","topic":"Alltag · Polizei","min":6,"p":["„Mist, Mist, Mist!“ Aylin stand an der Haltestelle und tastete zum dritten Mal alle Taschen ab. Jacke, Hose, Rucksack. Nichts. Ihr Handy war weg.","„Alles okay?“, fragte ein älterer Mann neben ihr.","„Nein. Ich glaube, ich hab mein Handy in der Bahn liegen lassen.“","„Oh je. Welche Linie?“","„Die U14. Vor zehn Minuten.“","„Dann rufen Sie am besten sofort die SSB an. Die haben ein Fundbüro. Wollen Sie mein Handy nehmen?“","Aylin zögerte kurz, dann nahm sie es. „Das ist echt nett von Ihnen. Danke.“","Zuerst rief sie ihre eigene Nummer an. Es klingelte. Einmal, zweimal, dreimal. Dann nahm jemand ab. „Hallo?“, sagte eine junge Stimme.","„Hallo! Das ist mein Handy! Wo sind Sie?“","„Ich bin noch in der Bahn. Das lag auf dem Sitz neben mir. Ich steig in Heslach aus. Soll ich's beim Fahrer abgeben?“","„Nein, bitte nicht! Können Sie in Heslach auf mich warten? Ich nehme die nächste Bahn. Zehn Minuten, höchstens.“","„Okay, kein Ding. Ich warte am Bahnsteig. Ich hab eine rote Mütze.“","Aylin gab dem Mann sein Handy zurück. „Sie haben mir den Tag gerettet.“","„Ach was“, sagte er und winkte ab. „Das hätte jeder gemacht.“","In Heslach stand tatsächlich ein Junge mit roter Mütze, vielleicht sechzehn Jahre alt. Er hielt ihr Handy hoch. „Ist das Ihres?“","„Ja! Vielen, vielen Dank. Darf ich dir was geben? Für ein Eis oder so?“","Er schüttelte den Kopf. „Nee, passt schon. Meine Mutter hat ihr Handy letztes Jahr verloren. Hat's nie wiederbekommen. Das war richtig blöd.“","Aylin bestand trotzdem darauf und drückte ihm zehn Euro in die Hand. Er grinste. „Na gut. Dann halt ein großes Eis.“","Am Abend erzählte sie ihrer Kollegin davon. „Ich hab echt Glück gehabt“, sagte sie. „Zwei Fremde an einem Tag, beide total hilfsbereit.“","„Siehst du“, s
